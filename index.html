<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Zed West | نظام إدارة النظافة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0E2A2B">
<script src="qrcode.min.js"></script>
<script src="jsQR.js"></script>
<script src="chart.umd.min.js"></script>
<script src="supabase.js"></script>
<style>
:root{
  --ink:#0E2A2B;
  --ink-2:#153B3C;
  --mint:#1B8A6B;
  --mint-light:#E4F3EC;
  --sand:#F5F3EC;
  --paper:#FFFFFF;
  --amber:#DA8B1F;
  --amber-light:#FBF0DD;
  --coral:#D9483B;
  --coral-light:#FCE7E5;
  --line:#E3DFD2;
  --text:#1B1B18;
  --text-dim:#6B6A5F;
  --radius:14px;
  --shadow: 0 2px 10px rgba(14,42,43,.06), 0 1px 2px rgba(14,42,43,.08);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--sand);
  color:var(--text);
  font-family:'Tajawal',sans-serif;
  min-height:100vh;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3,.display{font-family:'Cairo',sans-serif;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}
::selection{background:var(--mint);color:#fff;}

/* ---------- corner-bracket signature ---------- */
.brackets{position:relative;}
.brackets::before,.brackets::after,.brackets .bk-tl,.brackets .bk-tr{content:"";}
.bk{position:absolute;width:16px;height:16px;pointer-events:none;}
.bk-tl{top:-1px;right:-1px;border-top:3px solid currentColor;border-right:3px solid currentColor;border-top-right-radius:6px;}
.bk-tr{top:-1px;left:-1px;border-top:3px solid currentColor;border-left:3px solid currentColor;border-top-left-radius:6px;}
.bk-bl{bottom:-1px;right:-1px;border-bottom:3px solid currentColor;border-right:3px solid currentColor;border-bottom-right-radius:6px;}
.bk-br{bottom:-1px;left:-1px;border-bottom:3px solid currentColor;border-left:3px solid currentColor;border-bottom-left-radius:6px;}
.viewfinder{position:relative;color:var(--mint);}

/* ---------- top bar ---------- */
.topbar{
  background:var(--ink);
  color:#fff;
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  position:sticky;top:0;z-index:50;
  box-shadow:var(--shadow);
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:38px;height:38px;position:relative;color:var(--mint);
  display:flex;align-items:center;justify-content:center;
  font-family:'Cairo';font-weight:900;font-size:15px;
  border:2px solid rgba(255,255,255,.15);
  border-radius:8px;
  background:rgba(255,255,255,.04);
}
.brand-text .t1{font-family:'Cairo';font-weight:900;font-size:16px;letter-spacing:.5px;line-height:1.1;}
.brand-text .t2{font-size:11px;color:#9FC9BE;margin-top:1px;}
.role-switch{
  display:flex;background:rgba(255,255,255,.08);border-radius:999px;padding:3px;gap:2px;
}
.role-switch button{
  border:none;background:transparent;color:#B9CFCB;padding:7px 14px;border-radius:999px;
  font-size:13px;font-weight:700;transition:.15s;
}
.role-switch button.active{background:var(--mint);color:#fff;}
.top-date{font-size:12px;color:#9FC9BE;display:flex;align-items:center;gap:6px;}

/* ---------- layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:20px;}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
.tabs button{
  border:1px solid var(--line);background:var(--paper);color:var(--text-dim);
  padding:9px 16px;border-radius:10px;font-weight:700;font-size:13.5px;transition:.15s;
}
.tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.tabs button:not(.active):hover{border-color:var(--mint);color:var(--ink);}

.section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px;}
.section-title h2{font-size:18px;margin:0;display:flex;align-items:center;gap:8px;}
.section-title .sub{font-size:12.5px;color:var(--text-dim);font-weight:500;}

/* ---------- cards / grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;}
.card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);position:relative;
}
.loc-group{margin-bottom:26px;}
.loc-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.loc-head .pin{
  width:30px;height:30px;border-radius:9px;background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.loc-head h3{margin:0;font-size:15.5px;}
.loc-head .cnt{font-size:12px;color:var(--text-dim);}

.task-card{display:flex;flex-direction:column;gap:10px;}
.task-card .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.task-name{font-weight:700;font-size:14.5px;line-height:1.4;}
.badge{
  font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap;flex-shrink:0;
  display:flex;align-items:center;gap:5px;
}
.badge.done{background:var(--mint-light);color:var(--mint);}
.badge.pending{background:var(--amber-light);color:var(--amber);}
.badge.dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.task-meta{font-size:12px;color:var(--text-dim);display:flex;flex-direction:column;gap:3px;}
.scan-btn{
  margin-top:4px;border:none;border-radius:10px;padding:10px;font-weight:800;font-size:13.5px;
  background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s;
}
.scan-btn:hover{background:var(--mint);}
.scan-btn.done{background:var(--mint-light);color:var(--mint);cursor:default;}
.scan-btn.done:hover{background:var(--mint-light);}

/* stats */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
.stat .num{font-family:'Cairo';font-weight:900;font-size:26px;line-height:1;}
.stat .lbl{font-size:12px;color:var(--text-dim);margin-top:6px;font-weight:700;}
.stat.mint .num{color:var(--mint);}
.stat.amber .num{color:var(--amber);}
.stat.coral .num{color:var(--coral);}
.stat.ink .num{color:var(--ink);}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;background:var(--paper);border:1px solid var(--line);padding:12px;border-radius:12px;}
.filters select,.filters input{
  border:1px solid var(--line);background:var(--sand);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--text);
}
.filters label{font-size:11px;color:var(--text-dim);font-weight:700;display:block;margin-bottom:3px;}
.fgroup{display:flex;flex-direction:column;}

/* table */
.tbl-wrap{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:var(--ink);color:#fff;text-align:right;padding:11px 12px;font-weight:700;font-size:12px;}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.rowbtn{cursor:pointer;transition:.1s;}
tr.rowbtn:hover{background:var(--sand);}
.thumb{width:34px;height:34px;border-radius:7px;object-fit:cover;border:1px solid var(--line);}
.empty-cell{color:var(--text-dim);font-size:12px;}

/* charts */
.chart-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
.chart-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;}
@media(max-width:800px){.chart-grid{grid-template-columns:1fr;}}

/* manage */
.manage-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:850px){.manage-cols{grid-template-columns:1fr;}}
.manage-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
.manage-card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;}
.manage-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);gap:8px;}
.manage-row:last-child{border-bottom:none;}
.manage-row .mi{font-size:13.5px;font-weight:700;}
.manage-row .ms{font-size:11.5px;color:var(--text-dim);}
.icon-btn{border:none;background:var(--sand);border-radius:8px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);flex-shrink:0;transition:.15s;}
.icon-btn:hover{background:var(--coral-light);color:var(--coral);}
.icon-btn.qr:hover{background:var(--mint-light);color:var(--mint);}
.form-row{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
.form-row label{font-size:12px;font-weight:700;color:var(--text-dim);}
.form-row input,.form-row select,.form-row textarea{
  border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;background:var(--sand);
}
.form-row textarea{resize:vertical;min-height:60px;}
.primary-btn{
  border:none;background:var(--mint);color:#fff;border-radius:10px;padding:11px;font-weight:800;font-size:14px;width:100%;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s;
}
.primary-btn:hover{background:#157058;}
.primary-btn:disabled{background:#ccc;cursor:not-allowed;}
.ghost-btn{border:1px solid var(--line);background:var(--paper);color:var(--text);border-radius:10px;padding:10px;font-weight:700;font-size:13px;}
.ghost-btn:hover{border-color:var(--mint);color:var(--mint);}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(14,42,43,.55);backdrop-filter:blur(2px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .15s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--paper);border-radius:18px;max-width:440px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .18s ease;}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal.wide{max-width:560px;}
.modal-head{padding:18px 20px 10px;display:flex;justify-content:space-between;align-items:flex-start;}
.modal-head h3{margin:0;font-size:16.5px;}
.modal-head .close{border:none;background:var(--sand);width:30px;height:30px;border-radius:50%;color:var(--text-dim);flex-shrink:0;font-size:15px;}
.modal-body{padding:6px 20px 20px;}

.scan-stage{background:var(--ink);border-radius:14px;overflow:hidden;position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;}
.scan-stage video{width:100%;height:100%;object-fit:cover;}
.scan-frame{position:absolute;inset:16%;border-radius:16px;}
.scan-frame .bk{width:26px;height:26px;color:#fff;}
.scan-hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#fff;font-size:12px;background:rgba(0,0,0,.35);padding:6px;}
.scan-msg{color:#fff;text-align:center;padding:20px;font-size:13px;line-height:1.7;}
.scan-msg .em{font-size:34px;display:block;margin-bottom:8px;}
.scan-actions{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
.file-btn{position:relative;overflow:hidden;text-align:center;}
.file-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
.manual-toggle{text-align:center;font-size:11.5px;color:var(--text-dim);margin-top:10px;text-decoration:underline;background:none;border:none;}

.confirm-task{background:var(--mint-light);color:var(--ink);border-radius:12px;padding:12px 14px;margin-bottom:14px;}
.confirm-task .ct-name{font-family:'Cairo';font-weight:800;font-size:15px;}
.confirm-task .ct-loc{font-size:12px;color:var(--mint);font-weight:700;margin-top:2px;}
.photo-preview{width:100%;max-height:160px;object-fit:cover;border-radius:10px;margin-top:8px;border:1px solid var(--line);}

.qr-modal-body{text-align:center;}
#qr-render-target{display:flex;justify-content:center;margin:10px 0;}
#qr-render-target img,#qr-render-target canvas{border-radius:10px;border:8px solid #fff;box-shadow:var(--shadow);}
.qr-caption{font-family:'Cairo';font-weight:800;font-size:14px;margin-top:4px;}
.qr-sub{font-size:12px;color:var(--text-dim);}

/* detail modal */
.dl{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;}
.dl:last-child{border-bottom:none;}
.dl .k{color:var(--text-dim);}
.dl .v{font-weight:700;text-align:left;}
.detail-photo{width:100%;border-radius:12px;margin-top:10px;border:1px solid var(--line);}
.detail-notes{background:var(--sand);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:8px;}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:12px;font-weight:700;font-size:13.5px;box-shadow:var(--shadow);z-index:400;display:flex;align-items:center;gap:8px;animation:pop .18s ease;}
.toast.ok{background:var(--mint);}
.empty-state{text-align:center;padding:50px 20px;color:var(--text-dim);}
.empty-state .em{font-size:38px;display:block;margin-bottom:10px;}
.print-sheet{display:none;}
@media print{
  body *{visibility:hidden;}
  .print-sheet,.print-sheet *{visibility:visible;}
  .print-sheet{display:block;position:absolute;top:0;right:0;left:0;}
}
.print-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:20px;}
.print-tile{border:2px dashed #999;border-radius:10px;text-align:center;padding:12px;}
.print-tile .pn{font-family:'Cairo';font-weight:800;font-size:12px;margin-top:6px;}
.print-tile .pl{font-size:10px;color:#666;}
@media(max-width:640px){
  .wrap{padding:12px;}
  .grid{grid-template-columns:1fr;}
  .chart-grid{grid-template-columns:1fr;}
  .brand-text .t2{display:none;}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-host"></div>

<script>
/* ============================= SUPABASE CONFIG ============================= */
/* 1) روح على https://supabase.com وأنشئ مشروع مجاني
   2) من Project Settings > API خد "Project URL" و "anon public key"
   3) الصقهم هنا مكان القيمتين التاليتين قبل ما ترفع الملف */
const SUPABASE_URL = 'https://msszjzechwurofsrjydt.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_xtYKER8VsZPhQSBVmclExg_aQv_-xZZ';

const sb = (SUPABASE_URL.startsWith('http'))
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

function configMissing(){ return !sb; }

/* ============================= AUTH ============================= */
async function fetchProfile(userId){
  const {data,error} = await sb.from('profiles').select('*').eq('id', userId).maybeSingle();
  if(error){ console.error(error); return null; }
  return data;
}

async function refreshSession(){
  const {data} = await sb.auth.getSession();
  S.session = data.session || null;
  if(S.session){
    S.profile = await fetchProfile(S.session.user.id);
    S.role = (S.profile && S.profile.role==='admin') ? 'admin' : 'supervisor';
    if(S.profile && S.profile.full_name) S.supervisor_name = S.profile.full_name;
  } else {
    S.profile = null;
  }
}

async function doSignUp(){
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const full_name = document.getElementById('auth-fullname').value.trim();
  if(!email || !password || !full_name){ S.authError='من فضلك استكمل كل الحقول'; render(); return; }
  if(password.length < 6){ S.authError='الباسورد لازم يكون 6 حروف/أرقام على الأقل'; render(); return; }
  S.authBusy=true; S.authError=''; render();
  const {error} = await sb.auth.signUp({ email, password, options:{ data:{ full_name } } });
  S.authBusy=false;
  if(error){ S.authError = translateAuthError(error.message); render(); return; }
  await refreshSession();
  render();
  toast('تم إنشاء الحساب بنجاح', true);
}

async function doSignIn(){
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  if(!email || !password){ S.authError='من فضلك اكتب الإيميل والباسورد'; render(); return; }
  S.authBusy=true; S.authError=''; render();
  const {error} = await sb.auth.signInWithPassword({ email, password });
  S.authBusy=false;
  if(error){ S.authError = translateAuthError(error.message); render(); return; }
  await refreshSession();
  await loadAll();
}

async function doSignOut(){
  await sb.auth.signOut();
  S.session=null; S.profile=null;
  render();
}

function translateAuthError(msg){
  if(/already registered/i.test(msg)) return 'الإيميل ده مسجل بالفعل، جرب تسجيل الدخول';
  if(/invalid login credentials/i.test(msg)) return 'الإيميل أو الباسورد غلط';
  if(/password/i.test(msg)) return 'الباسورد لازم يكون 6 حروف على الأقل';
  return 'حصل خطأ: '+msg;
}

/* ============================= STATE ============================= */
let S = {
  role: 'supervisor',
  tab: 'checklist',
  locations: [],
  tasks: [],
  instances: {},        // date -> array of instance objects
  today: todayStr(),
  supervisor_name: '',
  filters: { date:'', location:'all', supervisor:'all', status:'all' },
  scanCtx: null,        // {instance, task, location}
  manualOpen:false,
  stream:null,
  editingLoc:null,
  editingTask:null,
  qrTarget:null,
  detailInstance:null,
  session:null,
  profile:null,
  authMode:'login',     // 'login' | 'signup'
  authError:'',
  authBusy:false,
  users:[],
};

function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtDate(s){ const d=new Date(s+'T00:00:00'); return d.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'}); }
function fmtTime(iso){ const d=new Date(iso); return d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}); }
function uid(p){ return p+'_'+Math.random().toString(36).slice(2,9); }

async function dbFetchLocations(){
  const {data,error} = await sb.from('locations').select('*').order('name');
  if(error){ console.error(error); return []; }
  return data||[];
}
async function dbFetchTasks(){
  const {data,error} = await sb.from('tasks').select('*');
  if(error){ console.error(error); return []; }
  return data||[];
}
async function dbFetchInstances(date){
  const {data,error} = await sb.from('instances').select('*').eq('date', date);
  if(error){ console.error(error); return []; }
  return data||[];
}
async function dbInsert(table, rows){
  if(!rows || !rows.length) return;
  const {error} = await sb.from(table).insert(rows);
  if(error) console.error(table, error);
}
async function dbUpsert(table, rows){
  if(!rows || !rows.length) return;
  const {error} = await sb.from(table).upsert(rows);
  if(error) console.error(table, error);
}
async function dbUpdate(table, id, patch){
  const {error} = await sb.from(table).update(patch).eq('id', id);
  if(error) console.error(table, error);
}
async function dbUpdateWhere(table, column, value, patch){
  const {error} = await sb.from(table).update(patch).eq(column, value);
  if(error) console.error(table, error);
}
async function dbDelete(table, id){
  const {error} = await sb.from(table).delete().eq('id', id);
  if(error) console.error(table, error);
}

/* local, per-device preferences (name / role) — no need to centralize these */
function loadPrefs(){
  try{ return JSON.parse(localStorage.getItem('zw_prefs')||'null'); }catch(e){ return null; }
}
function savePrefsLocal(){
  try{ localStorage.setItem('zw_prefs', JSON.stringify({supervisor_name:S.supervisor_name, role:S.role})); }catch(e){}
}

/* ============================= SEED DATA ============================= */
function seedLocations(){
  return [
    {id:uid('loc'), name:'عمارة A', building:'قطاع الشمال'},
    {id:uid('loc'), name:'عمارة B', building:'قطاع الشمال'},
    {id:uid('loc'), name:'الجراج الرئيسي', building:'خدمات عامة'},
  ];
}
function seedTasks(locs){
  const items = ['تنظيف مدخل العمارة','تنظيف المصعد','تفريغ سلال المهملات','كنس ومسح الدرج','تعقيم مقابض الأبواب'];
  const tasks=[];
  locs.slice(0,2).forEach(loc=>{
    items.forEach(name=>{
      tasks.push({id:uid('task'), name, description:'', frequency:'يومي', location_id:loc.id, active:true});
    });
  });
  tasks.push({id:uid('task'), name:'تنظيف أرضية الجراج', description:'إزالة البقع وكنس الأرضية', frequency:'يومي', location_id:locs[2].id, active:true});
  return tasks;
}

/* ============================= LOAD / SAVE ============================= */
async function loadAll(){
  if(configMissing()){ render(); return; }
  if(!S.session){ render(); return; }

  let locs = await dbFetchLocations();
  let tasks = await dbFetchTasks();
  if(!locs.length && S.profile && S.profile.role==='admin'){ locs = seedLocations(); await dbInsert('locations', locs); }
  if(!tasks.length && locs.length && S.profile && S.profile.role==='admin'){ tasks = seedTasks(locs); await dbInsert('tasks', tasks); }
  S.locations = locs; S.tasks = tasks;

  const pref = loadPrefs();
  if(pref && pref.role && S.profile && S.profile.role==='admin') S.role = pref.role;

  await ensureTodayInstances();
  if(S.profile && S.profile.role==='admin') await loadUsers();
  render();
}

async function saveUser(id){
  const role = document.querySelector(`[data-u-role="${id}"]`).value;
  const active = document.querySelector(`[data-u-active="${id}"]`).value === '1';
  const locsSel = document.querySelector(`[data-u-locs="${id}"]`);
  const allowed_locations = Array.from(locsSel.selectedOptions).map(o=>o.value);
  await dbUpdate('profiles', id, { role, active, allowed_locations });
  await loadUsers();
  render();
  toast('تم حفظ صلاحيات المستخدم', true);
}

async function loadUsers(){
  const {data,error} = await sb.from('profiles').select('*').order('created_at');
  if(error){ console.error(error); return; }
  S.users = (data||[]).map(u=>({...u, allowed_locations: u.allowed_locations||[]}));
}

async function loadInstancesFor(date){
  const data = await dbFetchInstances(date);
  S.instances[date] = data;
  return data;
}

async function saveInstancesFor(date){
  await dbUpsert('instances', S.instances[date] || []);
}

async function ensureTodayInstances(){
  const date = todayStr();
  let list = await loadInstancesFor(date);
  const activeTasks = S.tasks.filter(t=>t.active);
  const missing=[];
  activeTasks.forEach(t=>{
    if(!list.find(i=>i.task_id===t.id)){
      missing.push({
        id: uid('inst'), date, task_id:t.id, location_id:t.location_id,
        status:'incomplete', supervisor_name:'', completed_at:null, notes:'', photo:null, scanned:false
      });
    }
  });
  if(missing.length){ await dbInsert('instances', missing); list = list.concat(missing); }
  S.instances[date]=list;
}

/* ============================= TOAST ============================= */
function toast(msg, ok){
  const host=document.getElementById('toast-host');
  const el=document.createElement('div');
  el.className='toast'+(ok?' ok':'');
  el.innerHTML = (ok?ICON.check(16):ICON.info(16)) + '<span>'+msg+'</span>';
  host.appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}

/* ============================= RENDER ROOT ============================= */
function render(){
  const app=document.getElementById('app');
  if(configMissing()){
    app.innerHTML = `
    <div style="max-width:480px;margin:60px auto;padding:24px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);text-align:center;">
      <div style="font-size:34px;margin-bottom:10px;">🔌</div>
      <h2 style="margin:0 0 10px;">التطبيق يحتاج إعداد</h2>
      <p style="font-size:13.5px;color:var(--text-dim);line-height:1.8;">
        من فضلك افتح ملف <b>index.html</b> وضع مفاتيح Supabase الخاصة بك في أعلى كود الجافاسكريبت
        (<code>SUPABASE_URL</code> و <code>SUPABASE_ANON_KEY</code>)، ثم أعد رفع الملف.
      </p>
    </div>`;
    return;
  }
  if(!S.session){
    app.innerHTML = renderAuthScreen();
    bindAuthEvents();
    return;
  }
  app.innerHTML = `
    ${renderTopbar()}
    <div class="wrap">
      ${S.role==='supervisor' ? renderSupervisorTabs() : renderAdminTabs()}
      ${S.role==='supervisor' ? renderSupervisorBody() : renderAdminBody()}
    </div>
    ${renderModals()}
  `;
  bindEvents();
  if(S.role==='admin' && S.tab==='dashboard') drawCharts();
}

        <div style="font-family:'Cairo';font-weight:900;font-size:17px;color:var(--ink);">ZED WEST</div>
        <div style="font-size:12px;color:var(--text-dim);margin-top:2px;">نظام إدارة النظافة</div>
      </div>
      <h3 style="text-align:center;margin:0 0 16px;font-size:16px;">${isLogin?'تسجيل الدخول':'إنشاء حساب جديد'}</h3>
      ${!isLogin?`<div class="form-row"><label>الاسم الكامل</label><input id="auth-fullname" placeholder="مثال: أحمد محمود"></div>`:''}
      <div class="form-row"><label>الإيميل</label><input id="auth-email" type="email" placeholder="example@email.com"></div>
      <div class="form-row"><label>الباسورد</label><input id="auth-password" type="password" placeholder="6 حروف على الأقل"></div>
      ${S.authError?`<div style="background:var(--coral-light);color:var(--coral);padding:9px 12px;border-radius:9px;font-size:12.5px;margin-bottom:10px;">${esc(S.authError)}</div>`:''}
      <button class="primary-btn" id="auth-submit" ${S.authBusy?'disabled':''}>${S.authBusy? '...جارِ التحميل' : (isLogin?'دخول':'إنشاء الحساب')}</button>
      <div style="text-align:center;margin-top:14px;font-size:12.5px;color:var(--text-dim);">
        ${isLogin? 'مفيش حساب؟ ' : 'عندك حساب بالفعل؟ '}
        <button id="auth-toggle" style="background:none;border:none;color:var(--mint);font-weight:800;cursor:pointer;text-decoration:underline;">${isLogin?'اعمل حساب جديد':'سجّل دخولك'}</button>

function bindAuthEvents(){
  const submit = document.getElementById('auth-submit');
  if(submit) submit.onclick = ()=> S.authMode==='login' ? doSignIn() : doSignUp();
  const toggle = document.getElementById('auth-toggle');
  if(toggle) toggle.onclick = ()=>{ S.authMode = S.authMode==='login'?'signup':'login'; S.authError=''; render(); };
}

function renderSupervisorTabs(){
  return `<div class="tabs">
    <button data-tab="checklist" class="${S.tab==='checklist'?'active':''}">${ICON.check(14)} قائمة اليوم</button>

function renderSupervisorBody(){
  if(S.tab==='myname') return renderMyName();
  const allowed = (S.profile && S.profile.allowed_locations && S.profile.allowed_locations.length) ? S.profile.allowed_locations : null;
  const myLocations = allowed ? S.locations.filter(l=>allowed.includes(l.id)) : S.locations;
  const list = (S.instances[S.today] || []).filter(i=> myLocations.some(l=>l.id===i.location_id));
  const total = list.length, done = list.filter(i=>i.status==='completed').length;
  if(!myLocations.length) return `<div class="empty-state"><span class="em">🧹</span>لا توجد مواقع متاحة لك بعد. اطلب من الإدارة تحديد مواقعك.</div>`;

  let html = `<div class="stat-row">
    <div class="stat mint"><div class="num">${done}/${total}</div><div class="lbl">مهام منجزة اليوم</div></div>
    <div class="stat amber"><div class="num">${total-done}</div><div class="lbl">متبقية</div></div>
    <div class="stat ink"><div class="num">${total?Math.round(done/total*100):0}%</div><div class="lbl">نسبة الإنجاز</div></div>
  </div>`;

  myLocations.forEach(loc=>{
    const locTasks = S.tasks.filter(t=>t.location_id===loc.id && t.active);
    if(!locTasks.length) return;
    html += `<div class="loc-group">
      <div class="loc-head">
        <div class="pin">${ICON.pin(15)}</div>
        <div><h3>${esc(loc.name)}</h3><div class="cnt">${loc.building||''} · ${locTasks.length} مهمة</div></div>
      </div>
      <div class="grid">
        ${locTasks.map(t=>{
          const inst = list.find(i=>i.task_id===t.id) || {};
          const isDone = inst.status==='completed';
          return `<div class="card task-card">
            <div class="top-row">
              <div class="task-name">${esc(t.name)}</div>
              <div class="badge ${isDone?'done':'pending'}"><span class="dot"></span>${isDone?'منجز':'لم يُنفذ'}</div>
            </div>
            <div class="task-meta">
              ${isDone ? `<span>${ICON.clock(12)} نُفذ الساعة ${fmtTime(inst.completed_at)} بواسطة ${esc(inst.supervisor_name||'-')}</span>` : `<span>يتطلب مسح رمز QR الموجود في الموقع فعليًا</span>`}
            </div>
            <button class="scan-btn ${isDone?'done':''}" data-scan="${t.id}">
              ${isDone? ICON.check(15) : ICON.qr(15)}
              ${isDone? 'تم التنفيذ' : 'مسح QR وتأكيد التنفيذ'}
            </button>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  });
  return html;
}

function renderAdminBody(){
  if(S.tab==='dashboard') return renderDashboard();
  if(S.tab==='log') return renderLog();
  if(S.tab==='manage') return renderManage();
  if(S.tab==='users') return renderUsers();
  if(S.tab==='qrsheet') return renderQrSheet();

function allInstancesFlat(){
  let out=[];
  Object.keys(S.instances).forEach(date=>{ out = out.concat(S.instances[date]); });
  return out;
}

function renderDashboard(){
  const todayList = S.instances[S.today] || [];
  const total = todayList.length, done = todayList.filter(i=>i.status==='completed').length;
  const supervisorsToday = new Set(todayList.filter(i=>i.supervisor_name).map(i=>i.supervisor_name)).size;

  return `
  <div class="stat-row">
    <div class="stat ink"><div class="num">${total}</div><div class="lbl">إجمالي مهام اليوم</div></div>
    <div class="stat mint"><div class="num">${done}</div><div class="lbl">مهام منجزة</div></div>
    <div class="stat amber"><div class="num">${total-done}</div><div class="lbl">مهام غير منجزة</div></div>
    <div class="stat coral"><div class="num">${total?Math.round(done/total*100):0}%</div><div class="lbl">نسبة الإنجاز اليوم</div></div>
  </div>
  <div class="chart-grid">
    <div class="chart-card"><h3 style="margin-top:0;font-size:14px;">الإنجاز حسب الموقع (اليوم)</h3><canvas id="chartLoc" height="200"></canvas></div>
    <div class="chart-card"><h3 style="margin-top:0;font-size:14px;">نشاط آخر 7 أيام</h3><canvas id="chartWeek" height="200"></canvas></div>
  </div>
  <div class="section-title"><h2>مهام اليوم غير المنجزة</h2></div>
  ${renderPendingList(todayList)}
  `;
}

function renderPendingList(list){
  const pending = list.filter(i=>i.status!=='completed');
  if(!pending.length) return `<div class="empty-state"><span class="em">✅</span>كل المهام منجزة اليوم — عمل رائع!</div>`;
  return `<div class="tbl-wrap"><table><thead><tr><th>المهمة</th><th>الموقع</th><th>الحالة</th></tr></thead><tbody>
    ${pending.map(i=>{
      const t=S.tasks.find(x=>x.id===i.task_id); const loc=S.locations.find(x=>x.id===i.location_id);
      return `<tr><td>${esc(t?t.name:'-')}</td><td>${esc(loc?loc.name:'-')}</td><td><span class="badge pending"><span class="dot"></span>لم يُنفذ</span></td></tr>`;
    }).join('')}
  </tbody></table></div>`;
}

function renderLog(){
  const flat = allInstancesFlat().filter(i=>i.status==='completed').sort((a,b)=> new Date(b.completed_at) - new Date(a.completed_at));
  const supervisors = Array.from(new Set(flat.map(i=>i.supervisor_name).filter(Boolean)));
  const f = S.filters;
  let rows = flat;
  if(f.date) rows = rows.filter(i=>i.date===f.date);
  if(f.location!=='all') rows = rows.filter(i=>i.location_id===f.location);
  if(f.supervisor!=='all') rows = rows.filter(i=>i.supervisor_name===f.supervisor);

  return `
  <div class="filters">
    <div class="fgroup"><label>التاريخ</label><input type="date" id="f-date" value="${f.date}"></div>
    <div class="fgroup"><label>الموقع</label><select id="f-loc">
      <option value="all">كل المواقع</option>
      ${S.locations.map(l=>`<option value="${l.id}" ${f.location===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}
    </select></div>
    <div class="fgroup"><label>المشرف</label><select id="f-sup">
      <option value="all">كل المشرفين</option>
      ${supervisors.map(s=>`<option value="${esc(s)}" ${f.supervisor===s?'selected':''}>${esc(s)}</option>`).join('')}
    </select></div>
    <div class="fgroup" style="justify-content:flex-end;"><button class="ghost-btn" id="f-clear">مسح الفلاتر</button></div>
  </div>
  <div class="tbl-wrap"><table><thead><tr><th>المهمة</th><th>الموقع</th><th>المشرف</th><th>الوقت</th><th>صورة</th></tr></thead><tbody>
  ${rows.length? rows.map(i=>{
    const t=S.tasks.find(x=>x.id===i.task_id); const loc=S.locations.find(x=>x.id===i.location_id);
    return `<tr class="rowbtn" data-detail="${i.date}|${i.id}">
      <td>${esc(t?t.name:'-')}</td>
      <td>${esc(loc?loc.name:'-')}</td>
      <td>${esc(i.supervisor_name||'-')}</td>
      <td>${fmtTime(i.completed_at)} · ${i.date}</td>
      <td>${i.photo?`<img class="thumb" src="${i.photo}">`:'<span class="empty-cell">-</span>'}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="5" class="empty-cell" style="text-align:center;padding:26px;">لا توجد سجلات مطابقة</td></tr>`}
  </tbody></table></div>`;
}

      ${S.locations.map(l=>`<div class="manage-row">
        <div><div class="mi">${esc(l.name)}</div><div class="ms">${esc(l.building||'')}</div></div>
        <div style="display:flex;gap:6px;">
          <button class="icon-btn qr" data-qr-loc="${l.id}" title="عرض QR">${ICON.qr(14)}</button>
          <button class="icon-btn" data-del-loc="${l.id}" title="حذف">${ICON.trash(14)}</button>

  // manage - tasks

function openScan(task_id){

async function startScanner(){
  const stage = document.getElementById('scan-stage');
  const msgBox = document.getElementById('scan-msg');
  if(!stage) return;
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } });
    S.stream = stream;
    stage.innerHTML = `<video id="scan-video" autoplay playsinline muted></video>
      <div class="scan-frame">${ICON.bracket()}</div>
      <div class="scan-hint">وجّه الكاميرا نحو رمز QR الملصق في الموقع</div>`;
    const video = document.getElementById('scan-video');
    video.srcObject = stream;
    await video.play();
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    let stopped=false;
    S.stopLoop = ()=>{ stopped=true; };
    function tick(){
      if(stopped || !S.scanCtx) return;
      if(video.readyState===video.HAVE_ENOUGH_DATA){
        canvas.width=video.videoWidth; canvas.height=video.videoHeight;
        ctx.drawImage(video,0,0,canvas.width,canvas.height);
        const img=ctx.getImageData(0,0,canvas.width,canvas.height);
        const code = jsQR(img.data, img.width, img.height);
        if(code && code.data){ stopped=true; handleScannedCode(code.data); return; }
      }
      requestAnimationFrame(tick);
    }
    tick();
  }catch(e){
    if(msgBox) msgBox.innerHTML = `<span class="em">🚫</span>تعذّر الوصول إلى الكاميرا (قد تكون غير مسموحة في هذه البيئة).<br>استخدم "رفع صورة لرمز QR" أدناه بدلاً من ذلك.`;
  }
}

function stopScanner(){
  if(S.stopLoop) S.stopLoop();
  if(S.stream){ S.stream.getTracks().forEach(t=>t.stop()); S.stream=null; }
}

function decodeFromFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      const canvas=document.createElement('canvas');
      canvas.width=img.width; canvas.height=img.height;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0);
      const data = ctx.getImageData(0,0,canvas.width,canvas.height);
      const code = jsQR(data.data, data.width, data.height);
      if(code && code.data) handleScannedCode(code.data);
      else toast('لم يتم التعرف على رمز QR في الصورة، حاول مرة أخرى', false);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function handleScannedCode(code){
  const clean = (code||'').trim();
  const task_id = clean.startsWith('ZEDWEST|TASK|') ? clean.split('|')[2] : clean;
  const task = S.tasks.find(t=>t.id===task_id);
  if(!task){ toast('الكود غير صحيح أو المهمة غير موجودة', false); return; }
  if(S.scanCtx && task.id !== S.scanCtx.task_id){
    toast('هذا الرمز يخص مهمة مختلفة عن التي تحاول تنفيذها', false); return;
  }
  const location = S.locations.find(l=>l.id===task.location_id);
  const list = S.instances[S.today]||[];
  const instance = list.find(i=>i.task_id===task.id);
  stopScanner();
  S.scanCtx=null;
  S.confirmCtx = { task, location, instance };
  render();
}

let pendingPhoto = null;
function handlePhotoSelect(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload=(e)=>{
    const img=new Image();
    img.onload=()=>{
      const maxW=700;
      const scale = Math.min(1, maxW/img.width);
      const canvas=document.createElement('canvas');
      canvas.width=img.width*scale; canvas.height=img.height*scale;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      pendingPhoto = canvas.toDataURL('image/jpeg',0.6);
      const prev=document.getElementById('cf-photo-preview');
      prev.src=pendingPhoto; prev.style.display='block';
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

async function submitConfirm(){
  const name = document.getElementById('cf-name').value.trim();
  if(!name){ toast('من فضلك اكتب اسم المشرف', false); return; }
  const notes = document.getElementById('cf-notes').value.trim();
  const {task, instance} = S.confirmCtx;
  const list = S.instances[S.today];
  const idx = list.findIndex(i=>i.id===instance.id);
  if(idx===-1) return;
  const patch = {
    status:'completed', supervisor_name:name, completed_at:new Date().toISOString(),
    notes, photo: pendingPhoto, scanned:true
  };
  list[idx] = { ...list[idx], ...patch };
  await dbUpdate('instances', instance.id, patch);
  S.supervisor_name = name; await savePrefs();
  pendingPhoto=null;
  S.confirmCtx=null;
  render();
  toast('تم تسجيل تنفيذ المهمة بنجاح', true);
}

/* build hidden print sheet with a QR per active task, rendered right before print */
function buildPrintPreview(){
  const holder = document.getElementById('print-preview');
  if(!holder) return;
  holder.innerHTML='';
  const activeTasks = S.tasks.filter(t=>t.active);
  activeTasks.forEach(t=>{
    const loc = S.locations.find(l=>l.id===t.location_id);
    const tile = document.createElement('div');
    tile.className='print-tile brackets';
    const qrDiv = document.createElement('div');
    tile.appendChild(qrDiv);
    const pn = document.createElement('div'); pn.className='pn'; pn.textContent=t.name;
    const pl = document.createElement('div'); pl.className='pl'; pl.textContent=loc?loc.name:'';
    tile.appendChild(pn); tile.appendChild(pl);
    holder.appendChild(tile);
    new QRCode(qrDiv, { text:'ZEDWEST|TASK|'+t.id, width:120, height:120, colorDark:'#0E2A2B', colorLight:'#ffffff' });
  });
}

  const cWeek = document.getElementById('chartWeek');
  if(chartLocInst){ chartLocInst.destroy(); chartLocInst=null; }
  if(chartWeekInst){ chartWeekInst.destroy(); chartWeekInst=null; }

  if(cLoc){
    const todayList = S.instances[S.today]||[];
    const labels = S.locations.map(l=>l.name);
    const data = S.locations.map(l=>{
      const items = todayList.filter(i=>i.location_id===l.id);
      if(!items.length) return 0;
      return Math.round(items.filter(i=>i.status==='completed').length/items.length*100);
    });
    chartLocInst = new Chart(cLoc, {
      type:'bar',
      data:{ labels, datasets:[{ label:'نسبة الإنجاز %', data, backgroundColor:'#1B8A6B', borderRadius:6, maxBarThickness:40 }] },
      options:{ plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true, max:100, ticks:{callback:v=>v+'%'} } } }
    });
  }
  if(cWeek){
    const days=[]; const vals=[];
    for(let i=6;i>=0;i--){
      const d=new Date(); d.setDate(d.getDate()-i);
      const ds=d.toISOString().slice(0,10);
      days.push(d.toLocaleDateString('ar-EG',{weekday:'short'}));
      const list = S.instances[ds] || [];
      vals.push(list.filter(x=>x.status==='completed').length);
    }
    chartWeekInst = new Chart(cWeek, {
      type:'line',
      data:{ labels:days, datasets:[{ label:'مهام منجزة', data:vals, borderColor:'#0E2A2B', backgroundColor:'rgba(27,138,107,.15)', fill:true, tension:.35, pointBackgroundColor:'#1B8A6B' }] },
      options:{ plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true, ticks:{stepSize:1} } } }
    });
  }
}

/* ============================= LOAD WEEK DATA FOR CHART (best effort) ============================= */
async function preloadWeek(){
  for(let i=0;i<7;i++){
    const d=new Date(); d.setDate(d.getDate()-i);
    const ds=d.toISOString().slice(0,10);
    if(!S.instances[ds]) await loadInstancesFor(ds);
  }
}

/* ============================= INIT ============================= */
(async function init(){
  if(!configMissing()){
    await refreshSession();
    sb.auth.onAuthStateChange(async (event)=>{
      if(event==='SIGNED_OUT'){ S.session=null; S.profile=null; render(); }
    });
  }
  await loadAll();
  if(!configMissing() && S.session){
    await preloadWeek();
    render();
  }
  // hook print preview build whenever qrsheet tab active
  const obs = new MutationObserver(()=>{
    if(document.getElementById('print-preview')) buildPrintPreview();
  });
  obs.observe(document.getElementById('app'), {childList:true, subtree:true});
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
