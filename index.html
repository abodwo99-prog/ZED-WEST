<style>
:root{
  --ink:#0E2A2B; --ink-2:#153B3C; --mint:#1B8A6B; --mint-light:#E4F3EC;
  --sand:#F5F3EC; --paper:#FFFFFF; --amber:#DA8B1F; --amber-light:#FBF0DD;
  --coral:#D9483B; --coral-light:#FCE7E5; --blue:#2463C4; --blue-light:#E5EEFC;
  --line:#E3DFD2; --text:#1B1B18; --text-dim:#6B6A5F; --radius:14px;
  --shadow: 0 2px 10px rgba(14,42,43,.06), 0 1px 2px rgba(14,42,43,.08);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:var(--sand); color:var(--text); font-family:'Tajawal',sans-serif; min-height:100vh; font-variant-numeric:tabular-nums;}
h1,h2,h3,.display{font-family:'Cairo',sans-serif;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}
.bk{position:absolute;width:16px;height:16px;pointer-events:none;}
.bk-tl{top:-1px;right:-1px;border-top:3px solid currentColor;border-right:3px solid currentColor;border-top-right-radius:6px;}
.bk-tr{top:-1px;left:-1px;border-top:3px solid currentColor;border-left:3px solid currentColor;border-top-left-radius:6px;}
.bk-bl{bottom:-1px;right:-1px;border-bottom:3px solid currentColor;border-right:3px solid currentColor;border-bottom-right-radius:6px;}
.bk-br{bottom:-1px;left:-1px;border-bottom:3px solid currentColor;border-left:3px solid currentColor;border-bottom-right-radius:6px;}
.viewfinder{position:relative;color:var(--mint);}
.topbar{background:var(--ink);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:50;box-shadow:var(--shadow);flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:38px;height:38px;position:relative;color:var(--mint);display:flex;align-items:center;justify-content:center;font-family:'Cairo';font-weight:900;font-size:15px;border:2px solid rgba(255,255,255,.15);border-radius:8px;background:rgba(255,255,255,.04);}
.brand-text .t1{font-family:'Cairo';font-weight:900;font-size:16px;letter-spacing:.5px;line-height:1.1;}
.brand-text .t2{font-size:11px;color:#9FC9BE;margin-top:1px;}
.role-badge{background:rgba(255,255,255,.1);color:#fff;padding:5px 12px;border-radius:999px;font-size:11.5px;font-weight:800;}
.wrap{max-width:1200px;margin:0 auto;padding:20px;}
.shell{display:flex;gap:18px;align-items:flex-start;max-width:1300px;margin:0 auto;padding:20px;}
.sidebar{width:230px;flex-shrink:0;display:flex;flex-direction:column;gap:3px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:var(--shadow);position:sticky;top:78px;}
.sidebar button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:none;background:transparent;color:var(--text-dim);font-weight:700;font-size:13px;text-align:right;width:100%;transition:.15s;}
.sidebar button svg{flex-shrink:0;opacity:.75;}
.sidebar button.active{background:var(--ink);color:#fff;}
.sidebar button.active svg{opacity:1;}
.sidebar button:not(.active):hover{background:var(--sand);color:var(--ink);}
.content{flex:1;min-width:0;}
@media(max-width:820px){
  .shell{flex-direction:column;padding:12px;gap:12px;}
  .sidebar{width:100%;flex-direction:row;overflow-x:auto;position:static;-webkit-overflow-scrolling:touch;}
  .sidebar button{width:auto;white-space:nowrap;flex-shrink:0;}
}
.service-card{cursor:pointer;transition:.15s;}
.service-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(14,42,43,.12);}
.tabs button{border:1px solid var(--line);background:var(--paper);color:var(--text-dim);padding:9px 16px;border-radius:10px;font-weight:700;font-size:13.5px;transition:.15s;}
.tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.tabs button:not(.active):hover{border-color:var(--mint);color:var(--ink);}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px;flex-wrap:wrap;gap:8px;}
.section-title h2{font-size:17px;margin:0;}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
.stat .num{font-family:'Cairo';font-weight:900;font-size:24px;line-height:1;}
.stat .lbl{font-size:11.5px;color:var(--text-dim);margin-top:6px;font-weight:700;}
.stat.mint .num{color:var(--mint);} .stat.amber .num{color:var(--amber);} .stat.coral .num{color:var(--coral);} .stat.ink .num{color:var(--ink);} .stat.blue .num{color:var(--blue);}
.tbl-wrap{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto;box-shadow:var(--shadow);margin-bottom:18px;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px;}
th{background:var(--ink);color:#fff;text-align:right;padding:10px 12px;font-weight:700;font-size:11.5px;white-space:nowrap;}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;}
tr:last-child td{border-bottom:none;}
.badge{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;}
.badge.done{background:var(--mint-light);color:var(--mint);} .badge.pending{background:var(--amber-light);color:var(--amber);}
.badge.progress{background:var(--blue-light);color:var(--blue);} .badge.postponed{background:var(--coral-light);color:var(--coral);}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:14px;background:var(--paper);border:1px solid var(--line);padding:12px;border-radius:12px;}
.fgroup{display:flex;flex-direction:column;gap:3px;}
.fgroup label{font-size:11px;color:var(--text-dim);font-weight:700;}
.fgroup input,.fgroup select{border:1px solid var(--line);background:var(--sand);border-radius:8px;padding:8px 10px;font-size:13px;}
.primary-btn{border:none;background:var(--mint);color:#fff;border-radius:10px;padding:10px 16px;font-weight:800;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;transition:.15s;}
.primary-btn:hover{background:#157058;} .primary-btn:disabled{background:#ccc;}
.ghost-btn{border:1px solid var(--line);background:var(--paper);color:var(--text);border-radius:9px;padding:8px 13px;font-weight:700;font-size:12.5px;}
.ghost-btn:hover{border-color:var(--mint);color:var(--mint);}
.ghost-btn.danger:hover{border-color:var(--coral);color:var(--coral);}
.form-row{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
.form-row label{font-size:12px;font-weight:700;color:var(--text-dim);}
.form-row input,.form-row select,.form-row textarea{border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;background:var(--sand);}
.form-row textarea{resize:vertical;min-height:55px;}
.modal-bg{position:fixed;inset:0;background:rgba(14,42,43,.55);backdrop-filter:blur(2px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:var(--paper);border-radius:18px;max-width:460px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal.wide{max-width:640px;}
.modal-head{padding:18px 20px 8px;display:flex;justify-content:space-between;align-items:flex-start;}
.modal-head h3{margin:0;font-size:16px;}
.modal-head .close{border:none;background:var(--sand);width:30px;height:30px;border-radius:50%;color:var(--text-dim);flex-shrink:0;font-size:14px;}
.modal-body{padding:6px 20px 20px;}
.tag-shift{font-size:10.5px;padding:2px 8px;border-radius:6px;font-weight:800;}
.tag-shift.morning{background:var(--amber-light);color:var(--amber);}
.tag-shift.evening{background:#EDE6FA;color:#6B3FBF;}
.tag-shift.both{background:var(--mint-light);color:var(--mint);}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-dim);}
.empty-state .em{font-size:34px;display:block;margin-bottom:8px;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:12px;font-weight:700;font-size:13.5px;box-shadow:var(--shadow);z-index:400;}
.toast.ok{background:var(--mint);}
.scan-stage{background:var(--ink);border-radius:14px;overflow:hidden;position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;}
.scan-stage video{width:100%;height:100%;object-fit:cover;}
.scan-frame{position:absolute;inset:16%;border-radius:16px;color:#fff;}
.scan-msg{color:#fff;text-align:center;padding:20px;font-size:13px;line-height:1.7;}
.scan-msg .em{font-size:32px;display:block;margin-bottom:8px;}
.file-btn{position:relative;overflow:hidden;text-align:center;}
.file-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
.photo-preview{width:100%;max-height:150px;object-fit:cover;border-radius:10px;margin-top:8px;border:1px solid var(--line);}
#qr-render-target{display:flex;justify-content:center;margin:10px 0;}
#qr-render-target img,#qr-render-target canvas{border-radius:10px;border:8px solid #fff;box-shadow:var(--shadow);}
.print-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:20px;}
.print-tile{border:2px dashed #999;border-radius:10px;text-align:center;padding:12px;}
.print-tile .pn{font-family:'Cairo';font-weight:800;font-size:12px;margin-top:6px;}
@media print{ body *{visibility:hidden;} .print-sheet,.print-sheet *{visibility:visible;} .print-sheet{display:block;position:absolute;top:0;right:0;left:0;} }
.home-blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:18px;}
.pill-group{display:flex;gap:6px;flex-wrap:wrap;}
.pill{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;background:var(--paper);cursor:pointer;}
.pill.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.multi-sel{min-width:150px;min-height:70px;}
@media(max-width:640px){ .wrap{padding:12px;} table{min-width:480px;} }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================= SUPABASE CONFIG ============================= */
const SUPABASE_URL = 'https://msszjzechwurofsrjydt.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_xtYKER8VsZPhQSBVmclExg_aQv_-xZZ';
const sb = (SUPABASE_URL.startsWith('http')) ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
function configMissing(){ return !sb; }

/* ============================= STATE ============================= */
let S = {
  session:null, profile:null, authMode:'login', authError:'', authBusy:false,
  tab:null, today: todayStr(),
  locations:[], users:[],
  deliveries:[], deliveryDate: todayStr(),
  orders:[], ordersDate:'',
  installs:[], installsDate: todayStr(),
  checklistDefs:[], checklistInstances:[],
  attendance:[], attendanceDate: todayStr(),
  availability:[],
  pest:[], facade:[], facadeDate: todayStr(), waste:[], unitNotes:[],
  reportFrom: (()=>{ const d=new Date(); d.setDate(d.getDate()-29); return d.toISOString().slice(0,10); })(),
  reportTo: todayStr(), reportType:'all',
  notifications:[], bellOpen:false,
  modal:null,
  scanCtx:null, confirmCtx:null, stream:null, stopLoop:null, qrTarget:null,
};
const ROLE_LABEL = { admin:'الإدارة', opm:'مسئول OPM', fm_dispatcher:'FM Dispatcher', supervisor:'مشرف', contractor_manager:'مدير موقع المقاول', contractor_admin:'المسئول الإداري للمقاول' };
const SUP_TYPE_LABEL = { housekeeping:'HK SV — تسليمات وخدمة مدفوعة', pest_control:'Pest Control SV — مكافحة حشرات', facade:'Facade Operations SV — نظافة واجهات', waste:'Waste MGT SV — رفع مخلفات' };
const SHIFT_LABEL = { morning:'صباحي', evening:'مسائي', both:'الاثنين' };
const STATUS_LABEL = { scheduled:'مجدولة', in_progress:'جاري العمل', completed:'تم الانتهاء', postponed:'تم التأجيل', incomplete:'لم يُنفذ' };

function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(s){ const d=new Date(s+'T00:00:00'); return d.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'}); }
function fmtTime(iso){ if(!iso) return '-'; return new Date(iso).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}); }
function nowTimeStr(){ const d=new Date(); return d.toTimeString().slice(0,5); }
function uid(p){ return p+'_'+Math.random().toString(36).slice(2,9); }
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================= DB HELPERS ============================= */
async function dbSelect(table, filters){
  let q = sb.from(table).select('*');
  if(filters) Object.keys(filters).forEach(k=>{ q = q.eq(k, filters[k]); });
  const {data,error} = await q;
  if(error){ console.error(table, error); return []; }
  return data||[];
}
async function dbInsert(table, rows){ const {error}=await sb.from(table).insert(rows); if(error){ console.error(table,error); toast('حصل خطأ: '+error.message,false); } return !error; }
async function dbUpdate(table, id, patch){ const {error}=await sb.from(table).update(patch).eq('id',id); if(error){ console.error(table,error); toast('حصل خطأ: '+error.message,false); } return !error; }
async function dbDelete(table, id){ const {error}=await sb.from(table).delete().eq('id',id); if(error){ console.error(table,error); toast('حصل خطأ: '+error.message,false); } return !error; }

/* ============================= AUTH ============================= */
async function fetchProfile(userId){
  const {data,error} = await sb.from('profiles').select('*').eq('id',userId).maybeSingle();
  if(error){ console.error(error); return null; }
  return data;
}
async function refreshSession(){
  const {data} = await sb.auth.getSession();
  S.session = data.session || null;
  S.profile = S.session ? await fetchProfile(S.session.user.id) : null;
}
function translateAuthError(msg){
  if(/already registered/i.test(msg)) return 'الإيميل ده مسجل بالفعل، جرب تسجيل الدخول';
  if(/invalid login credentials/i.test(msg)) return 'الإيميل أو الباسورد غلط';
  if(/password/i.test(msg)) return 'الباسورد لازم يكون 6 حروف على الأقل';
  return 'حصل خطأ: '+msg;
}
async function doSignUp(){
  const email=document.getElementById('auth-email').value.trim();
  const password=document.getElementById('auth-password').value;
  const full_name=document.getElementById('auth-fullname').value.trim();
  if(!email||!password||!full_name){ S.authError='من فضلك استكمل كل الحقول'; render(); return; }
  S.authBusy=true; S.authError=''; render();
  const {error} = await sb.auth.signUp({ email, password, options:{ data:{ full_name } } });
  S.authBusy=false;
  if(error){ S.authError=translateAuthError(error.message); render(); return; }
  await refreshSession(); await bootApp();
}
async function doSignIn(){
  const email=document.getElementById('auth-email').value.trim();
  const password=document.getElementById('auth-password').value;
  if(!email||!password){ S.authError='اكتب الإيميل والباسورد'; render(); return; }
  S.authBusy=true; S.authError=''; render();
  const {error} = await sb.auth.signInWithPassword({ email, password });
  S.authBusy=false;
  if(error){ S.authError=translateAuthError(error.message); render(); return; }
  await refreshSession(); await bootApp();
}
async function doSignOut(){ await sb.auth.signOut(); S.session=null; S.profile=null; S.tab=null; render(); }

/* ============================= TOAST / ICONS ============================= */
function toast(msg, ok){
  const el=document.createElement('div'); el.className='toast'+(ok?' ok':'');
  el.textContent=msg; document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}
const ICON = {
  qr:(s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><line x1="14" y1="14" x2="14" y2="14.01"/><line x1="17.5" y1="14" x2="17.5" y2="17.5"/><line x1="21" y1="14" x2="21" y2="14.01"/><line x1="14" y1="17.5" x2="17.5" y2="17.5"/><line x1="14" y1="21" x2="17.5" y2="21"/><line x1="21" y1="17.5" x2="21" y2="21"/></svg>`,
  check:(s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
  clock:(s=14)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,

  upload:(s=14)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>`,
  camera:(s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>`,
  printer:(s=14)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>`,
  trash:(s=13)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`,
  bracket:()=>`<span class="bk bk-tl"></span><span class="bk bk-tr"></span><span class="bk bk-bl"></span><span class="bk bk-br"></span>`,
  home:(s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
  truck:(s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>`,

/* ============================= ROLE → TABS ============================= */
function tabsForRole(role){
  if(role==='admin') return [['home','الرئيسية'],['deliveries','وحدات التسليمات'],['orders','الخدمة المدفوعة'],['pest','مكافحة الحشرات'],['facade','نظافة الواجهات'],['waste','رفع المخلفات'],['installs','أعمال التأسيسات'],['checklist','قوائم التحقق اليومية'],['qrsheet','طباعة QR'],['attendance','الحضور'],['locations','المواقع'],['users','المستخدمون'],['reports','التقارير']];
  if(role==='opm') return [['home','الرئيسية'],['deliveries','وحدات التسليمات'],['orders','الخدمة المدفوعة'],['pest','مكافحة الحشرات'],['facade','نظافة الواجهات'],['waste','رفع المخلفات'],['installs','أعمال التأسيسات'],['attendance','الحضور']];
  if(role==='fm_dispatcher') return [['orders','أوردرات الخدمة المدفوعة'],['pest','مكافحة الحشرات']];
  if(role==='supervisor') return [['today','قائمة اليوم'],['myname','بياناتي']];
  if(role==='contractor_manager') return [['home','الرئيسية'],['installs','أعمال التأسيسات'],['attendance','الحضور']];
  if(role==='contractor_admin') return [['attendance','الحضور']];
  return [];
}

/* ============================= RENDER ROOT ============================= */
function render(){
  const app=document.getElementById('app');
  if(configMissing()){
    app.innerHTML = `<div class="card" style="max-width:480px;margin:60px auto;text-align:center;">
      <h2>التطبيق يحتاج إعداد</h2><p>ضع مفاتيح Supabase في أعلى الكود.</p></div>`;
    return;
  }
  if(!S.session){ app.innerHTML = renderAuthScreen(); bindAuthEvents(); return; }
  if(!S.profile){ app.innerHTML = `<div style="padding:60px;text-align:center;">جارِ التحميل...</div>`; return; }
  const tabs = tabsForRole(S.profile.role);
  if(!S.tab || !tabs.find(t=>t[0]===S.tab)) S.tab = tabs.length?tabs[0][0]:null;
  app.innerHTML = `
    ${renderTopbar()}
    <div class="shell">
      <div class="sidebar">${tabs.map(([id,label])=>`<button data-tab="${id}" class="${S.tab===id?'active':''}">${ICON[TAB_ICON[id]]?ICON[TAB_ICON[id]](16):''}<span>${esc(label)}</span></button>`).join('')}</div>
      <div class="content" id="tab-body">${renderTabBody()}</div>
    </div>
    ${renderModal()}
  `;
  bindGlobalEvents();
  bindTabEvents();
  if(S.tab==='home') drawHomeCharts();
}

function bindGlobalEvents(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; render(); });
  const lb=document.getElementById('logout-btn'); if(lb) lb.onclick=doSignOut;
  const rb=document.getElementById('refresh-btn'); if(rb) rb.onclick=manualRefresh;
  const bb=document.getElementById('bell-btn'); if(bb) bb.onclick=(e)=>{
    e.stopPropagation();
    S.bellOpen = !S.bellOpen;
    if(S.bellOpen) S.notifications.forEach(n=>n.read=true);
    render();
  };
  document.querySelectorAll('[data-ntf-goto]').forEach(el=>el.onclick=()=>{
    S.tab = el.dataset.ntfGoto; S.bellOpen=false; render();
  });
  if(S.bellOpen){
    document.addEventListener('click', function closeBell(e){
      if(!e.target.closest('#bell-dropdown') && !e.target.closest('#bell-btn')){
        S.bellOpen=false; render(); document.removeEventListener('click', closeBell);
      }
    });
  }
}

/* ============================= TAB DISPATCH ============================= */
function renderTabBody(){
  switch(S.tab){
    case 'home': return renderHome();
    case 'deliveries': return renderDeliveries();
    case 'orders': return renderOrders();
    case 'pest': return renderPest();
    case 'facade': return renderFacade();
    case 'waste': return renderWaste();
    case 'installs': return renderInstalls();
    case 'checklist': return renderChecklistAdmin();
    case 'qrsheet': return renderQrSheet();
    case 'attendance': return renderAttendance();
    case 'locations': return renderLocations();
    case 'users': return renderUsers();
    case 'reports': return renderReports();
    case 'today': return renderSupervisorToday();
    case 'myname': return renderMyName();
    default: return '';
  }
}
function bindTabEvents(){
  switch(S.tab){
    case 'home': bindHome(); break;
    case 'deliveries': bindDeliveries(); break;
    case 'orders': bindOrders(); break;
    case 'pest': bindPest(); break;
    case 'facade': bindFacade(); break;

    case 'installs': bindInstalls(); break;

    case 'attendance': bindAttendance(); break;
    case 'locations': bindLocations(); break;
    case 'users': bindUsers(); break;
    case 'reports': bindReports(); break;
    case 'today': bindSupervisorToday(); break;
    case 'myname': bindMyName(); break;

  bindModalEvents();
}

/* ============================= HOME (admin/opm/contractor_manager) ============================= */
function serviceCard(color, icon, label, valueHtml, tabId){
  return `<div class="stat ${color} service-card" data-goto="${tabId}">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div class="num">${valueHtml}</div>
      <div style="color:var(--text-dim);opacity:.6;">${ICON[icon]?ICON[icon](20):''}</div>
    </div>
    <div class="lbl">${esc(label)}</div>
  </div>`;
}
function renderHome(){
  const role = S.profile.role;
  const roleTabs = tabsForRole(role).map(t=>t[0]);
  const todayInstalls = S.installs.filter(i=>i.date===S.today);

  const cardDefs = [
    { id:'deliveries', color:'mint', icon:'truck', label:'وحدات التسليم اليوم', data:S.deliveries, field:'date' },
    { id:'orders', color:'blue', icon:'droplet', label:'الخدمة المدفوعة اليوم', data:S.orders, field:'scheduled_date' },
    { id:'pest', color:'coral', icon:'bug', label:'مكافحة الحشرات اليوم', data:S.pest||[], field:'scheduled_date' },
    { id:'facade', color:'amber', icon:'building', label:'نظافة الواجهات اليوم', data:S.facade||[], field:'date' },
    { id:'waste', color:'ink', icon:'trash2', label:'رفع المخلفات اليوم', data:S.waste||[], field:'date' },
    { id:'installs', color:'amber', icon:'brick', label:'أعمال التأسيسات اليوم', data:S.installs, field:'date' },
    { id:'checklist', color:'mint', icon:'qr', label:'قوائم التحقق اليومية اليوم', data:S.checklistInstances||[], field:'date' },
  ];
  const cardsHtml = cardDefs.filter(c=>roleTabs.includes(c.id)).map(c=>{
    const items = c.data.filter(x=>x[c.field]===S.today);
    const done = items.filter(x=> x.status==='completed').length;
    return serviceCard(c.color, c.icon, c.label, `${done}/${items.length}`, c.id);
  }).join('');
  const attendanceCard = roleTabs.includes('attendance') ? (()=>{
    const att=(S.attendance||[]).filter(a=>a.date===S.today);
    return serviceCard('blue','idcard','سجلات حضور اليوم', `${att.length}`, 'attendance');
  })() : '';

  return `
  <div class="card" style="margin-bottom:16px;background:linear-gradient(135deg,var(--ink),var(--ink-2));color:#fff;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:800;font-size:14px;">✨ اسأل النظام</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <input id="ai-question" placeholder="مثال: كام وحدة تسليم لسه متنفذتش النهاردة؟" style="flex:1;min-width:220px;border:none;border-radius:9px;padding:11px 14px;font-size:13.5px;">
      <button class="primary-btn" id="ai-ask" style="background:var(--mint);">اسأل</button>
    </div>
    <div id="ai-answer" style="margin-top:12px;font-size:13.5px;line-height:1.8;"></div>
  </div>
  <div class="stat-row">${cardsHtml}${attendanceCard}</div>
  <div class="home-blocks">
    <div class="card"><h3 style="margin-top:0;font-size:14px;">نشاط آخر 7 أيام (قوائم التحقق اليومية)</h3><canvas id="chartHome" height="180"></canvas></div>
    <div class="card">
      <h3 style="margin-top:0;font-size:14px;">أعمال التأسيسات اليوم</h3>
      ${todayInstalls.length? `<div class="tbl-wrap" style="box-shadow:none;margin-bottom:0;"><table><thead><tr><th>الوصف</th><th>الوردية</th><th>الحالة</th></tr></thead><tbody>
        ${todayInstalls.map(i=>`<tr><td>${esc(i.description)}</td><td>${SHIFT_LABEL[i.shift]}</td><td>${statusBadge(i.status)}</td></tr>`).join('')}
      </tbody></table></div>` : `<div class="empty-state" style="padding:20px;"><span class="em">🧱</span>مفيش أعمال تأسيسات مجدولة النهاردة</div>`}
    </div>
  </div>
  <p style="text-align:center;font-size:12px;color:var(--text-dim);">👆 دوس على أي كارت فوق عشان تروح مباشرة لشاشته</p>`;
}
function buildAIContext(){
  const today=S.today;
  const summarize=(arr,field)=>{
    const t=(arr||[]).filter(x=>x[field]===today);
    return { total:t.length, completed:t.filter(x=>x.status==='completed').length, pending:t.filter(x=>x.status!=='completed') };
  };
  return JSON.stringify({
    date:today,
    deliveries: summarize(S.deliveries,'date'),
    orders: summarize(S.orders,'scheduled_date'),
    pest: summarize(S.pest,'scheduled_date'),
    facade: summarize(S.facade,'date'),
    waste: summarize(S.waste,'date'),
    installs: summarize(S.installs,'date'),
    checklist: summarize(S.checklistInstances,'date'),
    attendanceToday: (S.attendance||[]).filter(a=>a.date===today),
    locations: S.locations.map(l=>l.name),
    supervisors: (S.users||[]).filter(u=>u.role==='supervisor').map(u=>({name:u.full_name, type:u.supervisor_type})),
  }).slice(0, 12000);
}
async function askAI(){
  const q = document.getElementById('ai-question').value.trim();
  const answerBox = document.getElementById('ai-answer');
  if(!q) return;
  answerBox.innerHTML = 'جارِ التفكير...';
  try{
    const res = await fetch(SUPABASE_URL + '/functions/v1/ai-assistant', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+S.session.access_token },
      body: JSON.stringify({ question:q, context: buildAIContext() })
    });
    const data = await res.json();
    if(data.answer) answerBox.innerHTML = esc(data.answer).replace(/\n/g,'<br>');
    else answerBox.innerHTML = 'حصل خطأ: تأكد إن الـ Edge Function متظبطة (راجع التعليمات).';
  }catch(e){
    answerBox.innerHTML = 'تعذر الوصول للمساعد الذكي. تأكد إن الـ Edge Function اتعملت في Supabase.';
  }
}
function bindHome(){
  document.querySelectorAll('[data-goto]').forEach(el=>el.onclick=()=>{ S.tab=el.dataset.goto; render(); });
  const askBtn=document.getElementById('ai-ask'); if(askBtn) askBtn.onclick=askAI;
  const qInput=document.getElementById('ai-question'); if(qInput) qInput.onkeydown=(e)=>{ if(e.key==='Enter') askAI(); };
}
function drawHomeCharts(){
  const el=document.getElementById('chartHome'); if(!el || typeof Chart==='undefined') return;
  const days=[]; const vals=[];
  for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const ds=d.toISOString().slice(0,10);
    days.push(d.toLocaleDateString('ar-EG',{weekday:'short'}));
    vals.push(S.checklistInstances.filter(x=>x.date===ds && x.status==='completed').length);
  }
  new Chart(el, { type:'line', data:{ labels:days, datasets:[{label:'قوائم تحقق منجزة', data:vals, borderColor:'#0E2A2B', backgroundColor:'rgba(27,138,107,.15)', fill:true, tension:.35 }] }, options:{ plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true,ticks:{stepSize:1}}} } });
}
function statusBadge(s){
  const map={ scheduled:'pending', in_progress:'progress', completed:'done', postponed:'postponed', incomplete:'pending' };
  return `<span class="badge ${map[s]||'pending'}"><span class="dot"></span>${STATUS_LABEL[s]||s}</span>`;
}

/* ============================= DELIVERIES ============================= */
function renderDeliveries(){
  const list = S.deliveries.filter(d=>d.date===S.deliveryDate);
  return `
  <div class="toolbar">
    <div class="fgroup"><label>التاريخ</label><input type="date" id="dv-date" value="${S.deliveryDate}"></div>
    <button class="primary-btn" id="dv-add">${ICON.plus()} إضافة وحدة</button>
  </div>
  <div class="tbl-wrap"><table><thead><tr><th>كود الوحدة</th><th>المشرف المسؤول</th><th>الحالة</th><th>ملاحظات</th><th>بلاغات المشرف</th><th></th></tr></thead><tbody>
  ${list.length? list.map(d=>{
    const sup = S.users.find(u=>u.id===d.assigned_supervisor_id);
    const canChangeStatus = S.profile.role==='admin'||S.profile.role==='opm'||d.assigned_supervisor_id===S.session.user.id;
    const noteCount = (S.unitNotes||[]).filter(n=>n.delivery_unit_id===d.id).length;
    return `<tr>
      <td>${esc(d.unit_code)}</td>
      <td>${sup?esc(sup.full_name):'<span style="color:var(--text-dim);">لم يُحدد</span>'}</td>
      <td>${canChangeStatus? `<select data-dv-status="${d.id}">
        <option value="scheduled" ${d.status==='scheduled'?'selected':''}>مجدولة</option>
        <option value="in_progress" ${d.status==='in_progress'?'selected':''}>جاري العمل</option>
        <option value="completed" ${d.status==='completed'?'selected':''}>تم الانتهاء</option>
      </select>` : statusBadge(d.status)}</td>
      <td>${esc(d.notes||'-')}</td>
      <td>${noteCount?`<button class="ghost-btn" data-view-notes="${d.id}">${noteCount} بلاغ ${ICON.camera(12)}</button>`:'<span style="color:var(--text-dim);">-</span>'}</td>
      <td>${(S.profile.role==='admin'||S.profile.role==='opm')?`<button class="ghost-btn" data-dv-assign="${d.id}">تعيين</button> <button class="ghost-btn danger" data-dv-del="${d.id}">${ICON.trash()}</button>`:''}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--text-dim);">لا توجد وحدات في هذا اليوم</td></tr>`}
  </tbody></table></div>`;
}
function bindDeliveries(){
  document.getElementById('dv-date').onchange=e=>{ S.deliveryDate=e.target.value; loadDeliveries().then(render); };
  document.getElementById('dv-add').onclick=()=>{ S.modal={type:'addDelivery'}; render(); };
  document.querySelectorAll('[data-dv-status]').forEach(sel=>sel.onchange=async ()=>{ await dbUpdate('delivery_units', sel.dataset.dvStatus, {status:sel.value, updated_at:new Date().toISOString()}); await loadDeliveries(); render(); toast('تم تحديث الحالة',true); });
  document.querySelectorAll('[data-dv-assign]').forEach(b=>b.onclick=()=>{ S.modal={type:'assignDelivery', id:b.dataset.dvAssign}; render(); });
  document.querySelectorAll('[data-dv-del]').forEach(b=>b.onclick=async ()=>{ await dbDelete('delivery_units', b.dataset.dvDel); await loadDeliveries(); render(); });
  document.querySelectorAll('[data-view-notes]').forEach(b=>b.onclick=()=>{ S.modal={type:'viewUnitNotes', id:b.dataset.viewNotes}; render(); });
}
async function loadDeliveries(){ S.deliveries = await dbSelect('delivery_units'); }
async function loadUnitNotes(){ S.unitNotes = await dbSelect('unit_notes'); }

function renderQrSheet(){
  return `<div class="card"><p style="font-size:13px;color:var(--text-dim);margin-top:0;">اطبع الصفحة واعلّق كل رمز في مكانه.</p>
  <button class="primary-btn" id="do-print">${ICON.printer(13)} طباعة كل الرموز</button></div>
  <div class="print-grid" id="print-preview" style="margin-top:16px;"></div>`;
}
function bindQrSheet(){
  document.getElementById('do-print').onclick=()=>window.print();
  buildPrintPreview();
}
function buildPrintPreview(){
  const holder=document.getElementById('print-preview'); if(!holder) return;
  holder.innerHTML='';
  S.checklistDefs.filter(c=>c.active).forEach(c=>{
    const loc=S.locations.find(l=>l.id===c.location_id);
    const tile=document.createElement('div'); tile.className='print-tile';
    const qrDiv=document.createElement('div'); tile.appendChild(qrDiv);
    const pn=document.createElement('div'); pn.className='pn'; pn.textContent=c.name; tile.appendChild(pn);
    const pl=document.createElement('div'); pl.style.fontSize='10px'; pl.style.color='#666'; pl.textContent=(loc?loc.name:'')+' · '+SHIFT_LABEL[c.shift]; tile.appendChild(pl);
    holder.appendChild(tile);
    new QRCode(qrDiv, { text:'ZEDWEST|CL|'+c.id, width:110, height:110, colorDark:'#0E2A2B', colorLight:'#fff' });
  });
}

/* ============================= REPORTS (admin) ============================= */
function getReportData(){
  const from=S.reportFrom, to=S.reportTo;
  const inRange = ds => ds && ds>=from && ds<=to;
  return {
    deliv: S.deliveries.filter(d=>inRange(d.date)),
    orders: S.orders.filter(o=>inRange(o.scheduled_date)),
    pest: (S.pest||[]).filter(p=>inRange(p.scheduled_date)),
    facade: (S.facade||[]).filter(f=>inRange(f.date)),
    waste: (S.waste||[]).filter(w=>inRange(w.date)),
    installs: S.installs.filter(i=>inRange(i.date)),
    checklist: S.checklistInstances.filter(c=>inRange(c.date)),
    attendance: S.attendance.filter(a=>inRange(a.date)),
  };
}

      <div class="stat ink"><div class="num">${waste.filter(w=>w.status==='completed').length}/${waste.length}</div><div class="lbl">رفع مخلفات منجزة</div></div>
      <div class="stat amber"><div class="num">${installs.filter(i=>i.status==='completed').length}/${installs.length}</div><div class="lbl">أعمال تأسيسات منجزة</div></div>

    return `<td>${esc(v!=null?String(v):'-')}</td>`;
  }).join('')}</tr>`).join('') : `<tr><td colspan="${t.cols.length}" style="text-align:center;padding:20px;color:var(--text-dim);">لا توجد سجلات في هذه الفترة</td></tr>`}

function bindReports(){
  document.getElementById('rp-go').onclick=()=>{
    S.reportFrom=document.getElementById('rp-from').value;
    S.reportTo=document.getElementById('rp-to').value;

function exportReportExcel(){
  if(typeof XLSX==='undefined'){ toast('مكتبة Excel لم تُحمّل', false); return; }
  const data = getReportData();
  const wb = XLSX.utils.book_new();
  const addSheet=(rows, name, colMap)=>{
    if(!rows.length) return;
    const mapped = rows.map(r=>{
      const o={};
      colMap.forEach(([key,label,fmt])=>{ o[label] = fmt? fmt(r[key]) : (r[key]!=null? r[key] : ''); });
      return o;
    });
    const ws = XLSX.utils.json_to_sheet(mapped);
    XLSX.utils.book_append_sheet(wb, ws, name);
  };
  const statusFmt = v => STATUS_LABEL[v]||v;
  const shiftFmt = v => SHIFT_LABEL[v]||v;
  addSheet(data.deliv, 'وحدات التسليم', [['unit_code','كود الوحدة'],['date','التاريخ'],['status','الحالة',statusFmt],['notes','ملاحظات']]);
  addSheet(data.orders, 'الخدمة المدفوعة', [['order_type','النوع'],['scheduled_date','التاريخ'],['scheduled_time','الميعاد'],['status','الحالة',statusFmt]]);
  addSheet(data.pest, 'مكافحة الحشرات', [['unit_code','كود الوحدة'],['service_type','النوع',v=>PEST_TYPE_LABEL[v]||v],['scheduled_date','التاريخ'],['status','الحالة',statusFmt]]);
  addSheet(data.facade, 'نظافة الواجهات', [['description','الوصف'],['date','التاريخ'],['status','الحالة',statusFmt]]);
  addSheet(data.waste, 'رفع المخلفات', [['description','الوصف'],['date','التاريخ'],['status','الحالة',statusFmt],['reason','السبب']]);
  addSheet(data.installs, 'أعمال التأسيسات', [['description','الوصف'],['date','التاريخ'],['shift','الوردية',shiftFmt],['status','الحالة',statusFmt],['postpone_reason','سبب التأجيل']]);
  addSheet(data.checklist, 'قوائم التحقق اليومية', [['date','التاريخ'],['shift','الوردية',shiftFmt],['status','الحالة',statusFmt]]);
  addSheet(data.attendance, 'الحضور', [['date','التاريخ'],['shift','الوردية',shiftFmt],['site_manager_count','مدير موقع'],['site_admin_count','إداري موقع'],['senior_supervisor_count','مشرف أول'],['supervisor_count','مشرف'],['worker_count','عامل'],['status','الحالة',statusFmt]]);
  if(!wb.SheetNames.length){ toast('لا توجد بيانات في هذه الفترة',false); return; }
  XLSX.writeFile(wb, `تقرير_${S.reportFrom}_${S.reportTo}.xlsx`);
  toast('تم تصدير الملف',true);
}

    <div class="section-title"><h2>أوردرات الخدمة المدفوعة</h2></div>

      </select>
    </div>`).join('') : `<p style="color:var(--text-dim);font-size:13px;">لا توجد أوردرات لك اليوم</p>`}

    <div class="section-title"><h2>قوائم التحقق اليومية</h2></div>
    ${myChecklist.length? `<div class="grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;">
      ${myChecklist.map(ci=>{
        const def=S.checklistDefs.find(c=>c.id===ci.checklist_definition_id);

    </div>` : `<p style="color:var(--text-dim);font-size:13px;">لا توجد عناصر قوائم تحقق لك اليوم</p>`}`;
  }

  return html;
}

async function handleModalSave(){
  const m=S.modal;
  if(m.type==='addDelivery'){
    const unit_code=document.getElementById('m-unit-code').value.trim();
    if(!unit_code){ toast('اكتب كود الوحدة',false); return; }
    const row={ id:uid('dv'), unit_code, date:document.getElementById('m-unit-date').value, assigned_supervisor_id: document.getElementById('m-unit-sup').value||null, notes: document.getElementById('m-unit-notes').value.trim(), status:'scheduled', created_by:S.session.user.id };
    if(await dbInsert('delivery_units',[row])){ await loadDeliveries(); S.modal=null; render(); toast('تمت الإضافة',true); }
  }
  else if(m.type==='assignDelivery'){
    const sup=document.getElementById('m-assign-sup').value;
    if(await dbUpdate('delivery_units', m.id, {assigned_supervisor_id:sup})){ await loadDeliveries(); S.modal=null; render(); toast('تم التعيين',true); }
  }
  else if(m.type==='addOrder'){
    const row={ id:uid('ord'), order_type:document.getElementById('m-ord-type').value, scheduled_date:document.getElementById('m-ord-date').value, scheduled_time:document.getElementById('m-ord-time').value, client_info:document.getElementById('m-ord-client').value.trim(), status:'scheduled', created_by:S.session.user.id };
    if(await dbInsert('paid_service_orders',[row])){ await loadOrders(); S.modal=null; render(); toast('تم إنشاء الأوردر',true); }
  }
  else if(m.type==='assignOrder'){
    const sup=document.getElementById('m-assign-sup').value;
    const notes=document.getElementById('m-ord-notes').value.trim();
    if(await dbUpdate('paid_service_orders', m.id, {assigned_supervisor_id:sup, opm_notes:notes, assigned_by:S.session.user.id})){ await loadOrders(); S.modal=null; render(); toast('تم التعيين',true); }
  }
  else if(m.type==='addInstall'){
    const description=document.getElementById('m-in-desc').value.trim();
    if(!description){ toast('اكتب وصف العمل',false); return; }
    const row={ id:uid('in'), date:document.getElementById('m-in-date').value, shift:document.getElementById('m-in-shift').value, description, status:'scheduled', created_by:S.session.user.id };
    if(await dbInsert('installation_works',[row])){ await loadInstalls(); S.modal=null; render(); toast('تمت الجدولة',true); }
  }
  else if(m.type==='postponeInstall'){
    const reason=document.getElementById('m-postpone-reason').value.trim();
    if(!reason){ toast('لازم تكتب سبب التأجيل',false); return; }
    if(await dbUpdate('installation_works', m.id, {status:'postponed', postpone_reason:reason, updated_by:S.session.user.id, updated_at:new Date().toISOString()})){ await loadInstalls(); S.modal=null; render(); toast('تم تسجيل التأجيل',true); }
  }
  else if(m.type==='addChecklistDef'){
    const name=document.getElementById('m-cl-name').value.trim();
    if(!name){ toast('اكتب اسم العنصر',false); return; }
    const row={ id:uid('cldef'), name, location_id:document.getElementById('m-cl-loc').value, shift:document.getElementById('m-cl-shift').value, valid_from:document.getElementById('m-cl-from').value||null, valid_to:document.getElementById('m-cl-to').value||null, active:true };
    if(await dbInsert('checklist_definitions',[row])){ await loadChecklistDefs(); await ensureTodayChecklistInstances(); S.modal=null; render(); toast('تمت الإضافة',true); }
  }
  else if(m.type==='confirmChecklist'){
    await submitChecklistConfirm();
  }
  else if(m.type==='addPest'){
    const unit_code=document.getElementById('m-pest-unit').value.trim();
    if(!unit_code){ toast('اكتب كود الوحدة',false); return; }
    const row={ id:uid('pest'), unit_code, service_type:document.getElementById('m-pest-type').value, scheduled_date:document.getElementById('m-pest-date').value, scheduled_time:document.getElementById('m-pest-time').value, status:'scheduled', created_by:S.session.user.id };
    if(await dbInsert('pest_control_requests',[row])){ await loadPest(); S.modal=null; render(); toast('تم إنشاء الطلب',true); }
  }
  else if(m.type==='assignPest'){
    const sup=document.getElementById('m-assign-sup').value;
    if(await dbUpdate('pest_control_requests', m.id, {assigned_supervisor_id:sup})){ await loadPest(); S.modal=null; render(); toast('تم التعيين',true); }
  }
  else if(m.type==='addFacade'){
    const row={ id:uid('fc'), date:document.getElementById('m-fc-date').value, location_id:document.getElementById('m-fc-loc').value, description:document.getElementById('m-fc-desc').value.trim(), status:'scheduled', created_by:S.session.user.id };
    if(await dbInsert('facade_works',[row])){ await loadFacade(); S.modal=null; render(); toast('تمت الإضافة',true); }
  }
  else if(m.type==='completeFacade'){
    if(!pendingPhoto){ toast('لازم ترفع صورة عشان تقفل العمل',false); return; }
    const patch={ status:'completed', photo:pendingPhoto, completed_by:S.session.user.id, completed_at:new Date().toISOString() };
    if(await dbUpdate('facade_works', m.id, patch)){ await loadFacade(); pendingPhoto=null; S.modal=null; render(); toast('تم تسجيل الانتهاء',true); }
  }
  else if(m.type==='addWaste'){
    const description=document.getElementById('m-wr-desc').value.trim();
    if(!description){ toast('اكتب وصف العمل',false); return; }
    const row={ id:uid('wr'), description, date:document.getElementById('m-wr-date').value, assigned_supervisor_id:document.getElementById('m-wr-sup').value, status:'scheduled', created_by:S.session.user.id };
    if(await dbInsert('waste_removal_jobs',[row])){ await loadWaste(); S.modal=null; render(); toast('تمت الإضافة',true); }
  }
  else if(m.type==='markWaste'){
    const reason=document.getElementById('m-wr-reason').value.trim();
    if(!reason){ toast('لازم تكتب السبب',false); return; }
    if(await dbUpdate('waste_removal_jobs', m.id, {status:'not_done', reason, updated_at:new Date().toISOString()})){ await loadWaste(); S.modal=null; render(); toast('تم التسجيل',true); }
  }
  else if(m.type==='addUnitNote'){
    const note=document.getElementById('m-note-text').value.trim();
    if(!note){ toast('اكتب وصف الملاحظة',false); return; }
    const row={ id:uid('un'), delivery_unit_id:m.id, note, photo:pendingPhoto, created_by:S.session.user.id };
    if(await dbInsert('unit_notes',[row])){ await loadUnitNotes(); pendingPhoto=null; S.modal=null; render(); toast('تم حفظ الملاحظة',true); }
  }
}

/* ============================= QR SCAN (checklist) ============================= */
function renderQrCanvas(){
  const el=document.getElementById('qr-render-target'); if(!el||typeof QRCode==='undefined') return;
  el.innerHTML=''; new QRCode(el,{text:S.qrTarget.code,width:190,height:190,colorDark:'#0E2A2B',colorLight:'#ffffff'});
}
async function startScanner(){
  const stage=document.getElementById('scan-stage'); const msgBox=document.getElementById('scan-msg'); if(!stage) return;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    S.stream=stream;
    stage.innerHTML=`<video id="scan-video" autoplay playsinline muted></video><div class="scan-frame">${ICON.bracket()}</div>`;
    const video=document.getElementById('scan-video'); video.srcObject=stream; await video.play();
    const canvas=document.createElement('canvas'); const ctx=canvas.getContext('2d'); let stopped=false;
    S.stopLoop=()=>{stopped=true;};
    function tick(){
      if(stopped||!S.scanCtx) return;
      if(video.readyState===video.HAVE_ENOUGH_DATA){
        canvas.width=video.videoWidth; canvas.height=video.videoHeight; ctx.drawImage(video,0,0,canvas.width,canvas.height);
        const img=ctx.getImageData(0,0,canvas.width,canvas.height); const code=jsQR(img.data,img.width,img.height);
        if(code&&code.data){ stopped=true; handleScannedCode(code.data); return; }
      }
      requestAnimationFrame(tick);
    }
    tick();
  }catch(e){
    if(msgBox) msgBox.innerHTML=`<span class="em">🚫</span>تعذّر الوصول للكاميرا. استخدم رفع صورة بدلاً من ذلك.`;
  }
}
function stopScanner(){ if(S.stopLoop) S.stopLoop(); if(S.stream){ S.stream.getTracks().forEach(t=>t.stop()); S.stream=null; } }
function decodeFromFile(file){
  if(!file) return;
  const reader=new FileReader();
  reader.onload=(e)=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas'); canvas.width=img.width; canvas.height=img.height;
      const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0);
      const data=ctx.getImageData(0,0,canvas.width,canvas.height); const code=jsQR(data.data,data.width,data.height);
      if(code&&code.data) handleScannedCode(code.data); else toast('لم يتم التعرف على الرمز',false);
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function handleScannedCode(code){
  const clean=(code||'').trim();
  const defId = clean.startsWith('ZEDWEST|CL|') ? clean.split('|')[2] : clean;
  const inst = S.checklistInstances.find(ci=>ci.id===S.scanCtx.instanceId);
  if(!inst){ toast('تعذر إيجاد المهمة',false); return; }
  if(inst.checklist_definition_id !== defId){ toast('هذا الرمز يخص مهمة مختلفة',false); return; }
  const def=S.checklistDefs.find(c=>c.id===defId);
  if(def && def.valid_from && def.valid_to){
    const now=nowTimeStr();
    if(now < def.valid_from || now > def.valid_to){ toast('خارج وقت السماح بتنفيذ هذه المهمة ('+def.valid_from+' - '+def.valid_to+')', false); stopScanner(); S.modal=null; S.scanCtx=null; render(); return; }
  }
  stopScanner();
  S.modal={type:'confirmChecklist'};
  render();
}
let pendingPhoto=null;
function handlePhotoSelect(file){
  if(!file) return;
  const reader=new FileReader();
  reader.onload=(e)=>{
    const img=new Image();
    img.onload=()=>{
      const maxW=700; const scale=Math.min(1,maxW/img.width);
      const canvas=document.createElement('canvas'); canvas.width=img.width*scale; canvas.height=img.height*scale;
      const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,canvas.width,canvas.height);
      pendingPhoto=canvas.toDataURL('image/jpeg',0.6);
      const prev=document.getElementById('cf-photo-preview'); prev.src=pendingPhoto; prev.style.display='block';
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
async function submitChecklistConfirm(){
  const notes=document.getElementById('cf-notes').value.trim();
  const patch={ status:'completed', supervisor_id:S.session.user.id, completed_at:new Date().toISOString(), notes, photo:pendingPhoto, scanned:true };
  if(await dbUpdate('checklist_instances', S.scanCtx.instanceId, patch)){
    await loadChecklistInstances(); pendingPhoto=null; S.modal=null; S.scanCtx=null; render(); toast('تم تسجيل تنفيذ المهمة', true);
  }
}
async function loadChecklistInstances(){ S.checklistInstances = await dbSelect('checklist_instances'); }

/* ============================= ENSURE DAILY INSTANCES ============================= */
async function ensureTodayChecklistInstances(){
  const date=S.today;
  const existing = S.checklistInstances.filter(ci=>ci.date===date);
  const missing=[];
  S.checklistDefs.filter(c=>c.active).forEach(def=>{
    if(!existing.find(ci=>ci.checklist_definition_id===def.id)){
      missing.push({ id:uid('cli'), date, checklist_definition_id:def.id, location_id:def.location_id, shift:def.shift, status:'incomplete', supervisor_id:null, completed_at:null, notes:'', photo:null, scanned:false });
    }
  });
  if(missing.length){ await dbInsert('checklist_instances', missing); }
  S.checklistInstances = await dbSelect('checklist_instances');
}

/* ============================= BOOT ============================= */
async function loadRoleData(){
  const role=S.profile.role;
  S.locations = await dbSelect('locations');
  S.users = await dbSelect('profiles');
  if(role==='admin'||role==='opm'||role==='fm_dispatcher') S.orders = await dbSelect('paid_service_orders');
  if(role==='admin'||role==='opm'||role==='fm_dispatcher') S.pest = await dbSelect('pest_control_requests');
  if(role==='admin'||role==='opm') S.facade = await dbSelect('facade_works');
  if(role==='admin'||role==='opm') S.waste = await dbSelect('waste_removal_jobs');
  if(role==='admin'||role==='opm') S.deliveries = await dbSelect('delivery_units');
  if(role==='admin'||role==='opm') S.unitNotes = await dbSelect('unit_notes');
  if(role==='admin'||role==='opm'||role==='contractor_manager') S.installs = await dbSelect('installation_works');
  if(role==='admin') S.checklistDefs = await dbSelect('checklist_definitions');
  if(role==='admin'||role==='opm'||role==='contractor_manager'||role==='contractor_admin') S.attendance = await dbSelect('attendance_records');
  if(role==='admin'){ S.orders=await dbSelect('paid_service_orders'); S.deliveries=await dbSelect('delivery_units'); S.installs=await dbSelect('installation_works'); S.checklistInstances=await dbSelect('checklist_instances'); S.pest=await dbSelect('pest_control_requests'); S.facade=await dbSelect('facade_works'); S.waste=await dbSelect('waste_removal_jobs'); S.unitNotes=await dbSelect('unit_notes'); }
  if(role==='supervisor'){
    S.deliveries = await dbSelect('delivery_units');
    S.unitNotes = await dbSelect('unit_notes');
    S.orders = await dbSelect('paid_service_orders');
    S.pest = await dbSelect('pest_control_requests');
    S.facade = await dbSelect('facade_works');
    S.waste = await dbSelect('waste_removal_jobs');
    S.checklistDefs = await dbSelect('checklist_definitions');
    await ensureTodayChecklistInstances();
  }
  if(role==='admin') await ensureTodayChecklistInstances();
}

async function bootApp(){
  if(!S.profile){ render(); return; }
  if(S.profile.active===false){
    await sb.auth.signOut();
    S.session=null; S.profile=null;
    S.authError='تم تجميد هذا الحساب من قبل الإدارة. تواصل مع الإدارة لإعادة التفعيل.';
    render();
    return;
  }
  await loadRoleData();
  render();
  setupRealtime();
}

async function manualRefresh(){
  toast('جارِ التحديث...', true);
  await loadRoleData();
  render();
}

/* ============================= REALTIME + NOTIFICATIONS ============================= */
const NOTIFY_TABLES = {
  delivery_units: { module:'وحدات التسليم', tab:'deliveries', field:'assigned_supervisor_id' },
  paid_service_orders: { module:'الخدمة المدفوعة', tab:'orders', field:'assigned_supervisor_id' },
  pest_control_requests: { module:'مكافحة الحشرات', tab:'pest', field:'assigned_supervisor_id' },
  facade_works: { module:'نظافة الواجهات', tab:'facade', field:null },
  waste_removal_jobs: { module:'رفع المخلفات', tab:'waste', field:'assigned_supervisor_id' },
  installation_works: { module:'أعمال التأسيسات', tab:'installs', field:null },
};
let realtimeSetup = false;
function setupRealtime(){
  if(realtimeSetup || !sb) return;
  realtimeSetup = true;
  const channel = sb.channel('zw-live-updates');
  Object.keys(NOTIFY_TABLES).forEach(table=>{
    channel.on('postgres_changes', { event:'*', schema:'public', table }, (payload)=>{
      handleRealtimeEvent(table, payload);
    });
  });
  channel.subscribe();
}
async function handleRealtimeEvent(table, payload){
  await loadRoleData();
  if(payload.eventType==='INSERT'){
    const info = NOTIFY_TABLES[table];
    const row = payload.new;
    const myRole = S.profile.role;
    const isManagement = ['admin','opm','contractor_manager','contractor_admin'].includes(myRole);
    const isAssignedToMe = info.field && row[info.field] && S.session && row[info.field]===S.session.user.id;
    if(isManagement || isAssignedToMe){
      pushNotification(`مهمة جديدة: ${info.module}`, info.tab);
      playAlertSound();
    }
  }
  render();
}
function pushNotification(text, tab){
  S.notifications.unshift({ id: uid('ntf'), text, tab, time: new Date().toISOString(), read:false });
  S.notifications = S.notifications.slice(0, 30);
}
function playAlertSound(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0,0.18].forEach(delay=>{
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type='sine'; o.frequency.value=880;
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.35, ctx.currentTime+delay);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+delay+0.16);
      o.start(ctx.currentTime+delay); o.stop(ctx.currentTime+delay+0.17);
    });
  }catch(e){}
}

(async function init(){
  if(configMissing()){ render(); return; }
  await refreshSession();
  sb.auth.onAuthStateChange((event)=>{ if(event==='SIGNED_OUT'){ S.session=null; S.profile=null; realtimeSetup=false; render(); } });
  if(S.session) await bootApp(); else render();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
