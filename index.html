    const invListHtml = PHASE_OPTIONS.map(ph=>{
      const list = invByPhase[ph]||[];
      if(!list.length) return '';
      return `<h4 style="font-size:13px;margin:14px 0 6px;color:var(--mint);">${ph}</h4>
      <div class="tbl-wrap" style="box-shadow:none;"><table><thead><tr><th>المبلغ</th><th>الخصم</th><th>التاريخ</th><th>الحالة</th><th>الفاتورة</th><th></th></tr></thead><tbody>
        ${list.map(i=>`<tr><td>${Number(i.amount).toLocaleString()}</td><td>${Number(i.discount||0).toLocaleString()}</td><td>${i.invoice_date}</td><td>
          <select data-inv-status="${i.id}">${Object.keys(INVOICE_STATUS_LABEL).map(k=>`<option value="${k}" ${i.status===k?'selected':''}>${INVOICE_STATUS_LABEL[k]}</option>`).join('')}</select>
        </td><td>${i.photo?`<img src="${i.photo}" style="width:32px;height:32px;object-fit:cover;border-radius:6px;cursor:pointer;" data-view-photo="inv|${i.id}">`:'-'}</td>
        <td><button class="ghost-btn" data-inv-edit="${i.id}">تعديل</button> <button class="ghost-btn danger" data-inv-del="${i.id}">${ICON.trash(12)}</button></td></tr>`).join('')}
      </tbody></table></div>`;
    }).join('') || `<p style="font-size:12px;color:var(--text-dim);">لا توجد فواتير بعد</p>`;

    return modalWrap('ملف المورد: '+esc(s.name), `
      <div style="display:flex;gap:8px;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:12px;flex-wrap:wrap;">
        ${tabBtn('overview','نظرة عامة')}
        ${tabBtn('kpi','تقييم الأداء (KPI)')}
        ${tabBtn('invoices','الفواتير')}
      </div>
      ${activeTab==='overview'? overviewHtml : ''}
      ${activeTab==='kpi'? kpiFormHtml + kpiListHtml : ''}
      ${activeTab==='invoices'? invFormHtml + invListHtml : ''}
    `, 'full');
  }
  if(m.type==='editKpi'){
    const k = S.supplierKpi.find(x=>x.id===m.id);
    const kSupplier = S.suppliers.find(x=>x.id===k.supplier_id);
    const tpl = kpiTemplateFor(kSupplier?kSupplier.category:null);
    let items=[]; try{ items = typeof k.items==='string'? JSON.parse(k.items) : (k.items||[]); }catch(e){}

    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <div class="form-row" style="flex:1;min-width:140px;"><label>الشهر</label><input type="month" id="m-kpi-month" value="${k.month||''}"></div>
      <div class="form-row" style="flex:1;min-width:140px;"><label>الفيز</label><select id="m-kpi-phase">${PHASE_OPTIONS.map(p=>`<option value="${p}" ${((k.phase||'عام')===p)?'selected':''}>${p}</option>`).join('')}</select></div>
    </div>
    <div class="tbl-wrap" style="box-shadow:none;margin-bottom:8px;"><table><thead><tr><th>القسم</th><th>البند</th><th>الوزن %</th><th>الفعلي %</th></tr></thead><tbody>
      ${tpl.map((kt,idx)=>{ const existing = items[idx]? items[idx].actual : kt.weight; return `<tr><td>${kt.category}</td><td>${kt.name}</td><td>${kt.weight}</td><td><input type="number" min="0" max="${kt.weight}" id="kpi-actual-${idx}" value="${existing}" style="width:60px;border:1px solid var(--line);border-radius:6px;padding:4px;"></td></tr>`; }).join('')}
    </tbody></table></div>
    <button class="primary-btn" style="width:100%;justify-content:center;" id="m-save">حفظ التعديل</button>`, true);
  }
  if(m.type==='editInvoice'){
    const i = S.supplierInvoices.find(x=>x.id===m.id);
    return modalWrap('تعديل الفاتورة', `
    <div class="form-row"><label>المبلغ</label><input type="number" id="m-inv-amount" value="${i.amount||0}"></div>
    <div class="form-row"><label>الخصم (اختياري)</label><input type="number" id="m-inv-discount" value="${i.discount||0}"></div>
    <div class="form-row"><label>التاريخ</label><input type="date" id="m-inv-date" value="${i.invoice_date||''}"></div>
    <div class="form-row"><label>الفيز</label><select id="m-inv-phase">${PHASE_OPTIONS.map(p=>`<option value="${p}" ${((i.phase||'عام')===p)?'selected':''}>${p}</option>`).join('')}</select></div>
    <div class="form-row"><label>الحالة</label><select id="m-inv-status">${Object.keys(INVOICE_STATUS_LABEL).map(k=>`<option value="${k}" ${i.status===k?'selected':''}>${INVOICE_STATUS_LABEL[k]}</option>`).join('')}</select></div>
    <button class="primary-btn" style="width:100%;justify-content:center;" id="m-save">حفظ التعديل</button>`);
  }
  if(m.type==='addUnitNote') return modalWrap('إضافة ملاحظة عن الوحدة', `
    <div class="form-row"><label>وصف العطل أو التلفية</label><textarea id="m-note-text" placeholder="مثال: الباب الزجاجي مكسور"></textarea></div>
    <div class="form-row"><label>صورة (اختياري لكن يُفضّل)</label>
      <label class="ghost-btn file-btn" style="display:block;text-align:center;">${ICON.camera()} إضافة صورة<input type="file" accept="image/*" capture="environment" id="cf-photo"></label>
      <img id="cf-photo-preview" class="photo-preview" style="display:none;">
    </div>
    <button class="primary-btn" style="width:100%;justify-content:center;" id="m-save">${ICON.check(14)} حفظ الملاحظة</button>`);
  if(m.type==='viewUnitNotes'){
    const notes=(S.unitNotes||[]).filter(n=>n.delivery_unit_id===m.id);
    return modalWrap('ملاحظات الوحدة', notes.length? notes.map(n=>`
      <div style="border-bottom:1px dashed var(--line);padding:10px 0;">
        <div style="font-size:13px;">${esc(n.note)}</div>
        ${n.photo?`<img src="${n.photo}" class="photo-preview" style="max-height:180px;">`:''}
        <div style="font-size:11px;color:var(--text-dim);margin-top:4px;">${fmtTime(n.created_at)} · ${n.created_at?n.created_at.slice(0,10):''}</div>
      </div>`).join('') : `<p style="color:var(--text-dim);font-size:13px;">لا توجد ملاحظات على هذه الوحدة</p>`);
  }
  if(m.type==='scan') return modalWrap('مسح رمز QR', `
    <div class="scan-stage" id="scan-stage"><div class="scan-msg" id="scan-msg"><span class="em">📷</span>جارِ محاولة تشغيل الكاميرا...</div></div>
    <p style="font-size:12px;color:var(--text-dim);text-align:center;margin:10px 0 0;">الاعتماد بمسح الكود بالكاميرا مباشرة بس.</p>`);
  if(m.type==='confirmChecklist') return modalWrap('مراجعة واعتماد القائمة', `
    <div class="form-row"><label>ملاحظات (إلزامية لو غير مطابق)</label><textarea id="cf-notes"></textarea></div>
    <div class="form-row"><label>صورة إثبات (اختياري)</label>
      <label class="ghost-btn file-btn" style="display:block;text-align:center;">${ICON.camera()} إضافة صورة<input type="file" accept="image/*" capture="environment" id="cf-photo"></label>
      <img id="cf-photo-preview" class="photo-preview" style="display:none;">
    </div>
    <button class="primary-btn" style="width:100%;justify-content:center;" id="m-save">${ICON.check(14)} مطابق — اعتماد وإغلاق القائمة</button>
    <button class="ghost-btn danger" style="width:100%;justify-content:center;margin-top:8px;" id="m-reject">${ICON.x(14)} غير مطابق — مطلوب إعادة الفحص</button>`);
  return '';
}
function modalWrap(title, body, wide){
  const sizeClass = wide==='full' ? ' full' : (wide? ' wide' : '');
  return `<div class="modal-bg" data-close-modal="1"><div class="modal${sizeClass}" onclick="event.stopPropagation()">
    <div class="modal-head"><h3>${esc(title)}</h3><button class="close" data-close-modal="1">${ICON.x()}</button></div>
    <div class="modal-body">${body}</div>
  </div></div>`;
}
function supervisorOptions(){
  return S.users.filter(u=>u.role==='supervisor' && u.active).map(u=>`<option value="${u.id}">${esc(u.full_name)}</option>`).join('');
}

function bindModalEvents(){
  document.querySelectorAll('[data-close-modal]').forEach(b=>b.onclick=(e)=>{ if(e.target!==b) return; stopScanner(); pendingPhoto=null; S.modal=(S.modal&&S.modal.type==='viewPhoto'&&S.modal.back)?S.modal.back:null; S.scanCtx=null; render(); });
  const saveBtn=document.getElementById('m-save');
  if(saveBtn) saveBtn.onclick=handleModalSave;
  const rejBtn=document.getElementById('m-reject'); if(rejBtn) rejBtn.onclick=rejectTaskRun;
  const emCopy=document.getElementById('em-copy');
  if(emCopy) emCopy.onclick=async ()=>{ const t=document.getElementById('em-manual-msg'); try{ await navigator.clipboard.writeText(t.value); }catch(e){ t.select(); document.execCommand('copy'); } toast('تم نسخ الرسالة',true); };
  const freqSel=document.getElementById('m-tl-freq');
  if(freqSel) freqSel.onchange=()=>{
    document.getElementById('m-tl-weekday-row').style.display = freqSel.value==='weekly' ? '' : 'none';
    document.getElementById('m-tl-monthday-row').style.display = freqSel.value==='monthly' ? '' : 'none';
  };
  if(S.modal && S.modal.type==='qr') renderQrCanvas();
  if(S.modal && S.modal.type==='userQr') bindUserQrModal();
  if(S.modal && (S.modal.type==='scan')) startScanner();
  const qf=document.getElementById('qr-file-input'); if(qf) qf.onchange=e=>decodeFromFile(e.target.files[0]);
  const cfPhoto=document.getElementById('cf-photo'); if(cfPhoto) cfPhoto.onchange=e=>handlePhotoSelect(e.target.files[0]);
  const ordDateInput=document.getElementById('m-ord-date');
  if(ordDateInput){ updateOrderAvailabilityMsg(ordDateInput.value); ordDateInput.onchange=()=>updateOrderAvailabilityMsg(ordDateInput.value); }
  const ordUnitInput=document.getElementById('m-ord-unit'), ordTypeSel=document.getElementById('m-ord-type');
  if(ordUnitInput && ordTypeSel){
    let ordPriceTimer=null;
    const updateOrdPrice=async ()=>{
      const box=document.getElementById('ord-price-msg'); if(!box) return;
      box.innerHTML = '<span style="color:var(--text-dim);">جارِ البحث عن الوحدة...</span>';
      const p = await calcOrderPrice(ordTypeSel.value, ordUnitInput.value);
      const box2=document.getElementById('ord-price-msg'); if(box2) box2.innerHTML = priceDisplayHtml(p, false);
    };
    ordUnitInput.oninput=()=>{ clearTimeout(ordPriceTimer); ordPriceTimer=setTimeout(updateOrdPrice, 300); };
    ordTypeSel.onchange=updateOrdPrice; updateOrdPrice();
  }
  const pestUnitInput=document.getElementById('m-pest-unit'), pestTypeSel=document.getElementById('m-pest-type');
  if(pestUnitInput && pestTypeSel){
    let pestPriceTimer=null;
    const updatePestPrice=async ()=>{

async function startScanner(){
  const stage=document.getElementById('scan-stage'); const msgBox=document.getElementById('scan-msg'); if(!stage) return;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    S.stream=stream;
    stage.innerHTML=`<video id="scan-video" autoplay playsinline muted></video><div class="scan-frame">${ICON.bracket()}</div>`;
    const video=document.getElementById('scan-video'); video.srcObject=stream; await video.play();
    const canvas=document.createElement('canvas'); const ctx=canvas.getContext('2d'); let stopped=false;
    S.stopLoop=()=>{stopped=true;};
    function tick(){
      if(stopped||!S.scanCtx) return;
      if(video.readyState===video.HAVE_ENOUGH_DATA){
        canvas.width=video.videoWidth; canvas.height=video.videoHeight; ctx.drawImage(video,0,0,canvas.width,canvas.height);
        const img=ctx.getImageData(0,0,canvas.width,canvas.height); const code=jsQR(img.data,img.width,img.height);
        if(code&&code.data){ stopped=true; handleScannedCode(code.data); return; }
      }
      requestAnimationFrame(tick);
    }
    tick();
  }catch(e){
    if(msgBox) msgBox.innerHTML=`<span class="em">🚫</span>تعذّر الوصول للكاميرا — اسمح للمتصفح باستخدام الكاميرا وجرّب تاني.`;
  }
}
function stopScanner(){ if(S.stopLoop) S.stopLoop(); if(S.stream){ S.stream.getTracks().forEach(t=>t.stop()); S.stream=null; } }

function handleScannedCode(code){
  const clean=(code||'').trim();
  const listId = clean.startsWith('ZEDWEST|TL|') ? clean.split('|')[2] : clean;
  const run = (S.taskRuns||[]).find(r=>r.id===(S.scanCtx&&S.scanCtx.runId));
  if(!run){ toast('تعذر إيجاد المهمة',false); return; }
  if(run.list_id !== listId){ toast('هذا الرمز يخص قائمة مختلفة',false); return; }
  stopScanner();
  S.modal={type:'confirmChecklist'};
  render();
}

};
const EVENT_LABEL = { INSERT:'إضافة', UPDATE:'تعديل', DELETE:'حذف' };
let realtimeSetup = false;
let pollingStarted = false;
function setupRealtime(){
  // معطّل بطلب أحمد: التحديث اللحظي (realtime) + التحديث كل 25 ثانية كانا بيعملوا
  // render() كامل للشاشة حتى لو حد بيكتب في حقل دلوقتي، فكان بيمسح اللي بيتكتب
  // ويسيب التوزيعات / الحضور كأنها "اختفت". التنبيهات أصلاً ما كانتش شغالة لحد،
  // فالميزة دي اتلغت تمامًا. كل حفظ بيعمل تحديث لشاشته هو بس زي ما هو من غير تغيير.
  return;
  if(!sb) return;
  if(!realtimeSetup){
    realtimeSetup = true;
    const channel = sb.channel('zw-live-updates');
    const allTables = Array.from(new Set([...Object.keys(NOTIFY_TABLES), ...SILENT_REFRESH_TABLES, ...Object.keys(ALL_WATCHED_TABLES)]));
    allTables.forEach(table=>{
      channel.on('postgres_changes', { event:'*', schema:'public', table }, (payload)=>{
        handleRealtimeEvent(table, payload);
      });
    });
    channel.subscribe((status)=>{
      if(status==='CHANNEL_ERROR' || status==='TIMED_OUT' || status==='CLOSED'){
        // الاتصال قفل لأي سبب (شبكة، مهلة، إلخ) — نحاول نعيد الاتصال بعد شوية
        try{ sb.removeChannel(channel); }catch(e){}
        realtimeSetup = false;
        setTimeout(setupRealtime, 4000);
      }
    });
  }
  // شبكة أمان: تحديث دوري كل 25 ثانية حتى لو الاتصال اللحظي فشل تمامًا (بدون ما يقاطع أي مودال مفتوح)
  if(!pollingStarted){
    pollingStarted = true;
    setInterval(()=>{
      if(!S.session || S.modal) return;
      loadRoleData().then(render).catch(()=>{});
    }, 25000);
  }
}
async function handleRealtimeEvent(table, payload){
  await loadRoleData();
  const myRole = S.profile.role;

  // 1) صوت + إشعار للمهام الجديدة المخصصة لدور/شخص معين (زي ما كان)
  if(payload.eventType==='INSERT' && NOTIFY_TABLES[table]){
    const info = NOTIFY_TABLES[table];
    const row = payload.new;
    const isManagement = MGMT_ROLES.includes(myRole);
    const isAssignedToMe = info.field && row[info.field] && S.session && row[info.field]===S.session.user.id;
    if(isManagement || isAssignedToMe){
      pushNotification(`مهمة جديدة: ${info.module}`, info.tab);
      playAlertSound();
    }
  }
  // 2) الإدارة و OPM بس: إشعار بأي تغيير (إضافة/تعديل/حذف) على أي جدول في السيستم، حتى لو مش مهمة جديدة
  else if((myRole==='admin'||myRole==='opm') && ALL_WATCHED_TABLES[table]){
    const info = ALL_WATCHED_TABLES[table];
    pushNotification(`${EVENT_LABEL[payload.eventType]||'تغيير'}: ${info.module}`, info.tab);
  }
  render();
}

// المفتاح العام لـ Web Push (VAPID). لو فاضي: الإشعارات بتشتغل والتطبيق مفتوح بس.
const VAPID_PUBLIC_KEY = '';
const _pendingTab = (()=>{ try{ return new URLSearchParams(location.search).get('tab'); }catch(e){ return null; } })();
Object.assign(S,{ notifSeen:new Set(), pushActive:false, pushEndpoint:null, notifSkipUnsupported:false });
function notifSupported(){ return typeof Notification!=='undefined'; }
function notifGateNeeded(){
  if(!S.session || !S.profile) return false;
  if(!notifSupported()) return !S.notifSkipUnsupported;
  return Notification.permission!=='granted';
}
function renderNotifGate(){
  if(!notifGateNeeded()) return '';
  if(!notifSupported()) return `<div class="gate"><div class="gate-card"><div class="gate-ico">📲</div>
    <h2>الإشعارات مش متاحة في المتصفح ده</h2>
    <p>عشان توصلك تنبيهات الشغل لازم تفتح التطبيق كتطبيق على الموبايل: افتح الموقع في <b>Safari</b> ← زرار المشاركة ← <b>إضافة إلى الشاشة الرئيسية</b>، وبعدها افتحه من الأيقونة وفعّل الإشعارات.</p>
    <button class="primary-btn" id="gate-skip" style="width:100%;justify-content:center;">متابعة بدون إشعارات</button></div></div>`;
  const denied = Notification.permission==='denied';
  return `<div class="gate"><div class="gate-card"><div class="gate-ico">🔔</div>
    <h2>فعّل الإشعارات عشان تكمل</h2>
    <p>هتوصلك تنبيهات فورية بأي حاجة تخصك: <b>التاسكات المستعجلة</b>، <b>الطوارئ</b>، الأوردرات، المهمات، وطلبات الحضور. الإشعار بيوصل <b>للشخص المعني بس</b>.</p>
    ${denied ? `<div class="gate-warn">الإشعارات متقفلة على المتصفح. افتح إعدادات الموقع (🔒 جنب العنوان ← الإشعارات ← سماح)، وبعدها دوس تحقق تاني.</div>
      <button class="primary-btn" id="gate-retry" style="width:100%;justify-content:center;">تحقق تاني</button>`
    : `<button class="primary-btn" id="gate-allow" style="width:100%;justify-content:center;">تفعيل الإشعارات — دوس Allow</button>`}
  </div></div>`;
}
function bindNotifGate(){
  const al=document.getElementById('gate-allow');
  if(al) al.onclick=async ()=>{ al.disabled=true; try{ await Notification.requestPermission(); }catch(e){} if(Notification.permission==='granted'){ await ensurePushSubscription(); toast('تم تفعيل الإشعارات',true); } render(); };
  const rt=document.getElementById('gate-retry'); if(rt) rt.onclick=async ()=>{ if(Notification.permission==='granted') await ensurePushSubscription(); render(); };
  const sk=document.getElementById('gate-skip'); if(sk) sk.onclick=()=>{ S.notifSkipUnsupported=true; render(); };
}
function b64ToU8(b64){ const pad='='.repeat((4-b64.length%4)%4); const raw=atob((b64+pad).replace(/-/g,'+').replace(/_/g,'/')); const a=new Uint8Array(raw.length); for(let i=0;i<raw.length;i++) a[i]=raw.charCodeAt(i); return a; }
async function ensurePushSubscription(){
  S.pushActive=false;
  try{
    if(!VAPID_PUBLIC_KEY || !('serviceWorker' in navigator) || !('PushManager' in window) || !notifSupported() || Notification.permission!=='granted') return;
    const reg=await Promise.race([ navigator.serviceWorker.ready, new Promise((_,rej)=>setTimeout(()=>rej(new Error('sw timeout')),6000)) ]);
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64ToU8(VAPID_PUBLIC_KEY) });
    const j=sub.toJSON();
    const {error}=await sb.rpc('register_push',{ p_endpoint:j.endpoint, p_p256dh:j.keys.p256dh, p_auth:j.keys.auth, p_ua:(navigator.userAgent||'').slice(0,200) });
    if(error){ console.warn('register_push',error.message); return; }
    S.pushActive=true; S.pushEndpoint=j.endpoint;
  }catch(e){ console.warn('push subscribe',e&&e.message); }
}
function notifTarget(tab){
  const role=S.profile.role; const allowed=tabsForRole(role).map(t=>t[0]);
  if(role==='supervisor' && ['deliveries','orders','distribution'].includes(tab)) tab='today';
  return allowed.includes(tab) ? tab : (allowed[0]||null);
}
async function loadNotifications(initial){
  if(!S.session||!S.profile) return;
  const {data,error}=await sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(40);
  if(error){ console.warn('notifications',error.message); return; }
  const seen=S.notifSeen||new Set();
  const fresh=(data||[]).filter(n=>!n.read && !seen.has(n.id));
  (data||[]).forEach(n=>seen.add(n.id)); S.notifSeen=seen;
  S.notifications=(data||[]).map(n=>({ id:n.id, text:(n.title||'')+(n.body?' — '+n.body:''), tab:n.tab, time:n.created_at, read:!!n.read, kind:n.kind }));
  if(!initial && fresh.length){
    playAlertSound(); toast('🔔 '+(fresh[0].title||'إشعار جديد'), true);
    if(!S.pushActive) fresh.forEach(n=>notifyDevice(n.title||'إشعار', n.body||'', 'ntf-'+n.id));
  }
  const sig=(data||[]).map(n=>n.id+(n.read?'r':'u')).join(',');
  const changed = sig!==S._ntfSig; S._ntfSig=sig;
  if(!initial && changed && document.visibilityState==='visible' && !S.modal && !hasUnsavedInput()) render();
}
async function markNotificationsRead(){
  const ids=(S.notifications||[]).filter(n=>!n.read && n.id).map(n=>n.id);
  (S.notifications||[]).forEach(n=>n.read=true);
  if(ids.length){ const {error}=await sb.from('notifications').update({ read:true }).in('id',ids); if(error) console.warn('notifications read',error.message); }
}

  });
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && S.session && S.profile) loadNotifications(false); });

/* ============================= v5: mobile app-like navigation + card tables ============================= */
function menuIcon(sz){ return `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>`; }
function renderBottomNav(tabs){
  const many=tabs.length>5; const primary=many? tabs.slice(0,4) : tabs;
  const short=l=> l.length>11 ? l.slice(0,10)+'…' : l;
  const btn=([id,label])=>`<button data-tab="${id}" class="${S.tab===id?'active':''}">${ICON[TAB_ICON[id]]?ICON[TAB_ICON[id]](20):''}<span>${esc(short(label))}</span></button>`;
  const moreActive = many && !primary.some(t=>t[0]===S.tab);
  return `<nav class="bottom-nav">${primary.map(btn).join('')}${many?`<button id="more-btn" class="${moreActive?'active':''}">${menuIcon(20)}<span>المزيد</span></button>`:''}</nav>`;
}
function renderDrawer(tabs){
  return `<div class="drawer-bg" id="drawer-bg"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head"><div><div style="font-weight:900;font-size:15px;">${esc(S.profile.full_name||'')}</div><div style="font-size:12px;opacity:.85;margin-top:2px;">${esc(ROLE_LABEL[S.profile.role]||'')}</div></div><button id="drawer-close" class="tb-menu" style="display:inline-flex;">✕</button></div>
    <div class="drawer-list">${tabs.map(([id,label])=>`<button data-tab="${id}" class="${S.tab===id?'active':''}">${ICON[TAB_ICON[id]]?ICON[TAB_ICON[id]](20):''}<span>${esc(label)}</span></button>`).join('')}</div>
    <div class="drawer-foot"><button class="ghost-btn danger" id="drawer-logout" style="width:100%;justify-content:center;">تسجيل الخروج</button></div>
  </aside>`;
}
function bindMobileNav(){
  const bg=document.getElementById('drawer-bg'), dr=document.getElementById('drawer');
  const open=()=>{ if(bg) bg.classList.add('open'); if(dr) dr.classList.add('open'); };
  const close=()=>{ if(bg) bg.classList.remove('open'); if(dr) dr.classList.remove('open'); };
  const mb=document.getElementById('menu-btn'); if(mb) mb.onclick=open;
  const more=document.getElementById('more-btn'); if(more) more.onclick=open;
  if(bg) bg.onclick=close;
  const dc=document.getElementById('drawer-close'); if(dc) dc.onclick=close;
  const dl=document.getElementById('drawer-logout'); if(dl) dl.onclick=doSignOut;
}
// الجداول على الموبايل بتتحول لكروت: كل خلية ليها عنوانها
function enhanceTables(){
  document.querySelectorAll('.tbl-wrap table').forEach(t=>{
    const heads=Array.from(t.querySelectorAll('thead th')).map(th=>th.textContent.trim());
    t.classList.add('rtable');
    t.querySelectorAll('tbody tr').forEach(tr=>{
      const tds=Array.from(tr.children);
      if(tds.length===1 && tds[0].hasAttribute('colspan')){ tr.classList.add('empty-row'); return; }
      tds.forEach((td,i)=>td.setAttribute('data-label', heads[i]||''));
    });
  });
}

function pushNotification(text, tab){
  S.notifications.unshift({ id: uid('ntf'), text, tab, time: new Date().toISOString(), read:false });
  S.notifications = S.notifications.slice(0, 30);
}
function playAlertSound(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0,0.18].forEach(delay=>{
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type='sine'; o.frequency.value=880;
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.35, ctx.currentTime+delay);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+delay+0.16);
      o.start(ctx.currentTime+delay); o.stop(ctx.currentTime+delay+0.17);
    });
  }catch(e){}
}

(async function init(){
  if(configMissing()){ render(); return; }
  const registerAuthListener=()=>sb.auth.onAuthStateChange((event)=>{ if(event==='SIGNED_OUT'){ S.session=null; S.profile=null; realtimeSetup=false; render(); } });
  // دخول بكود QR: ?qr=TOKEN — نشيله من الرابط فورًا ونطلّع أي مستخدم داخل قبل ما ندخّل صاحب الكود
  const qrParam = new URLSearchParams(location.search).get('qr');
  if(qrParam){
    try{ history.replaceState(null,'',location.pathname+location.hash); }catch(e){}
    try{ await sb.auth.signOut(); }catch(e){}
    S.session=null; S.profile=null;
    registerAuthListener();
    const tok = parseQrToken(qrParam);
    if(tok){ await qrLoginWithToken(tok); }
    else { S.authError='كود الدخول غير صالح'; render(); }
    return;
  }
  await refreshSession();
  registerAuthListener();
  if(S.session) await bootApp(); else render();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
