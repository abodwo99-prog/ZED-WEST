<style>
:root{
  --ink:#0E3A6E; --ink-2:#145090; --mint:#1E6FCF; --mint-light:#E5EFFB; --brand:#3B8BE6; --brand-light:#A6CAF3;
  --sand:#F5F5F5; --paper:#FFFFFF; --amber:#DA8B1F; --amber-light:#FBF0DD;
  --coral:#D9483B; --coral-light:#FCE7E5; --blue:#0E8F9C; --blue-light:#DFF3F5;
  --line:#DFE5EE; --text:#1B2028; --text-dim:#66707F; --radius:14px;
  --shadow: 0 2px 10px rgba(14,58,110,.06), 0 1px 2px rgba(14,58,110,.08);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:var(--sand); color:var(--text); font-family:'Tajawal',sans-serif; min-height:100vh; font-variant-numeric:tabular-nums;}
h1,h2,h3,.display{font-family:'Cairo',sans-serif;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}
.bk{position:absolute;width:16px;height:16px;pointer-events:none;}
.bk-tl{top:-1px;right:-1px;border-top:3px solid currentColor;border-right:3px solid currentColor;border-top-right-radius:6px;}
.bk-tr{top:-1px;left:-1px;border-top:3px solid currentColor;border-left:3px solid currentColor;border-top-left-radius:6px;}
.bk-bl{bottom:-1px;right:-1px;border-bottom:3px solid currentColor;border-right:3px solid currentColor;border-bottom-right-radius:6px;}
.bk-br{bottom:-1px;left:-1px;border-bottom:3px solid currentColor;border-left:3px solid currentColor;border-bottom-right-radius:6px;}
.viewfinder{position:relative;color:var(--mint);}
.topbar{background:var(--ink);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:50;box-shadow:var(--shadow);flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:38px;height:38px;position:relative;color:var(--mint);display:flex;align-items:center;justify-content:center;font-family:'Cairo';font-weight:900;font-size:15px;border:2px solid rgba(255,255,255,.15);border-radius:8px;background:rgba(255,255,255,.04);}
.brand-text .t1{font-family:'Cairo';font-weight:900;font-size:16px;letter-spacing:.5px;line-height:1.1;}
.brand-text .t2{font-size:11px;color:#BCD6F4;margin-top:1px;}
.role-badge{background:rgba(255,255,255,.1);color:#fff;padding:5px 12px;border-radius:999px;font-size:11.5px;font-weight:800;}
.wrap{max-width:1200px;margin:0 auto;padding:20px;}
.shell{display:flex;gap:18px;align-items:flex-start;max-width:1300px;margin:0 auto;padding:20px;}
.sidebar{width:230px;flex-shrink:0;display:flex;flex-direction:column;gap:3px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:var(--shadow);position:sticky;top:78px;}
.sidebar button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:none;background:transparent;color:var(--text-dim);font-weight:700;font-size:13px;text-align:right;width:100%;transition:.15s;}
.sidebar button svg{flex-shrink:0;opacity:.75;}
.sidebar button.active{background:var(--ink);color:#fff;}
.sidebar button.active svg{opacity:1;}
.sidebar button:not(.active):hover{background:var(--sand);color:var(--ink);}
.content{flex:1;min-width:0;}
@media(max-width:820px){
  .shell{flex-direction:column;padding:12px;gap:12px;}
  .sidebar{display:none;}
  .mobile-tab-select{display:block !important;}
}
.mobile-tab-select{display:none;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);font-weight:800;font-size:14px;background:var(--paper);color:var(--ink);margin-bottom:2px;}
.service-card{cursor:pointer;transition:.15s;}
.service-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(14,58,110,.12);}
.tabs button{border:1px solid var(--line);background:var(--paper);color:var(--text-dim);padding:9px 16px;border-radius:10px;font-weight:700;font-size:13.5px;transition:.15s;}
.tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.tabs button:not(.active):hover{border-color:var(--mint);color:var(--ink);}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px;flex-wrap:wrap;gap:8px;}
.section-title h2{font-size:17px;margin:0;}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
.stat .num{font-family:'Cairo';font-weight:900;font-size:24px;line-height:1;}
.stat .lbl{font-size:11.5px;color:var(--text-dim);margin-top:6px;font-weight:700;}
.stat.mint .num{color:var(--mint);} .stat.amber .num{color:var(--amber);} .stat.coral .num{color:var(--coral);} .stat.ink .num{color:var(--ink);} .stat.blue .num{color:var(--blue);}
.tbl-wrap{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto;box-shadow:var(--shadow);margin-bottom:18px;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px;}
th{background:var(--ink);color:#fff;text-align:right;padding:10px 12px;font-weight:700;font-size:11.5px;white-space:nowrap;}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;}
tr:last-child td{border-bottom:none;}
.badge{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;}
.badge.done{background:var(--mint-light);color:var(--mint);} .badge.pending{background:var(--amber-light);color:var(--amber);}
.badge.progress{background:var(--blue-light);color:var(--blue);} .badge.postponed{background:var(--coral-light);color:var(--coral);}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:14px;background:var(--paper);border:1px solid var(--line);padding:12px;border-radius:12px;}
.fgroup{display:flex;flex-direction:column;gap:3px;}
.fgroup label{font-size:11px;color:var(--text-dim);font-weight:700;}
.fgroup input,.fgroup select{border:1px solid var(--line);background:var(--sand);border-radius:8px;padding:8px 10px;font-size:13px;}
.primary-btn{border:none;background:var(--mint);color:#fff;border-radius:10px;padding:10px 16px;font-weight:800;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;transition:.15s;}
.primary-btn:hover{background:#1859AB;} .primary-btn:disabled{background:#ccc;}
.ghost-btn{border:1px solid var(--line);background:var(--paper);color:var(--text);border-radius:9px;padding:8px 13px;font-weight:700;font-size:12.5px;}
.ghost-btn:hover{border-color:var(--mint);color:var(--mint);}
.ghost-btn.danger:hover{border-color:var(--coral);color:var(--coral);}
.form-row{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
.form-row label{font-size:12px;font-weight:700;color:var(--text-dim);}
.form-row input,.form-row select,.form-row textarea{border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;background:var(--sand);}
.form-row textarea{resize:vertical;min-height:55px;}
.modal-bg{position:fixed;inset:0;background:rgba(14,58,110,.55);backdrop-filter:blur(2px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:var(--paper);border-radius:18px;max-width:460px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal.wide{max-width:640px;}
.modal.full{max-width:1180px;max-height:96vh;}
.modal-head{padding:18px 20px 8px;display:flex;justify-content:space-between;align-items:flex-start;}
.modal-head h3{margin:0;font-size:16px;}
.modal-head .close{border:none;background:var(--sand);width:30px;height:30px;border-radius:50%;color:var(--text-dim);flex-shrink:0;font-size:14px;}
.modal-body{padding:6px 20px 20px;}
.tag-shift{font-size:10.5px;padding:2px 8px;border-radius:6px;font-weight:800;}
.tag-shift.morning{background:var(--amber-light);color:var(--amber);}
.tag-shift.evening{background:#EDE6FA;color:#6B3FBF;}
.tag-shift.both{background:var(--mint-light);color:var(--mint);}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-dim);}
.empty-state .em{font-size:34px;display:block;margin-bottom:8px;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:12px;font-weight:700;font-size:13.5px;box-shadow:var(--shadow);z-index:400;}
.toast.ok{background:var(--mint);}
.scan-stage{background:var(--ink);border-radius:14px;overflow:hidden;position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;}
.scan-stage video{width:100%;height:100%;object-fit:cover;}
.scan-frame{position:absolute;inset:16%;border-radius:16px;color:#fff;}
.scan-msg{color:#fff;text-align:center;padding:20px;font-size:13px;line-height:1.7;}
.scan-msg .em{font-size:32px;display:block;margin-bottom:8px;}
.file-btn{position:relative;overflow:hidden;text-align:center;}
.file-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
.photo-preview{width:100%;max-height:150px;object-fit:cover;border-radius:10px;margin-top:8px;border:1px solid var(--line);}
#qr-render-target{display:flex;justify-content:center;margin:10px 0;}
#qr-render-target img,#qr-render-target canvas{border-radius:10px;border:8px solid #fff;box-shadow:var(--shadow);}
.print-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:20px;}
.print-tile{border:2px dashed #999;border-radius:10px;text-align:center;padding:12px;}
.print-tile .pn{font-family:'Cairo';font-weight:800;font-size:12px;margin-top:6px;}
.print-sheet{display:none;}
@media print{ body *{visibility:hidden;} #print-preview,#print-preview *,.print-sheet,.print-sheet *{visibility:visible;} .print-sheet{display:block;position:absolute;top:0;right:0;left:0;} #print-preview{position:absolute;top:0;right:0;left:0;} }
.home-blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:18px;}
.pill-group{display:flex;gap:6px;flex-wrap:wrap;}
.pill{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;background:var(--paper);cursor:pointer;}
.pill.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.multi-sel{min-width:150px;min-height:70px;}
@media(max-width:640px){ .wrap{padding:12px;} table{min-width:480px;} }

/* ===== Professional polish ===== */
body{-webkit-font-smoothing:antialiased;}
.topbar{border-bottom:2px solid var(--mint);}
.stat{position:relative;overflow:hidden;}
.stat:before{content:'';position:absolute;top:0;right:0;left:0;height:3px;background:var(--line);}
.stat.mint:before{background:var(--mint);} .stat.amber:before{background:var(--amber);} .stat.coral:before{background:var(--coral);} .stat.blue:before{background:var(--blue);} .stat.ink:before{background:var(--ink);}
th{letter-spacing:.2px;}
tbody tr:hover td{background:#F2F6FC;}
.sidebar button.active{box-shadow:inset -3px 0 0 var(--mint);}
.primary-btn{box-shadow:0 1px 2px rgba(14,58,110,.15);}
.primary-btn:not(:disabled):hover{transform:translateY(-1px);}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--mint) !important;box-shadow:0 0 0 3px rgba(59,139,230,.18);}
.modal{border-radius:16px;}
.tbl-wrap,.card,.stat,.toolbar,.sidebar{border-color:#DFE5EE;}

/* ===== Ora background (inside the app only, after login) ===== */
/* Ora background removed per Ahmed's request — restored original background */

/* ===== Mobile / small screens (phones) ===== */
html{-webkit-text-size-adjust:100%;}
body{overflow-x:clip;-webkit-tap-highlight-color:transparent;}
button,select,input,textarea,label{touch-action:manipulation;}
img,canvas,svg{max-width:100%;}
.mobile-tabs{display:none;}
@media(max-width:820px){
  /* the page must never be wider than the screen: let the content column shrink so tables scroll inside their own wrapper */
  .shell{align-items:stretch;padding:10px 12px calc(16px + env(safe-area-inset-bottom));}
  .content{width:100%;max-width:100%;}
  .mobile-tabs{display:flex;gap:8px;overflow-x:auto;position:sticky;top:0;z-index:60;background:var(--sand);padding:10px 12px;border-bottom:1px solid var(--line);scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;}
  .mobile-tabs::-webkit-scrollbar{display:none;}
  .mobile-tabs button{flex-shrink:0;white-space:nowrap;scroll-snap-align:center;border:1px solid var(--line);background:var(--paper);color:var(--text-dim);padding:9px 15px;border-radius:999px;font-weight:700;font-size:13.5px;font-family:inherit;}
  .mobile-tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .topbar{padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));gap:8px;flex-wrap:nowrap;}
  .topbar .brand{min-width:0;}
  .topbar .brand img{height:28px !important;}
  .brand-text .t1{font-size:14px;white-space:nowrap;}
  .brand-text .t2,.tb-date,.tb-name{display:none;}
  .tb-right{gap:6px !important;flex-shrink:0;}
  .role-badge{font-size:11px;padding:4px 10px;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .grid-2{grid-template-columns:1fr !important;}
  .section-title h2{font-size:16px;}
  .stat-row{grid-template-columns:repeat(2,1fr);gap:10px;}
  .card{padding:14px;}
  .toolbar{padding:10px;}
  .toolbar>*{flex:1 1 140px;}
  /* tables: compact, keep the first column (unit / name) visible while scrolling sideways */
  table{min-width:0;}
  th,td{padding:8px 10px;}
  th:first-child,td:first-child{position:sticky;right:0;z-index:2;}
  td:first-child{background:var(--paper);box-shadow:-6px 0 8px -6px rgba(14,58,110,.18);}
  /* comfortable touch targets + no iOS zoom-on-focus */
  input:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea{font-size:16px !important;min-height:42px;}
  .ghost-btn,.primary-btn{min-height:40px;}
  td .ghost-btn,td select{min-height:36px;}
  .toast{max-width:calc(100% - 24px);width:max-content;bottom:calc(16px + env(safe-area-inset-bottom));text-align:center;}
}
@media(max-width:640px){
  /* modals become bottom sheets */
  .modal-bg{align-items:flex-end;padding:0;}
  .modal,.modal.wide,.modal.full{max-width:100%;border-radius:20px 20px 0 0;max-height:92vh;max-height:92dvh;}
  .modal.full{max-height:95vh;max-height:95dvh;}
  .modal-head{padding:16px 16px 6px;position:sticky;top:0;background:var(--paper);z-index:3;}
  .modal-body{padding:6px 16px calc(20px + env(safe-area-inset-bottom));}
}

/* ===== QR login ===== */
.qr-or{display:flex;align-items:center;gap:10px;margin:14px 0 10px;color:var(--text-dim);font-size:12px;}
.qr-or:before,.qr-or:after{content:'';flex:1;height:1px;background:var(--line);}
.qr-thumb{width:64px;height:64px;cursor:pointer;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center;}
.qr-thumb img,.qr-thumb canvas{width:100% !important;height:100% !important;}
#user-qr-target{display:flex;justify-content:center;margin:10px 0;}
#user-qr-target img,#user-qr-target canvas{border-radius:10px;border:8px solid #fff;box-shadow:var(--shadow);}
.auth-info{background:var(--blue-light);color:var(--blue);padding:9px 12px;border-radius:9px;font-size:12.5px;margin-bottom:10px;}

/* ===== photos / scheduled tasks ===== */
.photo-preview{object-fit:contain;background:var(--sand);}
details.card>summary{list-style:none;}
details.card>summary::-webkit-details-marker{display:none;}

/* ===== ZED brand skin (colors from the ZED logo: #3B8BE6 green + #F5F5F5 grey) ===== */
body{background:var(--sand);}
.topbar{background:linear-gradient(135deg,var(--ink),var(--ink-2));border-bottom:3px solid var(--brand);}
.brand-mark{color:var(--brand-light);border-color:rgba(255,255,255,.22);}
.sidebar{border-radius:18px;padding:12px;gap:4px;}
.sidebar button{border-radius:12px;padding:11px 13px;}
.sidebar button.active{background:linear-gradient(135deg,var(--ink),var(--ink-2));box-shadow:inset -4px 0 0 var(--brand);}
.sidebar button:not(.active):hover{background:var(--mint-light);color:var(--ink);}
.card,.stat,.tbl-wrap,.toolbar{border-radius:16px;}
.card,.stat,.tbl-wrap{box-shadow:0 1px 2px rgba(14,58,110,.05),0 8px 22px rgba(14,58,110,.06);}
.stat:before{height:4px;}
.stat.mint:before{background:var(--brand);}
th{background:var(--ink-2);}
tbody tr:hover td{background:var(--mint-light);}
.primary-btn{border-radius:11px;box-shadow:0 2px 8px rgba(30,111,207,.28);}
.ghost-btn{border-radius:10px;}
.ghost-btn:hover{background:var(--mint-light);}
.service-card:hover{border-color:var(--brand);box-shadow:0 8px 24px rgba(59,139,230,.18);}
.pill.active,.tabs button.active,.mobile-tabs button.active{background:var(--ink-2);border-color:var(--ink-2);}
.badge.done{background:var(--mint-light);color:var(--mint);}
input:focus,select:focus,textarea:focus{border-color:var(--brand) !important;box-shadow:0 0 0 3px rgba(59,139,230,.2);}
.modal{border-radius:18px;}
.modal-head h3{color:var(--ink);}
.section-title h2{color:var(--ink);}
td select,.tbl-wrap select{border:1px solid var(--line);border-radius:9px;padding:6px 8px;background:#fff;color:var(--text);font-size:12.5px;}

body.on-login::before{opacity:1;}
body.on-login::after{content:'';position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(8,30,62,.55),rgba(8,30,62,.78));pointer-events:none;}
.login-logos{display:flex;align-items:center;justify-content:center;gap:16px;}
.login-logos img{height:54px;width:auto;max-width:46%;object-fit:contain;}
.login-logos img.ora{height:50px;}
.login-sep{width:1px;height:46px;background:var(--line);}
.opm-chip{display:inline-block;margin-top:8px;background:var(--mint-light);color:var(--mint);font-size:11.5px;font-weight:800;padding:4px 12px;border-radius:999px;}
@media print{body::before,body::after{display:none !important;}}

/* ===== v5: mobile app-like UI, drawer, notification gate ===== */
.tb-menu{display:none;border:none;background:rgba(255,255,255,.14);color:#fff;width:38px;height:38px;border-radius:11px;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;}
.bottom-nav{display:none;}
.drawer-bg{position:fixed;inset:0;z-index:120;background:rgba(8,30,62,.5);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .25s;}
.drawer-bg.open{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(330px,86vw);z-index:130;background:var(--paper);box-shadow:-14px 0 40px rgba(8,30,62,.3);transform:translateX(108%);transition:transform .32s cubic-bezier(.22,.8,.3,1);display:flex;flex-direction:column;}
.drawer.open{transform:translateX(0);}
.drawer-head{background:linear-gradient(135deg,var(--ink),var(--ink-2));color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.drawer-list{overflow-y:auto;padding:10px;flex:1;display:flex;flex-direction:column;gap:4px;}
.drawer-list button{display:flex;align-items:center;gap:12px;padding:13px 14px;border:none;background:none;border-radius:13px;font-weight:800;font-size:14px;color:var(--text);text-align:right;transition:background .15s,transform .12s;}
.drawer-list button.active{background:var(--mint-light);color:var(--mint);}
.drawer-list button:active{transform:scale(.97);}
.drawer-foot{padding:12px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);}
.gate{position:fixed;inset:0;z-index:1000;background:rgba(8,30,62,.94);display:flex;align-items:center;justify-content:center;padding:20px;}
.gate-card{background:#fff;border-radius:22px;padding:26px 22px;max-width:420px;width:100%;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.4);animation:sheetUp .3s ease both;}
.gate-card h2{margin:6px 0 8px;font-size:18px;color:var(--ink);}
.gate-card p{font-size:13.5px;color:var(--text-dim);line-height:1.9;margin:0 0 16px;}
.gate-ico{font-size:46px;line-height:1;}
.gate-warn{background:var(--amber-light);color:var(--amber);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.8;margin-bottom:12px;}
@keyframes tabIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.tab-enter{animation:tabIn .3s ease both;}
@keyframes sheetUp{from{opacity:0;transform:translateY(34px);}to{opacity:1;transform:none;}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px);}to{opacity:1;transform:translate(-50%,0);}}
.toast{animation:toastIn .25s ease both;}
@media(max-width:820px){
  .tb-menu{display:inline-flex;}
  .mobile-tabs{display:none !important;}
  .shell{padding-bottom:calc(94px + env(safe-area-inset-bottom)) !important;}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:70;background:var(--paper);border-top:1px solid var(--line);box-shadow:0 -6px 22px rgba(14,58,110,.12);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px;}
  .bottom-nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;color:var(--text-dim);font-size:10.5px;font-weight:800;padding:7px 2px;border-radius:13px;transition:background .18s,color .18s,transform .12s;}
  .bottom-nav button svg{transition:transform .18s;}
  .bottom-nav button.active{color:var(--mint);background:var(--mint-light);}
  .bottom-nav button.active svg{transform:translateY(-1px) scale(1.12);}
  .bottom-nav button:active{transform:scale(.92);}
  .primary-btn:active,.ghost-btn:active{transform:scale(.96);}
  .modal{animation:sheetUp .28s ease both;}
  .card{border-radius:16px;}
  .content{min-width:0;}
}
@media(max-width:640px){
  .tbl-wrap{background:transparent;border:none;box-shadow:none;overflow:visible;}
  table.rtable{min-width:0 !important;display:block;width:100%;}
  table.rtable thead{display:none;}
  table.rtable tbody{display:block;}
  table.rtable tr{display:block;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:4px 14px 6px;margin-bottom:12px;box-shadow:0 2px 10px rgba(14,58,110,.08);}
  table.rtable td{display:flex;justify-content:space-between;align-items:center;gap:12px;white-space:normal;text-align:left;padding:9px 0;border-bottom:1px dashed var(--line);position:static !important;box-shadow:none !important;background:transparent !important;}
  table.rtable td:last-child{border-bottom:none;}
  table.rtable td::before{content:attr(data-label);font-weight:800;font-size:11.5px;color:var(--text-dim);flex-shrink:0;text-align:right;}
  table.rtable td[data-label=""]::before{display:none;}
  table.rtable td[data-label=""]{justify-content:flex-end;flex-wrap:wrap;}
  table.rtable td:first-child{font-weight:800;background:var(--mint-light) !important;margin:0 -14px 2px;padding:10px 14px;border-radius:14px 14px 0 0;border-bottom:none;}
  table.rtable tr.empty-row{padding:0;}
  table.rtable tr.empty-row td{display:block;text-align:center;border:none;background:transparent !important;margin:0;padding:22px 10px;}
  table.rtable tr.empty-row td::before{display:none;}
}
</style>

/* ============================= DB HELPERS ============================= */
async function dbSelect(table, filters){
  let q = sb.from(table).select('*');
  if(filters) Object.keys(filters).forEach(k=>{ q = q.eq(k, filters[k]); });
  const {data,error} = await q;
  if(error){ console.error(table, error); toast('تعذّر تحديث بيانات "'+table+'" — '+error.message, false); return null; }
  return data||[];
}
async function dbInsert(table, rows){ const {error}=await sb.from(table).insert(rows); if(error){ console.error(table,error); toast('حصل خطأ: '+error.message,false); } return !error; }
async function dbUpdate(table, id, patch){ const {error}=await sb.from(table).update(patch).eq('id',id); if(error){ console.error(table,error); toast('حصل خطأ: '+error.message,false); } return !error; }
async function dbDeleteWhere(table, filters){
  let q = sb.from(table).delete();
  Object.keys(filters).forEach(k=>{ q = q.eq(k, filters[k]); });
  const {error} = await q;
  if(error){ console.error(table,error); toast('حصل خطأ: '+error.message,false); }
  return !error;
}
async function dbDelete(table, id){ const {error}=await sb.from(table).delete().eq('id',id); if(error){ console.error(table,error); toast('حصل خطأ: '+error.message,false); } return !error; }

async function fetchProfile(userId){
  const {data,error} = await sb.from('profiles').select('*').eq('id',userId).maybeSingle();
  if(error){ console.error(error); return null; }
  return data;
}
async function refreshSession(){
  const {data} = await sb.auth.getSession();

}

  if(/already registered/i.test(msg)) return 'الإيميل ده مسجل بالفعل، جرب تسجيل الدخول';
  if(/invalid login credentials/i.test(msg)) return 'الإيميل أو الباسورد غلط';
  if(/password/i.test(msg)) return 'الباسورد لازم يكون 6 حروف على الأقل';
  return 'حصل خطأ: '+msg;
}

/* ============================= QR LOGIN (optional extra — password login still works) ============================= */
function qrUrl(token){ return location.origin+location.pathname+'?qr='+token; }
function parseQrToken(text){
  const t=(text||'').trim();
  try{ const u=new URL(t); const q=u.searchParams.get('qr'); if(q && /^[a-f0-9]{64}$/i.test(q)) return q.toLowerCase(); }catch(e){}
  if(/^[a-f0-9]{64}$/i.test(t)) return t.toLowerCase();
  return null;
}
async function qrLoginWithToken(token){
  stopAuthScanner(); S.authScan=false; S.authBusy=true; S.authError=''; S.authInfo='جارِ تسجيل الدخول بالـ QR…'; render();
  try{
    const res = await fetch(SUPABASE_URL+'/functions/v1/qr-auth', { method:'POST', headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_ANON_KEY }, body:JSON.stringify({ action:'login', token }) });
    const data = await res.json().catch(()=>({}));
    if(!res.ok || !data.token_hash) throw new Error(data.error || 'تعذّر تسجيل الدخول بالكود');
    let r = await sb.auth.verifyOtp({ token_hash:data.token_hash, type:'magiclink' });
    if(r.error) r = await sb.auth.verifyOtp({ token_hash:data.token_hash, type:'email' });
    if(r.error) throw new Error('الكود اتقرى بس تسجيل الدخول فشل، جرّب تاني');
    S.authBusy=false; S.authInfo='';
    await refreshSession(); await bootApp();
  }catch(e){
    S.authBusy=false; S.authInfo=''; S.authError=(e && e.message) || 'تعذّر تسجيل الدخول بالكود'; render();
  }
}
async function startAuthScanner(){
  const stage=document.getElementById('auth-scan-stage'); if(!stage) return;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    S.authStream=stream;
    stage.innerHTML=`<video id="auth-scan-video" autoplay playsinline muted></video><div class="scan-frame">${ICON.bracket()}</div>`;
    const video=document.getElementById('auth-scan-video'); video.srcObject=stream; await video.play();
    const canvas=document.createElement('canvas'); const ctx=canvas.getContext('2d'); let stopped=false;
    S.authStopLoop=()=>{ stopped=true; };
    const tick=()=>{
      if(stopped) return;
      if(video.readyState===video.HAVE_ENOUGH_DATA){
        canvas.width=video.videoWidth; canvas.height=video.videoHeight; ctx.drawImage(video,0,0,canvas.width,canvas.height);
        const img=ctx.getImageData(0,0,canvas.width,canvas.height); const code=jsQR(img.data,img.width,img.height);
        if(code && code.data){ const tok=parseQrToken(code.data); if(tok){ stopped=true; qrLoginWithToken(tok); return; } }
      }
      requestAnimationFrame(tick);
    };
    tick();
  }catch(e){
    stage.innerHTML='<div class="scan-msg"><span class="em">🚫</span>تعذّر الوصول للكاميرا. استخدم رفع صورة بدلاً من ذلك.</div>';
  }
}
function stopAuthScanner(){ if(S.authStopLoop) S.authStopLoop(); if(S.authStream){ S.authStream.getTracks().forEach(t=>t.stop()); S.authStream=null; } }
function decodeQrFromFile(file){
  return new Promise((resolve)=>{
    if(!file){ resolve(null); return; }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const tryScale = (maxSide)=>{
        const k = Math.min(1, maxSide/Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width*k)), h = Math.max(1, Math.round(img.height*k));
        const c = document.createElement('canvas'); c.width=w; c.height=h;
        const ctx = c.getContext('2d'); ctx.drawImage(img,0,0,w,h);
        const d = ctx.getImageData(0,0,w,h); const code = jsQR(d.data,w,h);
        return code && code.data ? code.data : null;
      };
      let out = null;
      for(const side of [1600, 1000, 640, 2400]){ try{ out = tryScale(side); }catch(e){ out=null; } if(out) break; }
      URL.revokeObjectURL(url); resolve(out);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}
async function decodeAuthQrFile(file){
  if(!file) return;
  const data = await decodeQrFromFile(file);
  const tok = data ? parseQrToken(data) : null;
  if(tok) qrLoginWithToken(tok); else toast('الصورة مفيهاش كود دخول صالح — جرّب صورة أوضح للكود',false);
}

function userName(id){ const u=(S.users||[]).find(x=>x.id===id); return u? (u.full_name||'') : ''; }

function supScopeOf(userId){ const a=supAssignOf(userId); if(a) return a.kind==='units'?'units':'general_areas'; const p=presenceOf(userId); return (p&&p.scope)||'general_areas'; }

/* --- task open/close window + countdown (Cairo time) --- */
function hhmmToMin(t){ const m=/^(\d{1,2}):(\d{2})/.exec(t||''); return m? (+m[1])*60+(+m[2]) : null; }
function taskWindowState(l){
  const o=hhmmToMin(l.open_time), c=hhmmToMin(l.close_time);
  if(o==null && c==null) return { state:'open', secs:null };
  const now=cairoMinutes()*60 + new Date().getSeconds();
  const O=(o==null?0:o)*60, C=(c==null?1440:c)*60;
  if(O<=C){ if(now<O) return {state:'before',secs:O-now}; if(now>=C) return {state:'closed',secs:0}; return {state:'open',secs:C-now}; }
  if(now>=O) return {state:'open',secs:(86400-now)+C}; if(now<C) return {state:'open',secs:C-now}; return {state:'before',secs:O-now};
}
function fmtCountdown(sec){ sec=Math.max(0,Math.floor(sec)); const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), x=sec%60; const p=n=>String(n).padStart(2,'0'); return p(h)+':'+p(m)+':'+p(x); }
function timerText(w){ if(w.state==='open') return w.secs==null ? 'مفتوحة' : '⏱ متبقي '+fmtCountdown(w.secs); if(w.state==='before') return '🔒 تفتح بعد '+fmtCountdown(w.secs); return '⛔ مغلقة'; }
function taskTimerHtml(l){
  if(!l.open_time && !l.close_time) return '';
  const w=taskWindowState(l); const cls = w.state==='open'?'done':(w.state==='before'?'pending':'postponed');
  return `<span class="badge ${cls}" data-countdown="${l.id}" data-cstate="${w.state}">${timerText(w)}</span>`;
}
function taskWindowText(l){ if(!l.open_time && !l.close_time) return ''; return `<span class="tag-shift both">تفتح ${esc(l.open_time||'—')} · تقفل ${esc(l.close_time||'—')}</span>`; }
function taskWindowFields(l){ return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;"><div class="form-row"><label>تفتح الساعة (اختياري)</label><input type="time" id="m-tl-open" value="${esc((l&&l.open_time)||'')}"></div><div class="form-row"><label>تتقفل الساعة (اختياري)</label><input type="time" id="m-tl-close" value="${esc((l&&l.close_time)||'')}"></div></div>`; }
function readTaskWindow(){ return { open_time: document.getElementById('m-tl-open').value||null, close_time: document.getElementById('m-tl-close').value||null }; }
let tickStarted=false;
function startTimerTick(){
  if(tickStarted) return; tickStarted=true;
  setInterval(()=>{
    let changed=false;
    document.querySelectorAll('[data-countdown]').forEach(el=>{
      const l=(S.taskLists||[]).find(x=>x.id===el.dataset.countdown); if(!l) return;
      const w=taskWindowState(l); const t=timerText(w);
      if(el.textContent!==t) el.textContent=t;
      if(el.dataset.cstate!==w.state) changed=true;
    });
    if(changed && !S.modal && !hasUnsavedInput()) render();
  },1000);
}
function taskWhoHtml(run){
  if(!run) return '';
  const doers=Array.from(new Set((S.taskRunItems||[]).filter(x=>x.run_id===run.id && x.done && x.done_by).map(x=>x.done_by)));
  if(run.marked_by && !doers.includes(run.marked_by)) doers.push(run.marked_by);
  const parts=[];
  if(run.assigned_to) parts.push('🎯 مُسندة لـ: '+esc(userName(run.assigned_to)||'-'));
  if(doers.length) parts.push('👷 نفّذ: '+doers.map(id=>esc(userName(id)||'-')).join('، '));

let newTablesWarned=false;
async function dbSelectQuiet(table, filters){
  let q=sb.from(table).select('*'); if(filters) Object.keys(filters).forEach(k=>{ q=q.eq(k,filters[k]); });
  const {data,error}=await q;
  if(error){ console.warn(table,error.message); if(!newTablesWarned){ newTablesWarned=true; toast('فيه جداول جديدة ناقصة في Supabase — شغّل ملف update_v4.sql',false); } return null; }
  return data||[];
}

function tabsForRole(role){

  if(role==='admin') return adminTabs;

  if(role==='fm_dispatcher') return [['orders','أوردرات الخدمة المدفوعة'],['deliveries','وحدات التسليم اليوم'],['urgent','تاسك مستعجل'],['pest','مكافحة الحشرات'],['complaints','الشكاوى'],['emergency','طوارئ']];
  if(role==='supervisor') return [['today','قائمة اليوم'],['urgent','تاسك مستعجل'],['emergency','طوارئ'],['myname','بياناتي']];
  if(role==='contractor_manager') return [['home','الرئيسية'],['attendance','الحضور']];
  if(role==='contractor_admin') return [['attendance','الحضور']];
  if(role==='hk_manager') return [['home','الرئيسية'],['distribution','التوزيع اليومي'],['zones','الزونات'],['attendance','الحضور'],['deliveries','وحدات التسليمات'],['orders','الخدمة المدفوعة'],['tasks','المهمات المجدولة'],['urgent','تاسك مستعجل'],['emergency','طوارئ'],['myname','بياناتي']];
  if(role==='hk_admin') return [['distribution','توزيع المسئولين'],['attendance','الحضور'],['deliveries','وحدات التسليمات'],['orders','الخدمة المدفوعة'],['urgent','تاسك مستعجل'],['emergency','طوارئ'],['myname','بياناتي']];

  return [];

function bindGlobalEvents(){

  document.querySelectorAll('[data-view-photo]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const [k,id]=b.dataset.viewPhoto.split('|'); let src=null;
    if(k==='ord'){ const o=S.orders.find(x=>x.id===id); src=o&&o.payment_photo; }
    else if(k==='pest'){ const p=S.pest.find(x=>x.id===id); src=p&&p.payment_photo; }
    else if(k==='inv'){ const i=S.supplierInvoices.find(x=>x.id===id); src=i&&i.photo; }
    if(!src) return;
    S.modal={ type:'viewPhoto', src, title: k==='inv'?'صورة الفاتورة':'إثبات الدفع', back:(S.modal&&S.modal.type!=='viewPhoto')?S.modal:null };
    render();
  });
  const rb=document.getElementById('refresh-btn'); if(rb) rb.onclick=manualRefresh;
  const bb=document.getElementById('bell-btn'); if(bb) bb.onclick=(e)=>{
    e.stopPropagation();
    S.bellOpen = !S.bellOpen;
    const wasOpen=S.bellOpen;
    render();
    if(wasOpen===false && S.bellOpen) markNotificationsRead();
  };
  document.querySelectorAll('[data-ntf-goto]').forEach(el=>el.onclick=()=>{
    S.tab = notifTarget(el.dataset.ntfGoto) || S.tab; S.bellOpen=false; render();
  });
  if(S.bellOpen){
    document.addEventListener('click', function closeBell(e){
      if(!e.target.closest('#bell-dropdown') && !e.target.closest('#bell-btn')){
        S.bellOpen=false; render(); document.removeEventListener('click', closeBell);
      }
    });
  }
}

function genericMatch(obj, q){
  return Object.keys(obj||{}).some(k=>{
    const v = obj[k];
    return typeof v==='string' && v.toLowerCase().includes(q);
  });
}
function runSystemSearch(q){
  q = (q||'').trim().toLowerCase();
  if(q.length < 2) return [];
  const groups = [
    { tab:'deliveries', label:'تسليم وحدة', data:S.deliveries, title:d=>esc(d.unit_code||'-') },
    { tab:'orders', label:'خدمة مدفوعة', data:S.orders, title:o=>`${esc(o.unit_code||'-')} — ${ORDER_TYPE_LABEL[o.order_type]||o.order_type}` },
    { tab:'pest', label:'مكافحة حشرات', data:S.pest, title:p=>`${esc(p.unit_code||'-')} — ${PEST_TYPE_LABEL[p.service_type]||p.service_type}` },
    { tab:'facade', label:'نظافة واجهات', data:S.facade, title:f=>esc(f.description||f.unit_code||'-') },
    { tab:'waste', label:'رفع مخلفات', data:S.waste, title:w=>esc(w.description||w.unit_code||'-') },
    { tab:'complaints', label:'شكوى', data:S.complaints, title:c=>`${esc(c.unit_code||'-')} — ${esc((c.description||'').slice(0,50))}` },
    { tab:'suppliers', label:'مورد', data:S.suppliers, title:s=>esc(s.name||'-') },
    { tab:'users', label:'مستخدم', data:S.users, title:u=>esc(u.full_name||'-') },
    { tab:'tasks', label:'قائمة مهام', data:S.taskLists, title:l=>esc(l.name||'-') },
  ];
  const results=[];
  groups.forEach(g=>{
    (g.data||[]).forEach(item=>{
      if(genericMatch(item, q)) results.push({ label:g.label, tab:g.tab, title:g.title(item) });
    });
  });
  return results.slice(0,60);
}
function renderSystemSearchResults(q){
  const box = document.getElementById('sys-search-results');
  if(!box) return;
  const results = runSystemSearch(q);
  if(!q || q.trim().length<2){ box.innerHTML=''; return; }
  if(!results.length){ box.innerHTML = '<span style="opacity:.8;">مفيش نتائج مطابقة</span>'; return; }
  box.innerHTML = results.map(r=>`<div data-search-goto="${r.tab}" style="cursor:pointer;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.15);"><span style="opacity:.7;font-size:11px;">${r.label}</span> — ${r.title}</div>`).join('');
  box.querySelectorAll('[data-search-goto]').forEach(el=>el.onclick=()=>{ S.tab=el.dataset.searchGoto; render(); });
}

function renderOrgChart(){
  const el=document.getElementById('orgChart'); if(!el) return;

  const vline='<div style="width:2px;height:14px;background:var(--line);"></div>';

  const shiftBlock=sh=>{
    const rows=(S.presence||[]).filter(p=>p.present===true && (p.shift||'morning')===sh);

    const seniors=rows.filter(p=>roleOf(p.user_id)==='hk_senior_supervisor');

    const asg=id=>(S.supAssign||[]).find(a=>a.shift===sh && a.supervisor_id===id);
    const used=new Set();
    const col=(head,members)=>`<div style="display:flex;flex-direction:column;align-items:center;margin:4px 8px;">${head}${members.length? vline+members.join('') : ''}</div>`;
    const cols=seniors.map(p=>{
      const z=seniorZoneOf(p.user_id,sh);
      const mem=sups.filter(v=>{ const a=asg(v.user_id); return a && a.kind==='zone' && z && a.zone_id===z.id; });
      mem.forEach(v=>used.add(v.user_id));
      return col(`<div style="${box('var(--paper)','var(--ink)','var(--mint)')}">👤 مشرف أول<span style="font-weight:500;font-size:11px;">${esc(shownName(p.user_id))}</span><span style="font-weight:800;font-size:11px;color:var(--mint);">${z?esc(z.name):'بدون زون'}</span></div>`, mem.map(v=>supBox(v.user_id,sh,'مشرف أماكن '+(z?z.name:''))));
    });
    const units=sups.filter(v=>{ const a=asg(v.user_id); return a && a.kind==='units'; }); units.forEach(v=>used.add(v.user_id));
    if(units.length) cols.push(col(`<div style="${box('var(--blue-light)','var(--blue)','var(--blue)')}">🔑 مشرفو وحدات</div>`, units.map(v=>supBox(v.user_id,sh,''))));
    const rest=sups.filter(v=>!used.has(v.user_id));
    if(rest.length) cols.push(col(`<div style="${box('var(--amber-light)','var(--amber)','var(--amber)')}">⏳ لسه ما اتوزعوش</div>`, rest.map(v=>{ const a=asg(v.user_id); const z=a&&a.kind==='zone'?zoneById(a.zone_id):null; return supBox(v.user_id,sh, z? z.name+' (بدون مشرف أول)':''); })));
    return `<div style="border:1px solid var(--line);border-radius:14px;padding:10px 6px;margin-top:10px;background:var(--paper);"><div style="text-align:center;margin-bottom:6px;"><span class="tag-shift ${sh}">الوردية ${PRES_WINDOWS[sh].name}</span></div><div style="display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;">${cols.join('')||'<span style="font-size:12px;color:var(--text-dim);">لا يوجد</span>'}</div></div>`;
  };
  const blocks=shiftBlock('morning')+shiftBlock('evening');
  if(!blocks){ el.innerHTML=`<div class="empty-state" style="padding:20px;"><span class="em">🗂️</span>لسه مفيش توزيع اتعمل النهاردة (لا حضور اتسجّل)</div>`; return; }
  const mgr=managers.length? managers.map(u=>`<div style="${box('var(--ink)','#fff','var(--ink)')}">🏢 مدير الموقع<span style="font-weight:500;font-size:11px;">${esc(u.full_name)}</span></div>`).join('') : `<div style="${box('var(--ink)','#fff','var(--ink)')}">🏢 مدير الموقع</div>`;
  el.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;min-width:280px;"><div style="display:flex;flex-wrap:wrap;justify-content:center;">${mgr}</div>${vline}<div style="width:100%;">${blocks}</div><div style="font-size:10.5px;color:var(--text-dim);margin-top:8px;">آخر تحديث ${new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}</div></div>`;
}

  { from:101, to:150, full_service:1500, flying_spray:750,  crawling_spray:750,  rodent_control:750,  specialized_spray:null },
  { from:151, to:180, full_service:1800, flying_spray:900,  crawling_spray:900,  rodent_control:900,  specialized_spray:null },
  { from:181, to:200, full_service:2000, flying_spray:1000, crawling_spray:1000, rodent_control:1000, specialized_spray:null },
  { from:201, to:230, full_service:2300, flying_spray:1150, crawling_spray:1150, rodent_control:1150, specialized_spray:null },
  { from:231, to:250, full_service:2500, flying_spray:1250, crawling_spray:1250, rodent_control:1250, specialized_spray:null },
  { from:251, to:269, full_service:2690, flying_spray:1345, crawling_spray:1345, rodent_control:1345, specialized_spray:null },
];
const PER_METER_RATE_FALLBACK = { soft_cleaning:6, deep_cleaning:8 }; // EGP/m² — used only when a unit's BUA falls outside all fixed price bands (e.g. very small studios or large villas)
function getUnitInfo(unit_code){ const q=(unit_code||'').trim().toLowerCase(); if(!q) return null; return S.units.find(x=>(x.unit_code||'').trim().toLowerCase()===q) || null; }
const unitLiveCache = {};
async function fetchUnitLive(unit_code){
  const key=(unit_code||'').trim().toLowerCase();
  if(!key) return null;
  if(key in unitLiveCache) return unitLiveCache[key];
  // Always check the database directly instead of only trusting the
  // locally-cached S.units list, which can go stale if units were added
  // in Supabase after this browser tab/session was loaded.
  const {data,error} = await sb.from('units_master').select('*').ilike('unit_code', key).limit(1);
  const unit = (!error && data && data[0]) ? data[0] : null;
  unitLiveCache[key] = unit;
  if(unit && !S.units.find(u=>u.unit_code===unit.unit_code)) S.units.push(unit);
  return unit;
}
function findBand(bands, bua){ return bands.find(b=> bua>=b.from && bua<=b.to) || null; }
async function calcOrderPrice(order_type, unit_code){
  if(order_type==='facade_cleaning') return FACADE_FLAT_PRICE;
  const u = await fetchUnitLive(unit_code); if(!u) return null;
  const band = findBand(PRICE_BANDS, +u.bua);
  if(band) return band[order_type];
  if(PER_METER_RATE_FALLBACK[order_type]) return Math.round(+u.bua * PER_METER_RATE_FALLBACK[order_type]);
  return null;
}
function findNearestBand(bands, bua){
  let nearest = bands[0], minDist = Infinity;
  bands.forEach(b=>{
    const dist = bua < b.from ? b.from - bua : (bua > b.to ? bua - b.to : 0);
    if(dist < minDist){ minDist = dist; nearest = b; }
  });
  return nearest;
}
async function calcPestPrice(service_type, unit_code){
  if(service_type==='specialized_spray') return null; // After Inspection — priced manually
  const u = await fetchUnitLive(unit_code); if(!u) return null;
  const band = findBand(PEST_PRICE_BANDS, +u.bua) || findNearestBand(PEST_PRICE_BANDS, +u.bua);
  return band ? band[service_type] : null;
}
function priceDisplayHtml(price, isSpecialized){
  if(isSpecialized) return `<span style="color:var(--text-dim);font-weight:700;">يُسعّر بعد المعاينة</span>`;
  if(price==null) return `<span style="color:var(--text-dim);">اكتب كود وحدة موجود في units_master عشان يتحسب السعر</span>`;
  return `<span style="color:var(--mint);font-weight:700;">السعر: ${price.toLocaleString('en-US')} ج.م</span>`;
}
const MAX_ORDERS_PER_DAY = 2;
function ordersCountForDate(date){ return S.orders.filter(o=>o.scheduled_date===date && o.status!=='postponed' && orderApproved(o) && !o.extra_reason).length; }
function findNextAvailableOrderDate(fromDate){
  let d = new Date(fromDate+'T00:00:00');
  for(let i=0;i<60;i++){
    d.setDate(d.getDate()+1);
    const ds = dateStr(d);
    if(ordersCountForDate(ds) < MAX_ORDERS_PER_DAY) return ds;
  }
  return null;
}
function updateOrderAvailabilityMsg(date){
  const box = document.getElementById('ord-availability-msg'); if(!box) return;
  const count = ordersCountForDate(date);
  if(count >= MAX_ORDERS_PER_DAY){
    const next = findNextAvailableOrderDate(date);
    box.innerHTML = `<span style="color:var(--coral);font-weight:700;">❌ اليوم ده مكتمل (${count}/${MAX_ORDERS_PER_DAY})</span>` + (next? ` — <button type="button" class="ghost-btn" id="use-next-date-btn" data-next-date="${next}" style="padding:3px 8px;font-size:11px;">أقرب موعد متاح: ${next}</button>` : '');
    const btn = box.querySelector('#use-next-date-btn');
    if(btn) btn.onclick=()=>{ document.getElementById('m-ord-date').value = btn.dataset.nextDate; updateOrderAvailabilityMsg(btn.dataset.nextDate); };
  } else {
    box.innerHTML = `<span style="color:var(--mint);font-weight:700;">✓ متاح (${count}/${MAX_ORDERS_PER_DAY})</span>`;
  }
}

/* ============================= SCHEDULED TASKS (المهمات المجدولة) ============================= */
function taskItemsOf(listId){
  return (S.taskItems||[]).filter(i=>i.list_id===listId && i.active!==false).sort((a,b)=>(a.position||0)-(b.position||0) || String(a.id).localeCompare(String(b.id)));
}
function taskRunOf(listId, date){ return (S.taskRuns||[]).find(r=>r.list_id===listId && r.date===(date||S.today)) || null; }
function taskItemDone(run, itemId){ const x=(S.taskRunItems||[]).find(z=>z.run_id===run.id && z.item_id===itemId); return !!(x && x.done); }
function taskProgress(list){
  const run=taskRunOf(list.id); const items=taskItemsOf(list.id);
  const done = run? items.filter(it=>taskItemDone(run,it.id)).length : 0;
  return { run, total:items.length, done };
}
const FREQ_LABEL = { daily:'يومي', weekly:'أسبوعي', monthly:'شهري' };
const WEEKDAY_OPTIONS = [[6,'السبت'],[0,'الأحد'],[1,'الاثنين'],[2,'الثلاثاء'],[3,'الأربعاء'],[4,'الخميس'],[5,'الجمعة']];
function taskFreqText(l){
  const f=l.frequency||'daily';
  if(f==='weekly'){ const rd=(l.repeat_day==null?6:+l.repeat_day); const d=WEEKDAY_OPTIONS.find(x=>x[0]===rd); return 'أسبوعي · '+(d?d[1]:''); }
  if(f==='monthly') return 'شهري · يوم '+(l.repeat_day||1);
  return 'يومي';
}
function taskDueOn(l, date){
  const f=l.frequency||'daily'; if(f==='daily') return true;
  const d=new Date(date+'T00:00:00');
  if(f==='weekly') return d.getDay()===(l.repeat_day==null?6:+l.repeat_day);
  if(f==='monthly'){ const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); return d.getDate()===Math.min(+l.repeat_day||1, dim); }
  return true;
}
function taskDueToday(l){ return taskDueOn(l, S.today); }
function taskFreqFields(l){
  const f=(l&&l.frequency)||'daily'; const rd=(l&&l.repeat_day!=null)? +l.repeat_day : null;
  return `<div class="form-row"><label>تكرار المهمة</label><select id="m-tl-freq">
      <option value="daily" ${f==='daily'?'selected':''}>يومي</option>
      <option value="weekly" ${f==='weekly'?'selected':''}>أسبوعي</option>
      <option value="monthly" ${f==='monthly'?'selected':''}>شهري</option></select></div>
    <div class="form-row" id="m-tl-weekday-row" style="${f==='weekly'?'':'display:none;'}"><label>يوم الأسبوع</label><select id="m-tl-weekday">${WEEKDAY_OPTIONS.map(([v,n])=>`<option value="${v}" ${(rd==null?6:rd)===v?'selected':''}>${n}</option>`).join('')}</select></div>
    <div class="form-row" id="m-tl-monthday-row" style="${f==='monthly'?'':'display:none;'}"><label>يوم الشهر (1–31)</label><input type="number" min="1" max="31" id="m-tl-monthday" value="${(f==='monthly'&&rd)?rd:1}"></div>`;
}
function readTaskFreq(){
  const f=document.getElementById('m-tl-freq').value;
  if(f==='weekly') return { frequency:'weekly', repeat_day:+document.getElementById('m-tl-weekday').value };
  if(f==='monthly'){ let d=parseInt(document.getElementById('m-tl-monthday').value,10); if(!(d>=1&&d<=31)) d=1; return { frequency:'monthly', repeat_day:d }; }
  return { frequency:'daily', repeat_day:null };
}
function sortedTaskLists(){ return (S.taskLists||[]).slice().sort((a,b)=>String(a.created_at||'').localeCompare(String(b.created_at||''))); }
function tasksForShift(shift){ return sortedTaskLists().filter(l=>l.active!==false && taskDueToday(l) && (!l.shift || l.shift==='both' || l.shift===shift)); }
function taskRunBadge(run){
  if(!run) return '<span class="badge pending"><span class="dot"></span>قيد التجهيز</span>';
  if(run.status==='completed') return '<span class="badge done"><span class="dot"></span>تم اعتمادها</span>';
  if(run.supervisor_marked_done) return '<span class="badge progress"><span class="dot"></span>بانتظار اعتماد المشرف الأول</span>';
  return '<span class="badge pending"><span class="dot"></span>قيد التنفيذ</span>';
}
async function loadTaskData(){
  const d=new Date(); d.setDate(d.getDate()-45); const from=dateStr(d);
  const [lists, items, runsRes] = await Promise.all([
    dbSelect('task_lists'), dbSelect('task_items'),
    sb.from('task_runs').select('*').gte('date', from)
  ]);
  if(lists) S.taskLists=lists;
  if(items) S.taskItems=items;
  if(runsRes.error){ console.error('task_runs', runsRes.error); toast('تعذّر تحميل المهمات المجدولة — '+runsRes.error.message,false); }
  else S.taskRuns = runsRes.data||[];
  await loadTaskRunItems();
}
async function loadTaskRunItems(){
  const ids=(S.taskRuns||[]).filter(r=>r.date===S.today).map(r=>r.id);
  if(!ids.length){ S.taskRunItems=[]; return; }
  const {data,error}=await sb.from('task_run_items').select('*').in('run_id',ids);
  if(error){ console.error('task_run_items',error); return; }
  S.taskRunItems=data||[];
}
async function ensureTodayTaskRuns(){
  const date=S.today;
  const existing=(S.taskRuns||[]).filter(r=>r.date===date);
  const missing=(S.taskLists||[]).filter(l=>l.active!==false && taskDueToday(l) && !existing.find(r=>r.list_id===l.id))
    .map(l=>({ id:uid('trun'), date, list_id:l.id, status:'incomplete', supervisor_marked_done:false }));
  if(!missing.length) return;
  const {error}=await sb.from('task_runs').upsert(missing,{onConflict:'list_id,date',ignoreDuplicates:true});
  if(error){ console.error('task_runs upsert',error); return; }
  await loadTaskData();
}
async function refreshTasks(){ await loadTaskData(); await ensureTodayTaskRuns(); render(); }

async function addTaskItems(listId, names){
  const items=taskItemsOf(listId); let pos=items.reduce((m,i)=>Math.max(m,i.position||0),0);
  const rows=names.map(n=>({ id:uid('ti'), list_id:listId, name:n, position:++pos, active:true }));
  if(await dbInsert('task_items',rows)){ S.openTaskAdmin.add(listId); await refreshTasks(); toast('تمت إضافة '+rows.length+' بند',true); }
}
async function moveTaskItem(id, dir){
  const it=(S.taskItems||[]).find(x=>x.id===id); if(!it) return;
  const items=taskItemsOf(it.list_id); const i=items.findIndex(x=>x.id===id); const j=i+dir;
  if(j<0||j>=items.length) return;
  const order=items.map(x=>x.id); const tmp=order[i]; order[i]=order[j]; order[j]=tmp;
  for(let k=0;k<order.length;k++){ const cur=items.find(x=>x.id===order[k]); if(cur.position!==k+1) await dbUpdate('task_items',cur.id,{position:k+1}); }
  S.openTaskAdmin.add(it.list_id); await refreshTasks();
}
function bindTasksAdmin(){
  const add=document.getElementById('tl-add'); if(add) add.onclick=()=>{ S.modal={type:'addTaskList'}; render(); };
  document.querySelectorAll('details[data-tl-open]').forEach(d=>d.addEventListener('toggle',()=>{ if(d.open) S.openTaskAdmin.add(d.dataset.tlOpen); else S.openTaskAdmin.delete(d.dataset.tlOpen); }));
  document.querySelectorAll('[data-tl-qr]').forEach(b=>b.onclick=()=>{ const l=S.taskLists.find(x=>x.id===b.dataset.tlQr); S.qrTarget={code:'ZEDWEST|TL|'+l.id, label:l.name}; S.modal={type:'qr'}; render(); });
  document.querySelectorAll('[data-tl-edit]').forEach(b=>b.onclick=()=>{ S.modal={type:'editTaskList', id:b.dataset.tlEdit}; render(); });
  document.querySelectorAll('[data-tl-toggle]').forEach(b=>b.onclick=async ()=>{ const l=S.taskLists.find(x=>x.id===b.dataset.tlToggle); await dbUpdate('task_lists', l.id, {active: l.active===false}); await refreshTasks(); });
  document.querySelectorAll('[data-tl-del]').forEach(b=>b.onclick=()=>{ S.modal={type:'confirmDeleteTaskList', id:b.dataset.tlDel}; render(); });
  document.querySelectorAll('[data-ti-add]').forEach(b=>b.onclick=async ()=>{
    const lid=b.dataset.tiAdd; const inp=document.querySelector(`[data-ti-new="${lid}"]`); const name=(inp.value||'').trim();
    if(!name){ toast('اكتب اسم البند',false); return; }

  });
  document.querySelectorAll('[data-ti-bulk-add]').forEach(b=>b.onclick=async ()=>{
    const lid=b.dataset.tiBulkAdd; const ta=document.querySelector(`[data-ti-bulk="${lid}"]`);

    if(!names.length){ toast('اكتب بند واحد على الأقل',false); return; }

  });
  document.querySelectorAll('[data-ti-save]').forEach(b=>b.onclick=async ()=>{
    const id=b.dataset.tiSave; const name=(document.querySelector(`[data-ti-name="${id}"]`).value||'').trim();
    if(!name){ toast('اسم البند مينفعش يبقى فاضي',false); return; }
    if(await dbUpdate('task_items',id,{name})){ const it=S.taskItems.find(x=>x.id===id); if(it){ S.openTaskAdmin.add(it.list_id); } await refreshTasks(); toast('تم حفظ البند',true); }
  });
  document.querySelectorAll('[data-ti-del]').forEach(b=>b.onclick=async ()=>{
    if(!confirm('حذف البند ده؟')) return;
    const it=S.taskItems.find(x=>x.id===b.dataset.tiDel); if(it) S.openTaskAdmin.add(it.list_id);
    if(await dbDelete('task_items',b.dataset.tiDel)){ await refreshTasks(); toast('تم حذف البند',true); }
  });
  document.querySelectorAll('[data-ti-up]').forEach(b=>b.onclick=()=>moveTaskItem(b.dataset.tiUp,-1));
  document.querySelectorAll('[data-ti-down]').forEach(b=>b.onclick=()=>moveTaskItem(b.dataset.tiDown,1));
}
function renderSupTaskLists(shift){
  const me=S.session.user.id;
  const lists=tasksForSupervisor(me, shift);
  const cards=lists.map(l=>{
    const run=taskRunOf(l.id); if(!run) return '';
    const items=taskItemsOf(l.id); const {done,total}=taskProgress(l);
    const locked = run.status==='completed';
    const w=taskWindowState(l); const winOpen = w.state==='open';
    const z=zoneOfList(l.id);
    const rejected = run.review_status==='rejected' && !run.supervisor_marked_done && !locked;
    const frozen = locked || !winOpen;
    return `<details class="card" data-tsup-open="${l.id}" ${S.openTaskSup.has(l.id)?'open':''} style="margin-bottom:10px;${rejected?'border-color:var(--coral);':''}">
      <summary style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;"><span><b>${esc(l.name)}</b>${z?` <span class="tag-shift both">${esc(z.name)}</span>`:''}</span><span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">${taskTimerHtml(l)}<span style="font-size:12px;color:var(--text-dim);">${done}/${total}</span>${taskRunBadge(run)}</span></summary>
      <div style="margin-top:10px;">
        ${rejected?`<div style="background:var(--coral-light);color:var(--coral);border-radius:9px;padding:9px 12px;font-size:12.5px;margin-bottom:8px;line-height:1.7;">⚠️ المشرف الأول رجّعها لإعادة الفحص${run.review_note?': '+esc(run.review_note):''}</div>`:''}
        ${(!winOpen && !locked)?`<div style="background:var(--amber-light);color:var(--amber);border-radius:9px;padding:8px 12px;font-size:12.5px;margin-bottom:8px;">${w.state==='before'?'القائمة لسه ما فتحتش — هتفتح الساعة '+esc(l.open_time||''):'القائمة اتقفلت'}</div>`:''}
        ${items.length? items.map(it=>{ const ok=taskItemDone(run,it.id); return `<label style="display:flex;gap:10px;align-items:center;padding:10px 6px;border-bottom:1px dashed var(--line);${ok?'background:var(--mint-light);':''}"><input type="checkbox" data-ti-check="${run.id}|${it.id}" ${ok?'checked':''} ${frozen?'disabled':''} style="width:20px;height:20px;flex-shrink:0;"><span style="flex:1;font-size:13.5px;${ok?'color:var(--text-dim);text-decoration:line-through;':''}">${esc(it.name)}</span></label>`; }).join('') : '<p style="color:var(--text-dim);font-size:13px;">القائمة لسه فاضية.</p>'}
        ${taskWhoHtml(run)}
        ${locked? `<div style="font-size:12px;color:var(--mint);text-align:center;padding:10px 0 0;">${ICON.check(13)} تم اعتمادها من المشرف الأول</div>`
          : `<button class="${run.supervisor_marked_done?'ghost-btn':'primary-btn'}" style="width:100%;justify-content:center;margin-top:10px;" data-tl-mark="${run.id}" data-marked="${run.supervisor_marked_done?'1':'0'}" ${!winOpen?'disabled':''}>${run.supervisor_marked_done? ICON.check(13)+' تم الانتهاء ✓ (بانتظار اعتماد المشرف الأول) — دوس للتراجع' : 'تم الانتهاء من القائمة'}</button>`}
      </div>
    </details>`;
  }).join('');
  return cards || `<p style="color:var(--text-dim);font-size:13px;">مفيش مهمات مجدولة نازلة عليك للوردية دي النهاردة.</p>`;
}

        <div style="font-size:12.5px;margin:4px 0;">${diffs.length? diffs.map(esc).join(' · ') : 'بدون فروق في الأرقام'}</div>

    <p style="font-size:12px;color:var(--text-dim);margin:-4px 0 10px;line-height:1.7;">الحضور بيتسجّل مرة واحدة بس لكل وردية في اليوم. أي تعديل بعد كده بيتطلب موافقة الإدارة أو OPM.</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;">

      <div class="form-row"><label>مشرف أول</label><input type="number" min="0" id="at-ss" value="0"></div>

    <div class="form-row"><label>ملاحظات (اختياري)</label><textarea id="at-notes"></textarea></div>
    <button class="primary-btn" id="at-save">حفظ</button>
  </div>`:'<div class="card" style="margin-bottom:14px;font-size:12.5px;color:var(--text-dim);">عرض فقط — تسجيل وتعديل الحضور مش متاح لمدير الموقع.</div>'}

  ${list.length? list.map(a=>{

function bindAttendance(){
  document.getElementById('at-filter-date').onchange=e=>{ S.attendanceDate=e.target.value; render(); };
  const _atSave=document.getElementById('at-save'); if(_atSave) _atSave.onclick=async ()=>{
    const btn=document.getElementById('at-save'); btn.disabled=true;
    const row = {
      id: uid('att'), date: document.getElementById('at-date').value, phase: document.getElementById('at-phase').value||'المرحلة الأولى', shift: document.getElementById('at-shift').value,
      site_manager_count: +document.getElementById('at-sm').value||0, site_admin_count: +document.getElementById('at-sa').value||0,

      worker_count: +document.getElementById('at-w').value||0, notes: document.getElementById('at-notes').value.trim(),
      entered_by: S.session.user.id, status: 'approved'
    };
    // مرة واحدة بس لكل (تاريخ + مرحلة + وردية): نتأكد من الداتابيز مباشرة مش من النسخة المحلية
    const {data:dup,error:dupErr} = await sb.from('attendance_records').select('id').eq('date',row.date).eq('shift',row.shift).ilike('phase',row.phase).limit(1);

  };

  });

const PHASE_OPTIONS = ['Phase 1','Phase 2','عام'];
function supplierStats(supId){
  const invoices = S.supplierInvoices.filter(i=>i.supplier_id===supId);
  const totalInvoiced = invoices.reduce((s,i)=>s+Number(i.amount||0),0);
  const paidInvoices = invoices.filter(i=>i.status==='paid');
  const totalPaid = paidInvoices.reduce((s,i)=>s+(Number(i.amount||0)-Number(i.discount||0)),0);
  const totalSaved = paidInvoices.reduce((s,i)=>s+Number(i.discount||0),0);
  return { totalInvoiced, totalPaid, totalSaved, count:invoices.length };
}
function supplierMonthlyTotals(supId){
  const invoices = S.supplierInvoices.filter(i=>i.supplier_id===supId);
  const byMonth = {};
  invoices.forEach(i=>{
    const month = (i.invoice_date||'').slice(0,7);
    if(!month) return;
    if(!byMonth[month]) byMonth[month] = { invoiced:0, paid:0, discount:0, phases:new Set() };
    byMonth[month].invoiced += Number(i.amount||0);
    byMonth[month].discount += Number(i.discount||0);
    if(i.status==='paid') byMonth[month].paid += Number(i.amount||0)-Number(i.discount||0);
    byMonth[month].phases.add(i.phase||'عام');
  });
  return Object.keys(byMonth).sort((a,b)=>b.localeCompare(a)).map(month=>({ month, ...byMonth[month], phases:Array.from(byMonth[month].phases) }));
}

function kpiScore(k){
  if(k.overall_score!=null && k.overall_score!=='') return k.overall_score;
  try{
    const items = typeof k.items==='string'? JSON.parse(k.items) : (k.items||[]);
    if(items && items.length) return items.reduce((s,i)=>s+(+i.actual||0),0);
  }catch(e){}
  return k.score!=null? k.score : 0;
}

function hasUnsavedInput(){
  return Array.from(document.querySelectorAll('#app input, #app textarea, #app select')).some(el=>{
    if(el.type==='checkbox'||el.type==='radio') return el.checked!==el.defaultChecked;
    if(el.tagName==='SELECT') return Array.from(el.options).some(o=>o.selected!==o.defaultSelected);
    if(el.type==='file') return false;
    return el.value!==el.defaultValue;
  });
}

function cairoMinutes(){
  try{
    const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Cairo',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
    return (+parts.find(p=>p.type==='hour').value%24)*60 + (+parts.find(p=>p.type==='minute').value);
  }catch(e){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
}
// الصباحية: مفتوحة من أول اليوم وتتقفل 12 الظهر ومتفتحش تاني — المسائية: تفتح 3 العصر وتتقفل 5 (بتوقيت القاهرة)
const PRES_WINDOWS = {
  morning:{ from:0,   to:720,  name:'الصباحية', openTxt:'', closeTxt:'12:00 ظهرًا' },
  evening:{ from:900, to:1020, name:'المسائية', openTxt:'3:00 عصرًا', closeTxt:'5:00 عصرًا' },
};
function presWindowState(sh){ const w=PRES_WINDOWS[sh], t=cairoMinutes(); return t<w.from ? 'before' : (t>=w.to ? 'closed' : 'open'); }
function presCanEdit(sh){ const r=S.profile.role; return r==='admin'||r==='opm'||presWindowState(sh)==='open'; }
function presWindowBadge(sh){
  const w=PRES_WINDOWS[sh], st=presWindowState(sh);
  if(st==='open') return `<span class="badge done"><span class="dot"></span>مفتوح — بيتقفل ${w.closeTxt}${sh==='morning'?' ومش بيفتح تاني':''}</span>`;
  if(st==='before') return `<span class="badge pending"><span class="dot"></span>هيفتح الساعة ${w.openTxt}</span>`;
  return `<span class="badge postponed"><span class="dot"></span>مقفول (اتقفل ${w.closeTxt})</span>`;
}

  const isDone=run.status==='completed', marked=!!run.supervisor_marked_done;
  const z=zoneOfList(l.id);
  const itemsHtml=items.map(it=>{
    const x=(S.taskRunItems||[]).find(r2=>r2.run_id===run.id && r2.item_id===it.id); const ok=!!(x&&x.done);

  }).join('');
  return `<div class="card" style="margin:0;${marked&&!isDone?'border-color:var(--mint);':''}">
    <div style="display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;"><b style="font-size:13px;">${esc(l.name)}</b><span><span class="tag-shift ${l.shift||'both'}">${SHIFT_LABEL[l.shift||'both']}</span>${z?` <span class="tag-shift both">${esc(z.name)}</span>`:''}</span></div>

    ${taskWhoHtml(run)}
    <details data-trev-open="${l.id}" ${S.openTaskRev.has(l.id)?'open':''} style="margin:8px 0;"><summary style="cursor:pointer;font-size:12.5px;color:var(--mint);font-weight:700;">مراجعة البنود اللي اتنفذت (${p.done}/${p.total})</summary><div style="margin-top:6px;">${itemsHtml||'<span style="font-size:12px;color:var(--text-dim);">لا توجد بنود</span>'}</div></details>
    ${isDone? `<button class="primary-btn" style="width:100%;justify-content:center;" disabled>${ICON.check(14)} معتمدة</button>`
      : marked? `<button class="primary-btn" style="width:100%;justify-content:center;" data-scan-task="${run.id}">${ICON.qr(14)} امسح كود القائمة للاعتماد</button>`
      : `<button class="ghost-btn" style="width:100%;justify-content:center;" disabled>بانتظار المشرف يأكد الانتهاء</button>`}
  </div>`;
}

const URGENT_KINDS=['التشييك على الدور','التشييك على الريفيوز روم','تشييك آخر'];
const URGENT_STATUS={ pending:'جديدة', in_progress:'جاري التنفيذ', done:'تم التنفيذ' };
function urgentRoles(){ return ['admin','opm','fm_dispatcher','hk_manager','hk_admin','hk_senior_supervisor','supervisor']; }
function urgentTargetShiftNow(){ return cairoMinutes()<900 ? 'morning' : 'evening'; }
function urgentVisible(){
  const role=S.profile&&S.profile.role; const all=S.urgent||[];
  if(['admin','opm','fm_dispatcher','hk_manager','hk_admin'].includes(role)) return all;
  if(role==='supervisor'||role==='hk_senior_supervisor'){ const sh=myShiftOf(S.session.user.id); return sh? all.filter(t=>t.target_shift===sh) : []; }
  return [];
}
function urgentSignature(){ return urgentVisible().map(t=>t.id+':'+t.status).join('|'); }
function urgentBadge(st){ const m={pending:'pending',in_progress:'progress',done:'done'}; return `<span class="badge ${m[st]||'pending'}"><span class="dot"></span>${URGENT_STATUS[st]||st}</span>`; }
async function loadUrgent(){
  const {data,error}=await sb.from('urgent_tasks').select('*').eq('date',S.today).order('created_at',{ascending:false});
  if(error){ console.warn('urgent_tasks',error.message); return false; }
  S.urgent=data||[]; return true;
}
function notifyDevice(title, body, tag){
  try{
    if(!('Notification' in window) || Notification.permission!=='granted') return;
    const opts={ body, tag, dir:'rtl', lang:'ar', vibrate:[200,100,200] };
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistration){
      navigator.serviceWorker.getRegistration().then(reg=>{ if(reg && reg.showNotification) reg.showNotification(title,opts); else new Notification(title,opts); });
    } else new Notification(title,opts);
  }catch(e){}
}

  return `

  ${canCreate? `<div class="card" style="margin-bottom:16px;border-color:var(--coral);">

    <div class="form-row"><label>نوع التاسك</label><select id="urg-kind">${URGENT_KINDS.map(k=>`<option value="${k}">${k}</option>`).join('')}</select></div>

  ${list.length? list.map(t=>`<div class="card" style="margin-bottom:10px;${t.status!=='done'?'border-color:var(--coral);':''}">

      <div><b style="font-size:14px;">${esc(t.title||t.kind)}</b> <span class="tag-shift both">${esc(t.kind||'')}</span> <span class="tag-shift ${t.target_shift||'both'}">${SHIFT_LABEL[t.target_shift]||''}</span>
        ${t.details?`<div style="font-size:13px;margin-top:4px;white-space:pre-wrap;">${esc(t.details)}</div>`:''}
        <div style="font-size:11.5px;color:var(--text-dim);margin-top:4px;">من: ${esc(t.creator_name||'-')} — ${t.created_at?esc(fmtTime(t.created_at)):''}${t.status_by_name?` · آخر تحديث: ${esc(t.status_by_name)} ${t.status_at?esc(fmtTime(t.status_at)):''}`:''}</div></div>
      <div style="display:flex;gap:6px;align-items:center;">${canEdit? `<select data-urg-status="${t.id}"><option value="pending" ${t.status==='pending'?'selected':''}>جديدة</option><option value="in_progress" ${t.status==='in_progress'?'selected':''}>جاري التنفيذ</option><option value="done" ${t.status==='done'?'selected':''}>تم التنفيذ</option></select>` : urgentBadge(t.status)}${canCreate?` <button class="ghost-btn danger" data-urg-del="${t.id}">${ICON.trash(12)}</button>`:''}</div>

function bindUrgent(){
  const nb=document.getElementById('urg-notif');
  if(nb) nb.onclick=async ()=>{ try{ const r=await Notification.requestPermission(); toast(r==='granted'?'تم تفعيل الإشعارات':'الإشعارات مش مفعّلة',r==='granted'); }catch(e){} render(); };
  const send=document.getElementById('urg-send');
  if(send) send.onclick=async ()=>{
    const kind=document.getElementById('urg-kind').value; const title=(document.getElementById('urg-title').value||'').trim(); const details=(document.getElementById('urg-details').value||'').trim();
    if(!title){ toast('اكتب المكان أو المطلوب',false); return; }
    const sh=urgentTargetShiftNow(); send.disabled=true;
    const row={ id:uid('urg'), date:S.today, created_by:S.session.user.id, creator_name:S.profile.full_name||'', kind, title, details:details||null, target_shift:sh, status:'pending' };
    if(await dbInsert('urgent_tasks',[row])){
      await loadUrgent(); S.seenUrgent.add(row.id); S.urgentSig=urgentSignature();
      const recips=(S.presence||[]).filter(p=>p.present===true && (p.shift||'morning')===sh && ['supervisor','hk_senior_supervisor'].includes(((S.users||[]).find(u=>u.id===p.user_id)||{}).role)).length;
      render(); toast((S.presence||[]).length? `اتبعت لـ ${recips} من المشرفين الحاضرين في الوردية ${SHIFT_LABEL[sh]}` : 'تم إرسال التاسك',true);
    } else send.disabled=false;
  };
  document.querySelectorAll('[data-urg-status]').forEach(sel=>sel.onchange=async ()=>{
    sel.disabled=true;
    const patch={ status:sel.value, status_by:S.session.user.id, status_by_name:S.profile.full_name||'', status_at:new Date().toISOString() };
    if(await dbUpdate('urgent_tasks', sel.dataset.urgStatus, patch)){ await loadUrgent(); S.urgentSig=urgentSignature(); render(); toast('تم تحديث الحالة',true); } else sel.disabled=false;
  });
  document.querySelectorAll('[data-urg-del]').forEach(b=>b.onclick=async ()=>{ if(!confirm('حذف التاسك ده؟')) return; if(await dbDelete('urgent_tasks', b.dataset.urgDel)){ await loadUrgent(); S.urgentSig=urgentSignature(); render(); } });
}
let urgentPollStarted=false;
function startUrgentPoll(){
  if(urgentPollStarted) return; urgentPollStarted=true;
  (S.urgent||[]).forEach(t=>S.seenUrgent.add(t.id)); S.urgentSig=urgentSignature();
  setInterval(async ()=>{
    if(!S.session||!S.profile||!urgentRoles().includes(S.profile.role)) return;
    if(!(await loadUrgent())) return;
    let fresh=0;
    urgentVisible().forEach(t=>{
      if(!S.seenUrgent.has(t.id)){
        S.seenUrgent.add(t.id);
        if(t.created_by!==S.session.user.id){ fresh++; }
      }
    });
    const sig=urgentSignature();
    if((fresh || sig!==S.urgentSig) && document.visibilityState==='visible' && !S.modal && !hasUnsavedInput()){ S.urgentSig=sig; render(); }
  },20000);
}

async function qrRevoke(userId){

  const i=tmp.querySelector('img'); return i? i.src : '';
}

  document.querySelectorAll('[data-em-del]').forEach(b=>b.onclick=async ()=>{ if(!confirm('حذف البلاغ ده نهائيًا؟')) return; if(await dbDelete('emergency_alerts', b.dataset.emDel)){ await loadEmergencies(); render(); toast('تم الحذف',true); } });
  const btn=document.getElementById('em-send'); if(!btn) return;
  btn.onclick=async ()=>{
    const type=document.getElementById('em-type').value;
    const location=(document.getElementById('em-loc').value||'').trim();
    const details=(document.getElementById('em-details').value||'').trim();
    if(!location || !details){ toast('اكتب الموقع والمطلوب',false); return; }
    if(!confirm('إرسال بلاغ الطوارئ لجروب الواتساب دلوقتي؟')) return;
    btn.disabled=true; btn.textContent='جارِ الإرسال...';
    let r=null; try{ r=await callEmergencyFn({ type, location, details }); }catch(e){ r={ error:String((e&&e.message)||e) }; }
    if(r && r.ok && r.sent){ await loadEmergencies(); render(); toast('تم إرسال البلاغ لجروب الواتساب',true); return; }
    // الإرسال الأوتوماتيك مش شغّال: نعرض الرسالة جاهزة للإرسال اليدوي
    await loadEmergencies();
    S.modal={ type:'emergencyManual', msg:composeEmergencyMessage(type,location,details), reason:(r&&r.error)||'تعذّر الاتصال بخدمة الإرسال' };
    render();
  };
}

function getReportData(){
  const from=S.reportFrom, to=S.reportTo;
  const inRange = ds => ds && ds>=from && ds<=to;
  return {
    deliv: S.deliveries.filter(d=>inRange(d.date)),
    orders: S.orders.filter(o=>inRange(o.scheduled_date)),
    pest: (S.pest||[]).filter(p=>inRange(p.scheduled_date)),
    facade: (S.facade||[]).filter(f=>inRange(f.date)),
    waste: (S.waste||[]).filter(w=>inRange(w.date)),
    checklist: (S.taskRuns||[]).filter(c=>inRange(c.date)).map(c=>({...c, list_name:((S.taskLists||[]).find(l=>l.id===c.list_id)||{}).name||''})),
    attendance: S.attendance.filter(a=>inRange(a.date)),
  };
}

function exportReportExcel(){
  if(typeof XLSX==='undefined'){ toast('مكتبة Excel لم تُحمّل', false); return; }
  const data = getReportData();
  const wb = XLSX.utils.book_new();
  const addSheet=(rows, name, colMap)=>{
    if(!rows.length) return;
    const mapped = rows.map(r=>{
      const o={};
      colMap.forEach(([key,label,fmt])=>{ o[label] = fmt? fmt(r[key]) : (r[key]!=null? r[key] : ''); });
      return o;
    });
    const ws = XLSX.utils.json_to_sheet(mapped);
    XLSX.utils.book_append_sheet(wb, ws, name);
  };
  const statusFmt = v => STATUS_LABEL[v]||v;
  const shiftFmt = v => SHIFT_LABEL[v]||v;
  addSheet(data.deliv, 'وحدات التسليم', [['unit_code','كود الوحدة'],['date','التاريخ'],['status','الحالة',statusFmt],['notes','ملاحظات']]);
  addSheet(data.orders, 'الخدمة المدفوعة', [['unit_code','كود الوحدة'],['order_type','النوع',v=>ORDER_TYPE_LABEL[v]||v],['price','السعر'],['payment_status','حالة الدفع',v=>PAYMENT_STATUS_LABEL[v]||'غير مدفوع'],['scheduled_date','التاريخ'],['scheduled_time','الميعاد'],['status','الحالة',statusFmt]]);
  addSheet(data.pest, 'مكافحة الحشرات', [['unit_code','كود الوحدة'],['service_type','النوع',v=>PEST_TYPE_LABEL[v]||v],['price','السعر'],['payment_status','حالة الدفع',v=>PAYMENT_STATUS_LABEL[v]||'غير مدفوع'],['scheduled_date','التاريخ'],['status','الحالة',statusFmt]]);
  addSheet(data.facade, 'نظافة الواجهات', [['description','الوصف'],['date','التاريخ'],['status','الحالة',statusFmt]]);
  addSheet(data.waste, 'رفع المخلفات', [['description','الوصف'],['date','التاريخ'],['status','الحالة',statusFmt],['reason','السبب']]);
  addSheet(data.checklist, 'المهمات المجدولة', [['date','التاريخ'],['list_name','القائمة'],['status','الحالة',statusFmt]]);
  addSheet(data.attendance, 'الحضور', [['date','التاريخ'],['shift','الوردية',shiftFmt],['site_manager_count','مدير موقع'],['site_admin_count','إداري موقع'],['senior_supervisor_count','مشرف أول'],['supervisor_count','مشرف'],['worker_count','عامل'],['status','الحالة',statusFmt]]);
  if(!wb.SheetNames.length){ toast('لا توجد بيانات في هذه الفترة',false); return; }
  const wbout = XLSX.write(wb, { bookType:'xlsx', type:'array' });
  const blob = new Blob([wbout], { type:'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `تقرير_${S.reportFrom}_${S.reportTo}.xlsx`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
  toast('تم تصدير الملف',true);
}

    </div>`;
    html += `<div class="section-title"><h2>وحدات التسليم</h2></div>

      const noteCount = (S.unitNotes||[]).filter(n=>n.delivery_unit_id===d.id).length;

function bindSupervisorToday(){

    rb.disabled=true;
    await refreshAssignments(); await loadDeliveries(); await loadOrders(); await loadTaskData(); await ensureTodayTaskRuns();
    render(); toast('تم التحديث',true);
  };
  const wcs=document.getElementById('wc-save');
  if(wcs) wcs.onclick=async ()=>{
    const v=parseInt(document.getElementById('wc-input').value,10);
    if(!(v>=0)){ toast('اكتب عدد صحيح',false); return; }
    const me=S.session.user.id; const row={ id:'wc_'+S.today+'_'+me, date:S.today, supervisor_id:me, workers:v, updated_at:new Date().toISOString() };
    const {error}=await sb.from('hk_worker_counts').upsert([row],{onConflict:'id'});
    if(error){ toast('حصل خطأ: '+error.message,false); return; }
    S.workerCounts=(S.workerCounts||[]).filter(x=>x.supervisor_id!==me).concat([row]); toast('تم حفظ عدد العمال',true);
  };
  const gu=document.querySelector('[data-goto-urgent]'); if(gu) gu.onclick=()=>{ S.tab='urgent'; render(); };
  document.querySelectorAll('[data-my-dv]').forEach(sel=>sel.onchange=()=>handleStatusSelectChange('delivery_units', sel.dataset.myDv, sel.value, loadDeliveries));
  document.querySelectorAll('[data-my-ord]').forEach(sel=>sel.onchange=()=>handleStatusSelectChange('paid_service_orders', sel.dataset.myOrd, sel.value, loadOrders));
  document.querySelectorAll('[data-add-note]').forEach(b=>b.onclick=()=>{ S.modal={type:'addUnitNote', id:b.dataset.addNote}; render(); });
  document.querySelectorAll('details[data-tsup-open]').forEach(d=>d.addEventListener('toggle',()=>{ if(d.open) S.openTaskSup.add(d.dataset.tsupOpen); else S.openTaskSup.delete(d.dataset.tsupOpen); }));
  document.querySelectorAll('[data-ti-check]').forEach(cb=>cb.onchange=async ()=>{
    const [runId,itemId]=cb.dataset.tiCheck.split('|'); const checked=cb.checked; cb.disabled=true;
    const row={ run_id:runId, item_id:itemId, done:checked, done_by:S.session.user.id, done_at: checked? new Date().toISOString():null };
    const {error}=await sb.from('task_run_items').upsert([row],{onConflict:'run_id,item_id'});
    const y=window.scrollY;
    if(error){ console.error(error); toast('حصل خطأ: '+error.message,false); await loadTaskRunItems(); render(); window.scrollTo(0,y); return; }
    S.taskRunItems=(S.taskRunItems||[]).filter(x=>!(x.run_id===runId&&x.item_id===itemId)).concat([row]);
    render(); window.scrollTo(0,y);
  });
  document.querySelectorAll('[data-tl-mark]').forEach(b=>b.onclick=async ()=>{
    const nowMarked=b.dataset.marked==='1'; b.disabled=true;
    const patch={ supervisor_marked_done: !nowMarked, supervisor_marked_done_at: !nowMarked? new Date().toISOString() : null, marked_by: !nowMarked? S.session.user.id : null };
    if(!nowMarked) patch.review_status=null;
    if(await dbUpdate('task_runs', b.dataset.tlMark, patch)){
      const r=S.taskRuns.find(x=>x.id===b.dataset.tlMark); if(r) Object.assign(r,patch);
      const y=window.scrollY; render(); window.scrollTo(0,y);
      toast(nowMarked? 'تم الإلغاء' : 'تمام، هتظهر للمشرف الأول عشان يعتمدها', true);
    } else { b.disabled=false; }
  });
}

  if(m.type==='editComplaint'){
    const c = S.complaints.find(x=>x.id===m.id);

    <div class="form-row"><label>رقم الوحدة</label><input id="m-cx-unit" value="${esc(c.unit_code||'')}"></div>

      ${Object.keys(CHANNEL_LABEL).map(k=>`<option value="${k}" ${c.channel===k?'selected':''}>${CHANNEL_LABEL[k]}</option>`).join('')}

    const groupByPhase = (arr)=>{

    const tabBtn=(key,label)=>`<button data-sup-tab="${key}" class="ghost-btn${activeTab===key?' active-tab':''}" style="${activeTab===key?'background:var(--ink);color:#fff;':''}">${label}</button>`;

    const overviewHtml = `

    const kpiFormHtml = `
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">

    const kpiListHtml = PHASE_OPTIONS.map(ph=>{

    const invFormHtml = `

        <select id="m-inv-status" style="border:1px solid var(--line);border-radius:8px;padding:8px;grid-column:1/-1;">
          ${Object.keys(INVOICE_STATUS_LABEL).map(k=>`<option value="${k}">${INVOICE_STATUS_LABEL[k]}</option>`).join('')}

      <label class="ghost-btn file-btn" style="display:block;text-align:center;margin-bottom:6px;">${ICON.camera(13)} إضافة صورة الفاتورة (اختياري)<input type="file" accept="image/*" id="cf-photo"></label>
      <img id="cf-photo-preview" class="photo-preview" style="display:none;max-height:100px;margin-bottom:6px;">
