<style>
:root{
  --ink:#0E2A2B; --ink-2:#153B3C; --mint:#1B8A6B; --mint-light:#E4F3EC;
  --sand:#F5F3EC; --paper:#FFFFFF; --amber:#DA8B1F; --amber-light:#FBF0DD;
  --coral:#D9483B; --coral-light:#FCE7E5; --blue:#2463C4; --blue-light:#E5EEFC;
  --line:#E3DFD2; --text:#1B1B18; --text-dim:#6B6A5F; --radius:14px;
  --shadow: 0 2px 10px rgba(14,42,43,.06), 0 1px 2px rgba(14,42,43,.08);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:var(--sand); color:var(--text); font-family:'Tajawal',sans-serif; min-height:100vh; font-variant-numeric:tabular-nums;}
h1,h2,h3,.display{font-family:'Cairo',sans-serif;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}
.bk{position:absolute;width:16px;height:16px;pointer-events:none;}
.bk-tl{top:-1px;right:-1px;border-top:3px solid currentColor;border-right:3px solid currentColor;border-top-right-radius:6px;}
.bk-tr{top:-1px;left:-1px;border-top:3px solid currentColor;border-left:3px solid currentColor;border-top-left-radius:6px;}
.bk-bl{bottom:-1px;right:-1px;border-bottom:3px solid currentColor;border-right:3px solid currentColor;border-bottom-right-radius:6px;}
.bk-br{bottom:-1px;left:-1px;border-bottom:3px solid currentColor;border-left:3px solid currentColor;border-bottom-right-radius:6px;}
.viewfinder{position:relative;color:var(--mint);}
.topbar{background:var(--ink);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:50;box-shadow:var(--shadow);flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:38px;height:38px;position:relative;color:var(--mint);display:flex;align-items:center;justify-content:center;font-family:'Cairo';font-weight:900;font-size:15px;border:2px solid rgba(255,255,255,.15);border-radius:8px;background:rgba(255,255,255,.04);}
.brand-text .t1{font-family:'Cairo';font-weight:900;font-size:16px;letter-spacing:.5px;line-height:1.1;}
.brand-text .t2{font-size:11px;color:#9FC9BE;margin-top:1px;}
.role-badge{background:rgba(255,255,255,.1);color:#fff;padding:5px 12px;border-radius:999px;font-size:11.5px;font-weight:800;}
.wrap{max-width:1200px;margin:0 auto;padding:20px;}
.shell{display:flex;gap:18px;align-items:flex-start;max-width:1300px;margin:0 auto;padding:20px;}
.sidebar{width:230px;flex-shrink:0;display:flex;flex-direction:column;gap:3px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:var(--shadow);position:sticky;top:78px;}
.sidebar button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:none;background:transparent;color:var(--text-dim);font-weight:700;font-size:13px;text-align:right;width:100%;transition:.15s;}
.sidebar button svg{flex-shrink:0;opacity:.75;}
.sidebar button.active{background:var(--ink);color:#fff;}
.sidebar button.active svg{opacity:1;}
.sidebar button:not(.active):hover{background:var(--sand);color:var(--ink);}
.content{flex:1;min-width:0;}
@media(max-width:820px){
  .shell{flex-direction:column;padding:12px;gap:12px;}
  .sidebar{display:none;}
  .mobile-tab-select{display:block !important;}
}
.mobile-tab-select{display:none;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);font-weight:800;font-size:14px;background:var(--paper);color:var(--ink);margin-bottom:2px;}
.service-card{cursor:pointer;transition:.15s;}
.service-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(14,42,43,.12);}
.tabs button{border:1px solid var(--line);background:var(--paper);color:var(--text-dim);padding:9px 16px;border-radius:10px;font-weight:700;font-size:13.5px;transition:.15s;}
.tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.tabs button:not(.active):hover{border-color:var(--mint);color:var(--ink);}

async function dbSelect(table, filters){
  let q = sb.from(table).select('*');
  if(filters) Object.keys(filters).forEach(k=>{ q = q.eq(k, filters[k]); });
  const {data,error} = await q;
  if(error){ console.error(table, error); return []; }
  return data||[];
}

/* ============================= ROLE → TABS ============================= */
function tabsForRole(role){
  const adminTabs = [['home','الرئيسية'],['deliveries','وحدات التسليمات'],['orders','الخدمة المدفوعة'],['pest','مكافحة الحشرات'],['facade','نظافة الواجهات'],['waste','رفع المخلفات'],['installs','أعمال التأسيسات'],['checklist','قوائم التحقق اليومية'],['qrsheet','طباعة QR'],['attendance','الحضور'],['distribution','التوزيع اليومي'],['complaints','الشكاوى'],['suppliers','ملف الموردين'],['locations','المواقع'],['users','المستخدمون'],['reports','التقارير']];
  if(role==='admin') return adminTabs;
  if(role==='opm') return adminTabs; // نفس صلاحيات الإدارة بالظبط
  if(role==='fm_dispatcher') return [['orders','أوردرات الخدمة المدفوعة'],['pest','مكافحة الحشرات']];
  if(role==='supervisor') return [['today','قائمة اليوم'],['myname','بياناتي']];
  if(role==='contractor_manager') return [['home','الرئيسية'],['installs','أعمال التأسيسات'],['attendance','الحضور']];
  if(role==='contractor_admin') return [['attendance','الحضور']];
  if(role==='hk_manager') return [['home','الرئيسية'],['distribution','التوزيع اليومي'],['attendance','الحضور'],['deliveries','وحدات التسليمات'],['orders','الخدمة المدفوعة'],['checklist','قوائم التحقق اليومية'],['installs','أعمال التأسيسات'],['myname','بياناتي']];
  if(role==='hk_admin') return [['distribution','توزيع المسئولين'],['attendance','الحضور'],['deliveries','وحدات التسليمات'],['orders','الخدمة المدفوعة'],['checklist','قوائم التحقق اليومية'],['installs','أعمال التأسيسات'],['myname','بياناتي']];
  if(role==='hk_senior_supervisor') return [['distribution','توزيع المواقع'],['deliveries','وحدات التسليمات'],['orders','الخدمة المدفوعة'],['installs','أعمال التأسيسات'],['myname','بياناتي']];
  return [];
}

/* ============================= RENDER ROOT ============================= */
function render(){
  const app=document.getElementById('app');
  if(configMissing()){
    app.innerHTML = `<div class="card" style="max-width:480px;margin:60px auto;text-align:center;">
      <h2>التطبيق يحتاج إعداد</h2><p>ضع مفاتيح Supabase في أعلى الكود.</p></div>`;
    return;
  }
  document.body.classList.toggle('in-app', !!(S.session && S.profile));
  if(!S.session){ app.innerHTML = renderAuthScreen(); bindAuthEvents(); return; }
  if(!S.profile){ app.innerHTML = `<div style="padding:60px;text-align:center;">جارِ التحميل...</div>`; return; }
  const tabs = tabsForRole(S.profile.role);
  if(!S.tab || !tabs.find(t=>t[0]===S.tab)) S.tab = tabs.length?tabs[0][0]:null;
  app.innerHTML = `
    ${renderTopbar()}
    <div class="wrap" style="padding-bottom:0;">
      <select class="mobile-tab-select" id="mobile-tab-select">
        ${tabs.map(([id,label])=>`<option value="${id}" ${S.tab===id?'selected':''}>${esc(label)}</option>`).join('')}
      </select>
    </div>
    <div class="shell">
      <div class="sidebar">${tabs.map(([id,label])=>`<button data-tab="${id}" class="${S.tab===id?'active':''}">${ICON[TAB_ICON[id]]?ICON[TAB_ICON[id]](16):''}<span>${esc(label)}</span></button>`).join('')}</div>
      <div class="content" id="tab-body">${renderTabBody()}</div>
    </div>
    ${renderModal()}
  `;
  bindGlobalEvents();
  bindTabEvents();
  if(S.tab==='home') drawHomeCharts();
}

      </div>`).join('') : `<div style="padding:20px;text-align:center;color:var(--text-dim);font-size:12.5px;">لا توجد إشعارات</div>`}

function bindGlobalEvents(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; render(); });
  const mts=document.getElementById('mobile-tab-select'); if(mts) mts.onchange=e=>{ S.tab=e.target.value; render(); };
  const lb=document.getElementById('logout-btn'); if(lb) lb.onclick=doSignOut;
  const rb=document.getElementById('refresh-btn'); if(rb) rb.onclick=manualRefresh;
  const bb=document.getElementById('bell-btn'); if(bb) bb.onclick=(e)=>{
    e.stopPropagation();
    S.bellOpen = !S.bellOpen;
    if(S.bellOpen) S.notifications.forEach(n=>n.read=true);
    render();
  };
  document.querySelectorAll('[data-ntf-goto]').forEach(el=>el.onclick=()=>{
    S.tab = el.dataset.ntfGoto; S.bellOpen=false; render();
  });
  if(S.bellOpen){
    document.addEventListener('click', function closeBell(e){
      if(!e.target.closest('#bell-dropdown') && !e.target.closest('#bell-btn')){
        S.bellOpen=false; render(); document.removeEventListener('click', closeBell);
      }
    });
  }
}

/* ============================= TAB DISPATCH ============================= */
function renderTabBody(){
  switch(S.tab){
    case 'home': return renderHome();
    case 'deliveries': return renderDeliveries();
    case 'orders': return renderOrders();
    case 'pest': return renderPest();
    case 'facade': return renderFacade();
    case 'waste': return renderWaste();
    case 'installs': return renderInstalls();
    case 'checklist': return renderChecklistAdmin();
    case 'qrsheet': return renderQrSheet();
    case 'attendance': return renderAttendance();
    case 'distribution': return renderDistribution();
    case 'complaints': return renderComplaints();
    case 'suppliers': return renderSuppliers();
    case 'locations': return renderLocations();

    case 'reports': return renderReports();
    case 'today': return renderSupervisorToday();
    case 'myname': return renderMyName();
    default: return '';
  }
}
function bindTabEvents(){
  switch(S.tab){
    case 'home': bindHome(); break;
    case 'deliveries': bindDeliveries(); break;
    case 'orders': bindOrders(); break;
    case 'pest': bindPest(); break;

    case 'checklist': bindChecklistAdmin(); break;
    case 'qrsheet': bindQrSheet(); break;
    case 'attendance': bindAttendance(); break;
    case 'distribution': bindDistribution(); break;
    case 'complaints': bindComplaints(); break;
    case 'suppliers': bindSuppliers(); break;
    case 'locations': bindLocations(); break;
    case 'users': bindUsers(); break;
    case 'reports': bindReports(); break;

}

    </div>
    <div class="lbl">${esc(label)}</div>

}
function renderHome(){

function genericMatch(obj, q){
  return Object.keys(obj||{}).some(k=>{
    const v = obj[k];
    return typeof v==='string' && v.toLowerCase().includes(q);
  });
}
function runSystemSearch(q){
  q = (q||'').trim().toLowerCase();
  if(q.length < 2) return [];
  const groups = [
    { tab:'deliveries', label:'تسليم وحدة', data:S.deliveries, title:d=>esc(d.unit_code||'-') },
    { tab:'orders', label:'خدمة مدفوعة', data:S.orders, title:o=>`${esc(o.unit_code||'-')} — ${ORDER_TYPE_LABEL[o.order_type]||o.order_type}` },

    { tab:'complaints', label:'شكوى', data:S.complaints, title:c=>`${esc(c.unit_code||'-')} — ${esc((c.description||'').slice(0,50))}` },
    { tab:'suppliers', label:'مورد', data:S.suppliers, title:s=>esc(s.name||'-') },

    { tab:'locations', label:'موقع', data:S.locations, title:l=>esc(l.name||'-') },
  ];
  const results=[];
  groups.forEach(g=>{
    (g.data||[]).forEach(item=>{
      if(genericMatch(item, q)) results.push({ label:g.label, tab:g.tab, title:g.title(item) });
    });
  });
  return results.slice(0,60);
}

const ORDER_TYPE_LABEL = { soft_cleaning:'Soft Cleaning', deep_cleaning:'Deep Cleaning', facade_cleaning:'Early Façade Cleaning' };
const PAYMENT_STATUS_LABEL = { paid:'مدفوع', unpaid:'غير مدفوع' };
const FACADE_FLAT_PRICE = 1000;
const PRICE_BANDS = [
  { from:54,  to:100, deep_cleaning:880,  soft_cleaning:660 },
  { from:101, to:150, deep_cleaning:1200, soft_cleaning:900 },
  { from:151, to:180, deep_cleaning:1440, soft_cleaning:1080 },
  { from:181, to:200, deep_cleaning:1600, soft_cleaning:1200 },
  { from:201, to:230, deep_cleaning:1840, soft_cleaning:1380 },
  { from:231, to:250, deep_cleaning:2000, soft_cleaning:1500 },
  { from:251, to:269, deep_cleaning:2152, soft_cleaning:1614 },
];
const PEST_PRICE_BANDS = [
  { from:54,  to:100, full_service:1000, flying_spray:500,  crawling_spray:500,  rodent_control:500,  specialized_spray:null },
  { from:101, to:150, full_service:1500, flying_spray:750,  crawling_spray:750,  rodent_control:750,  specialized_spray:null },
  { from:151, to:180, full_service:1800, flying_spray:900,  crawling_spray:900,  rodent_control:900,  specialized_spray:null },
  { from:181, to:200, full_service:2000, flying_spray:1000, crawling_spray:1000, rodent_control:1000, specialized_spray:null },
  { from:201, to:230, full_service:2300, flying_spray:1150, crawling_spray:1150, rodent_control:1150, specialized_spray:null },
  { from:231, to:250, full_service:2500, flying_spray:1250, crawling_spray:1250, rodent_control:1250, specialized_spray:null },
  { from:251, to:269, full_service:2690, flying_spray:1345, crawling_spray:1345, rodent_control:1345, specialized_spray:null },
];
const PER_METER_RATE_FALLBACK = { soft_cleaning:6, deep_cleaning:8 }; // EGP/m² — used only when a unit's BUA falls outside all fixed price bands (e.g. very small studios or large villas)
function getUnitInfo(unit_code){ return S.units.find(x=>x.unit_code===(unit_code||'').trim()) || null; }
function findBand(bands, bua){ return bands.find(b=> bua>=b.from && bua<=b.to) || null; }
function calcOrderPrice(order_type, unit_code){
  if(order_type==='facade_cleaning') return FACADE_FLAT_PRICE;
  const u = getUnitInfo(unit_code); if(!u) return null;
  const band = findBand(PRICE_BANDS, +u.bua);
  if(band) return band[order_type];
  if(PER_METER_RATE_FALLBACK[order_type]) return Math.round(+u.bua * PER_METER_RATE_FALLBACK[order_type]);
  return null;
}
function findNearestBand(bands, bua){
  let nearest = bands[0], minDist = Infinity;
  bands.forEach(b=>{
    const dist = bua < b.from ? b.from - bua : (bua > b.to ? bua - b.to : 0);
    if(dist < minDist){ minDist = dist; nearest = b; }
  });
  return nearest;
}
function calcPestPrice(service_type, unit_code){
  if(service_type==='specialized_spray') return null; // After Inspection — priced manually
  const u = getUnitInfo(unit_code); if(!u) return null;
  const band = findBand(PEST_PRICE_BANDS, +u.bua) || findNearestBand(PEST_PRICE_BANDS, +u.bua);
  return band ? band[service_type] : null;
}
function priceDisplayHtml(price, isSpecialized){
  if(isSpecialized) return `<span style="color:var(--text-dim);font-weight:700;">يُسعّر بعد المعاينة</span>`;
  if(price==null) return `<span style="color:var(--text-dim);">اكتب كود وحدة موجود في units_master عشان يتحسب السعر</span>`;
  return `<span style="color:var(--mint);font-weight:700;">السعر: ${price.toLocaleString('en-US')} ج.م</span>`;
}
const MAX_ORDERS_PER_DAY = 2;
function ordersCountForDate(date){ return S.orders.filter(o=>o.scheduled_date===date && o.status!=='postponed').length; }
function findNextAvailableOrderDate(fromDate){
  let d = new Date(fromDate+'T00:00:00');
  for(let i=0;i<60;i++){
    d.setDate(d.getDate()+1);
    const ds = d.toISOString().slice(0,10);
    if(ordersCountForDate(ds) < MAX_ORDERS_PER_DAY) return ds;
  }
  return null;
}
function updateOrderAvailabilityMsg(date){
  const box = document.getElementById('ord-availability-msg'); if(!box) return;
  const count = ordersCountForDate(date);
  if(count >= MAX_ORDERS_PER_DAY){
    const next = findNextAvailableOrderDate(date);
    box.innerHTML = `<span style="color:var(--coral);font-weight:700;">❌ اليوم ده مكتمل (${count}/${MAX_ORDERS_PER_DAY})</span>` + (next? ` — <button type="button" class="ghost-btn" id="use-next-date-btn" data-next-date="${next}" style="padding:3px 8px;font-size:11px;">أقرب موعد متاح: ${next}</button>` : '');
    const btn = box.querySelector('#use-next-date-btn');
    if(btn) btn.onclick=()=>{ document.getElementById('m-ord-date').value = btn.dataset.nextDate; updateOrderAvailabilityMsg(btn.dataset.nextDate); };
  } else {
    box.innerHTML = `<span style="color:var(--mint);font-weight:700;">✓ متاح (${count}/${MAX_ORDERS_PER_DAY})</span>`;
  }
}

/* ============================= SUPPLIERS ============================= */
const PHASE_OPTIONS = ['Phase 1','Phase 2','عام'];
function supplierStats(supId){
  const invoices = S.supplierInvoices.filter(i=>i.supplier_id===supId);
  const totalInvoiced = invoices.reduce((s,i)=>s+Number(i.amount||0),0);
  const paidInvoices = invoices.filter(i=>i.status==='paid');
  const totalPaid = paidInvoices.reduce((s,i)=>s+(Number(i.amount||0)-Number(i.discount||0)),0);
  const totalSaved = paidInvoices.reduce((s,i)=>s+Number(i.discount||0),0);
  return { totalInvoiced, totalPaid, totalSaved, count:invoices.length };
}
function supplierMonthlyTotals(supId){
  const invoices = S.supplierInvoices.filter(i=>i.supplier_id===supId);
  const byMonth = {};
  invoices.forEach(i=>{
    const month = (i.invoice_date||'').slice(0,7);
    if(!month) return;
    if(!byMonth[month]) byMonth[month] = { invoiced:0, paid:0, discount:0, phases:new Set() };
    byMonth[month].invoiced += Number(i.amount||0);
    byMonth[month].discount += Number(i.discount||0);
    if(i.status==='paid') byMonth[month].paid += Number(i.amount||0)-Number(i.discount||0);
    byMonth[month].phases.add(i.phase||'عام');
  });
  return Object.keys(byMonth).sort((a,b)=>b.localeCompare(a)).map(month=>({ month, ...byMonth[month], phases:Array.from(byMonth[month].phases) }));
}
function renderSuppliers(){
  const filter = S.supplierFilter;
  const list = filter==='all'? S.suppliers : S.suppliers.filter(s=>s.category===filter);

  // القطاع الخامس: الوضع المالي الإجمالي
  let grandBudget=0, grandInvoiced=0, grandPaid=0, grandSaved=0;
  S.suppliers.forEach(s=>{
    grandBudget += Number(s.budget||0);
    const st = supplierStats(s.id);
    grandInvoiced += st.totalInvoiced; grandPaid += st.totalPaid; grandSaved += st.totalSaved;

function kpiScore(k){
  if(k.overall_score!=null && k.overall_score!=='') return k.overall_score;
  try{
    const items = typeof k.items==='string'? JSON.parse(k.items) : (k.items||[]);
    if(items && items.length) return items.reduce((s,i)=>s+(+i.actual||0),0);
  }catch(e){}
  return k.score!=null? k.score : 0;
}

function printKpiReport(kpiId){
  const kpi = S.supplierKpi.find(k=>k.id===kpiId);

  const monthLabel = (()=>{ const [y,m]=(kpi.month||'').split('-'); const names=['January','February','March','April','May','June','July','August','September','October','November','December']; return m? `${names[+m-1]} – ${y}` : kpi.month; })();
  const finalScore = kpiScore(kpi);
  const scoreBand = KPI_SCORING_CRITERIA.find(c=>finalScore>=c.min) || KPI_SCORING_CRITERIA[KPI_SCORING_CRITERIA.length-1];

  const html = `
  <div style="font-family:Arial,sans-serif;color:#000;padding:30px;direction:ltr;text-align:left;">
    <div style="text-align:center;font-weight:bold;font-size:16px;text-decoration:underline;">Ora Property Management</div>

    <table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:24px;">
      <tr style="background:#ccc;"><th style="border:1px solid #000;padding:6px;">KPI Category</th><th style="border:1px solid #000;padding:6px;">KPI Name</th><th style="border:1px solid #000;padding:6px;">Weight (%)</th><th style="border:1px solid #000;padding:6px;">Actual (%)</th><th style="border:1px solid #000;padding:6px;">Status</th></tr>
      ${items.map(i=>`<tr><td style="border:1px solid #000;padding:6px;">${esc(i.category)}</td><td style="border:1px solid #000;padding:6px;">${esc(i.name)}</td><td style="border:1px solid #000;padding:6px;text-align:center;">${i.weight}</td><td style="border:1px solid #000;padding:6px;text-align:center;">${i.actual}</td><td style="border:1px solid #000;padding:6px;">${esc(i.status||'')}</td></tr>`).join('')}
      <tr><td style="border:1px solid #000;padding:6px;font-weight:bold;">Overall Performance Score</td><td style="border:1px solid #000;padding:6px;text-align:center;" colspan="4">${finalScore}</td></tr>
    </table>

    <div style="text-align:center;font-weight:bold;font-size:15px;text-decoration:underline;margin-bottom:10px;">KPI Scoring Criteria &amp; Adjustment Percentage</div>
    <table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:30px;">
      <tr style="background:#ccc;"><th style="border:1px solid #000;padding:6px;">% Performance</th><th style="border:1px solid #000;padding:6px;">Level of Performance</th><th style="border:1px solid #000;padding:6px;">Percentage Adjustment</th></tr>
      ${KPI_SCORING_CRITERIA.map(c=>`<tr style="${c===scoreBand?'background:#e4f3ec;':''}"><td style="border:1px solid #000;padding:6px;background:#eee;">${c.range}</td><td style="border:1px solid #000;padding:6px;">${c.level}</td><td style="border:1px solid #000;padding:6px;text-align:center;">${c.adj}</td></tr>`).join('')}
    </table>

    <div style="display:flex;justify-content:space-between;font-size:13px;margin-top:40px;">
      <div>OPM Soft Service Manager:<br><br>....................................</div>
      <div>Provider Rep:<br><br>....................................</div>
    </div>
  </div>`;

  let holder = document.getElementById('kpi-print-area');
  if(!holder){ holder = document.createElement('div'); holder.id='kpi-print-area'; holder.className='print-sheet'; document.body.appendChild(holder); }
  holder.innerHTML = html;
  window.print();
}

async function loadDistData(){
  S.zones = await dbSelect('zones');
  const sessions = await dbSelect('distribution_sessions', { date: S.today });
  S.distSession = sessions[0] || null;
  S.presence = await dbSelect('daily_presence', { date: S.today });
  S.zoneAssignments = await dbSelect('zone_assignments', { date: S.today });
  S.locationAssignments = await dbSelect('location_assignments', { date: S.today });
  S.auditVisits = await dbSelect('location_audit_visits');
}
function isPresent(userId){ const p=S.presence.find(x=>x.user_id===userId); return p? p.present : null; }

function renderDistribution(){
  const role=S.profile.role;
  let html='';
  if(role==='admin'||role==='opm'||role==='hk_manager') html += renderManagerSection();
  if(role==='admin'||role==='opm'||role==='hk_admin') html += renderPresenceSection();
  if(role==='admin'||role==='opm'||role==='hk_senior_supervisor') html += renderSeniorSection();
  return html || `<p style="color:var(--text-dim);">لا توجد شاشة توزيع متاحة لدورك.</p>`;
}
function bindDistribution(){
  const startBtn=document.getElementById('start-dist-btn');
  if(startBtn) startBtn.onclick=async ()=>{
    const row={ id:uid('sess'), date:S.today, status:'presence', started_by:S.session.user.id };
    if(await dbInsert('distribution_sessions',[row])){ await loadDistData(); render(); toast('تم بدء التوزيع لليوم',true); }
  };
  const savePresence=document.getElementById('save-presence-btn');
  if(savePresence) savePresence.onclick=async ()=>{
    const rows=[];
    document.querySelectorAll('[data-presence-select]').forEach(sel=>{
      const userId = sel.dataset.presenceSelect;
      const scopeSel = document.querySelector(`[data-presence-scope="${userId}"]`);
      const nameInput = document.querySelector(`[data-presence-name="${userId}"]`);
      rows.push({ id:uid('pres'), date:S.today, user_id:userId, present:sel.value==='1', scope: scopeSel? scopeSel.value : 'general_areas', actual_name: nameInput? nameInput.value.trim() : null, marked_by:S.session.user.id });
    });
    // احذف القديم لليوم لنفس المستخدمين ثم أضف الجديد (أبسط من upsert يدوي)
    for(const r of rows){
      const existing = S.presence.find(p=>p.user_id===r.user_id);
      if(existing) await dbDelete('daily_presence', existing.id);
    }
    if(await dbInsert('daily_presence', rows)){ await loadDistData(); render(); toast('تم حفظ الحضور',true); }
  };
  document.querySelectorAll('[data-assign-zone]').forEach(sel=>sel.onchange=async ()=>{
    const supId=sel.dataset.assignZone;
    if(!sel.value) return;
    const row={ id:uid('za'), date:S.today, zone_id:sel.value, senior_supervisor_id:supId, assigned_by:S.session.user.id };
    if(await dbInsert('zone_assignments',[row])){ await loadDistData(); render(); toast('تم تعيين الزون',true); }
  });
  document.querySelectorAll('[data-assign-location]').forEach(sel=>sel.onchange=async ()=>{
    const locId=sel.dataset.assignLocation;
    if(!sel.value) return;
    const row={ id:uid('la'), date:S.today, location_id:locId, supervisor_id:sel.value, assigned_by:S.session.user.id };
    if(await dbInsert('location_assignments',[row])){ await loadDistData(); render(); toast('تم التعيين',true); }
  });
  document.querySelectorAll('[data-scan-audit]').forEach(b=>b.onclick=()=>{ S.scanCtx={auditLocationId:b.dataset.scanAudit, mode:'audit'}; S.modal={type:'scanAudit'}; render(); });
  document.querySelectorAll('[data-scan-cl-senior]').forEach(b=>b.onclick=()=>{ S.scanCtx={instanceId:b.dataset.scanClSenior}; S.modal={type:'scan'}; render(); });
}

function getReportData(){
  const from=S.reportFrom, to=S.reportTo;
  const inRange = ds => ds && ds>=from && ds<=to;
  return {
    deliv: S.deliveries.filter(d=>inRange(d.date)),
    orders: S.orders.filter(o=>inRange(o.scheduled_date)),
    pest: (S.pest||[]).filter(p=>inRange(p.scheduled_date)),
    facade: (S.facade||[]).filter(f=>inRange(f.date)),
    waste: (S.waste||[]).filter(w=>inRange(w.date)),
    installs: S.installs.filter(i=>inRange(i.date)),
    checklist: S.checklistInstances.filter(c=>inRange(c.date)),
    attendance: S.attendance.filter(a=>inRange(a.date)),
  };
}

function exportReportExcel(){
  if(typeof XLSX==='undefined'){ toast('مكتبة Excel لم تُحمّل', false); return; }
  const data = getReportData();
  const wb = XLSX.utils.book_new();
  const addSheet=(rows, name, colMap)=>{
    if(!rows.length) return;
    const mapped = rows.map(r=>{
      const o={};
      colMap.forEach(([key,label,fmt])=>{ o[label] = fmt? fmt(r[key]) : (r[key]!=null? r[key] : ''); });
      return o;
    });
    const ws = XLSX.utils.json_to_sheet(mapped);
    XLSX.utils.book_append_sheet(wb, ws, name);
  };
  const statusFmt = v => STATUS_LABEL[v]||v;
  const shiftFmt = v => SHIFT_LABEL[v]||v;
  addSheet(data.deliv, 'وحدات التسليم', [['unit_code','كود الوحدة'],['date','التاريخ'],['status','الحالة',statusFmt],['notes','ملاحظات']]);
  addSheet(data.orders, 'الخدمة المدفوعة', [['unit_code','كود الوحدة'],['order_type','النوع',v=>ORDER_TYPE_LABEL[v]||v],['price','السعر'],['payment_status','حالة الدفع',v=>PAYMENT_STATUS_LABEL[v]||'غير مدفوع'],['scheduled_date','التاريخ'],['scheduled_time','الميعاد'],['status','الحالة',statusFmt]]);
  addSheet(data.pest, 'مكافحة الحشرات', [['unit_code','كود الوحدة'],['service_type','النوع',v=>PEST_TYPE_LABEL[v]||v],['price','السعر'],['payment_status','حالة الدفع',v=>PAYMENT_STATUS_LABEL[v]||'غير مدفوع'],['scheduled_date','التاريخ'],['status','الحالة',statusFmt]]);
  addSheet(data.facade, 'نظافة الواجهات', [['description','الوصف'],['date','التاريخ'],['status','الحالة',statusFmt]]);
  addSheet(data.waste, 'رفع المخلفات', [['description','الوصف'],['date','التاريخ'],['status','الحالة',statusFmt],['reason','السبب']]);
  addSheet(data.installs, 'أعمال التأسيسات', [['description','الوصف'],['date','التاريخ'],['shift','الوردية',shiftFmt],['status','الحالة',statusFmt],['postpone_reason','سبب التأجيل']]);
  addSheet(data.checklist, 'قوائم التحقق اليومية', [['date','التاريخ'],['shift','الوردية',shiftFmt],['status','الحالة',statusFmt]]);
  addSheet(data.attendance, 'الحضور', [['date','التاريخ'],['shift','الوردية',shiftFmt],['site_manager_count','مدير موقع'],['site_admin_count','إداري موقع'],['senior_supervisor_count','مشرف أول'],['supervisor_count','مشرف'],['worker_count','عامل'],['status','الحالة',statusFmt]]);
  if(!wb.SheetNames.length){ toast('لا توجد بيانات في هذه الفترة',false); return; }
  const wbout = XLSX.write(wb, { bookType:'xlsx', type:'array' });
  const blob = new Blob([wbout], { type:'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `تقرير_${S.reportFrom}_${S.reportTo}.xlsx`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
  toast('تم تصدير الملف',true);
}

    ${myScope==='units' ? '' : `
    <div class="section-title"><h2>قوائم التحقق اليومية</h2></div>
    ${myChecklist.length? `<div class="grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;">
      ${myChecklist.map(ci=>{
        const def=S.checklistDefs.find(c=>c.id===ci.checklist_definition_id);
        const loc=S.locations.find(l=>l.id===ci.location_id);
        const isDone=ci.status==='completed';
        return `<div class="card">
          <div style="display:flex;justify-content:space-between;"><b>${esc(def?def.name:'')}</b>${statusBadge(ci.status)}</div>

        </div>`;
      }).join('')}
    </div>` : `<p style="color:var(--text-dim);font-size:13px;">لا توجد عناصر قوائم تحقق لك اليوم</p>`}`}`;
  }

  return html;
}
function bindSupervisorToday(){
  document.querySelectorAll('[data-my-dv]').forEach(sel=>sel.onchange=()=>handleStatusSelectChange('delivery_units', sel.dataset.myDv, sel.value, loadDeliveries));
  document.querySelectorAll('[data-my-ord]').forEach(sel=>sel.onchange=()=>handleStatusSelectChange('paid_service_orders', sel.dataset.myOrd, sel.value, loadOrders));
  document.querySelectorAll('[data-my-pest]').forEach(sel=>sel.onchange=async ()=>{ await dbUpdate('pest_control_requests', sel.dataset.myPest, {status:sel.value, updated_at:new Date().toISOString()}); await loadPest(); render(); toast('تم التحديث',true); });
  document.querySelectorAll('[data-my-facade]').forEach(b=>b.onclick=()=>{ S.modal={type:'completeFacade', id:b.dataset.myFacade}; render(); });
  document.querySelectorAll('[data-my-waste-done]').forEach(b=>b.onclick=async ()=>{ await dbUpdate('waste_removal_jobs', b.dataset.myWasteDone, {status:'completed', updated_at:new Date().toISOString()}); await loadWaste(); render(); toast('تم التحديث',true); });
  document.querySelectorAll('[data-my-waste-notdone]').forEach(b=>b.onclick=()=>{ S.modal={type:'markWaste', id:b.dataset.myWasteNotdone}; render(); });
  document.querySelectorAll('[data-add-note]').forEach(b=>b.onclick=()=>{ S.modal={type:'addUnitNote', id:b.dataset.addNote}; render(); });
}

        ${s.contract_photo?`<img src="${s.contract_photo}" class="photo-preview" style="max-height:140px;margin-top:8px;">`:''}
        <div style="margin-top:10px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;"><span>البدجت: <b>${Number(s.budget||0).toLocaleString()}</b></span><span>المتبقي: <b style="color:${remaining<0?'var(--coral)':'var(--mint)'};">${remaining.toLocaleString()}</b></span></div>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-top:4px;flex-wrap:wrap;gap:6px;"><span>إجمالي الفواتير: ${st.totalInvoiced.toLocaleString()}</span><span>موفّر من الخصومات: ${st.totalSaved.toLocaleString()}</span></div>
        <button class="ghost-btn danger" id="del-supplier-btn" style="width:100%;margin-top:10px;">${ICON.trash(12)} حذف المورد نهائيًا</button>
      </div>
      <h4 style="font-size:14px;margin:16px 0 8px;">الحساب المجمّع شهريًا (كل الفيزات مع بعض)</h4>
      ${monthly.length? `<div class="tbl-wrap" style="box-shadow:none;"><table><thead><tr><th>الشهر</th><th>إجمالي الفواتير</th><th>المدفوع فعليًا</th><th>الخصومات</th><th>الفيزات</th></tr></thead><tbody>
        ${monthly.map(mo=>`<tr><td>${mo.month}</td><td>${mo.invoiced.toLocaleString()}</td><td>${mo.paid.toLocaleString()}</td><td>${mo.discount.toLocaleString()}</td><td style="font-size:11.5px;color:var(--text-dim);">${mo.phases.join(' / ')}</td></tr>`).join('')}
      </tbody></table></div>` : `<p style="font-size:12px;color:var(--text-dim);">لا توجد فواتير بعد</p>`}
    `;

    const kpiFormHtml = `
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
        <div class="form-row" style="flex:1;min-width:140px;"><label>الشهر</label><input type="month" id="m-kpi-month"></div>
        <div class="form-row" style="flex:1;min-width:140px;"><label>الفيز</label><select id="m-kpi-phase">${PHASE_OPTIONS.map(p=>`<option value="${p}">${p}</option>`).join('')}</select></div>
      </div>
      <div class="tbl-wrap" style="box-shadow:none;margin-bottom:8px;"><table><thead><tr><th>القسم</th><th>البند</th><th>الوزن %</th><th>الفعلي %</th></tr></thead><tbody>
        ${kpiTemplateFor(s.category).map((k,idx)=>`<tr><td>${k.category}</td><td>${k.name}</td><td>${k.weight}</td><td><input type="number" min="0" max="${k.weight}" id="kpi-actual-${idx}" value="${k.weight}" style="width:60px;border:1px solid var(--line);border-radius:6px;padding:4px;"></td></tr>`).join('')}
      </tbody></table></div>
      <button class="ghost-btn" id="add-kpi-btn" style="width:100%;margin-bottom:14px;">حفظ تقييم الشهر</button>
    `;
    const kpiListHtml = PHASE_OPTIONS.map(ph=>{
      const list = kpiByPhase[ph]||[];
      if(!list.length) return '';
      return `<h4 style="font-size:13px;margin:14px 0 6px;color:var(--mint);">${ph}</h4>
      ${list.map(k=>`<div style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:7px 0;border-bottom:1px dashed var(--line);gap:6px;flex-wrap:wrap;">
        <span>${esc(k.month)} — النتيجة: <b>${kpiScore(k)}%</b></span>
        <div style="display:flex;gap:4px;">
          <button class="ghost-btn" data-kpi-edit="${k.id}">تعديل</button>
          <button class="ghost-btn" data-kpi-pdf="${k.id}">${ICON.printer(12)} PDF</button>
          <button class="ghost-btn danger" data-kpi-del="${k.id}">${ICON.trash(12)}</button>
        </div>
      </div>`).join('')}`;
    }).join('') || `<p style="font-size:12px;color:var(--text-dim);">لا يوجد تقييم بعد</p>`;

    const invFormHtml = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px;">
        <input type="number" id="m-inv-amount" placeholder="المبلغ" style="border:1px solid var(--line);border-radius:8px;padding:8px;">
        <input type="number" id="m-inv-discount" placeholder="الخصم (اختياري)" style="border:1px solid var(--line);border-radius:8px;padding:8px;">
        <input type="date" id="m-inv-date" style="border:1px solid var(--line);border-radius:8px;padding:8px;">
        <select id="m-inv-phase" style="border:1px solid var(--line);border-radius:8px;padding:8px;">${PHASE_OPTIONS.map(p=>`<option value="${p}">${p}</option>`).join('')}</select>
        <select id="m-inv-status" style="border:1px solid var(--line);border-radius:8px;padding:8px;grid-column:1/-1;">
          ${Object.keys(INVOICE_STATUS_LABEL).map(k=>`<option value="${k}">${INVOICE_STATUS_LABEL[k]}</option>`).join('')}
        </select>
      </div>
      <label class="ghost-btn file-btn" style="display:block;text-align:center;margin-bottom:6px;">${ICON.camera(13)} إضافة صورة الفاتورة (اختياري)<input type="file" accept="image/*" id="cf-photo"></label>
      <img id="cf-photo-preview" class="photo-preview" style="display:none;max-height:100px;margin-bottom:6px;">
      <button class="ghost-btn" id="add-invoice-btn" style="width:100%;margin-bottom:14px;">إضافة فاتورة</button>
    `;
    const invListHtml = PHASE_OPTIONS.map(ph=>{
      const list = invByPhase[ph]||[];
      if(!list.length) return '';
      return `<h4 style="font-size:13px;margin:14px 0 6px;color:var(--mint);">${ph}</h4>
      <div class="tbl-wrap" style="box-shadow:none;"><table><thead><tr><th>المبلغ</th><th>الخصم</th><th>التاريخ</th><th>الحالة</th><th>الفاتورة</th><th></th></tr></thead><tbody>
        ${list.map(i=>`<tr><td>${Number(i.amount).toLocaleString()}</td><td>${Number(i.discount||0).toLocaleString()}</td><td>${i.invoice_date}</td><td>
          <select data-inv-status="${i.id}">${Object.keys(INVOICE_STATUS_LABEL).map(k=>`<option value="${k}" ${i.status===k?'selected':''}>${INVOICE_STATUS_LABEL[k]}</option>`).join('')}</select>
        </td><td>${i.photo?`<img src="${i.photo}" style="width:32px;height:32px;object-fit:cover;border-radius:6px;cursor:pointer;" data-view-inv-photo="${i.id}">`:'-'}</td>
        <td><button class="ghost-btn" data-inv-edit="${i.id}">تعديل</button> <button class="ghost-btn danger" data-inv-del="${i.id}">${ICON.trash(12)}</button></td></tr>`).join('')}
      </tbody></table></div>`;
    }).join('') || `<p style="font-size:12px;color:var(--text-dim);">لا توجد فواتير بعد</p>`;

    return modalWrap('ملف المورد: '+esc(s.name), `
      <div style="display:flex;gap:8px;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:12px;flex-wrap:wrap;">
        ${tabBtn('overview','نظرة عامة')}
        ${tabBtn('kpi','تقييم الأداء (KPI)')}
        ${tabBtn('invoices','الفواتير')}
      </div>
      ${activeTab==='overview'? overviewHtml : ''}
      ${activeTab==='kpi'? kpiFormHtml + kpiListHtml : ''}
      ${activeTab==='invoices'? invFormHtml + invListHtml : ''}
    `, 'full');
  }
  if(m.type==='editKpi'){
    const k = S.supplierKpi.find(x=>x.id===m.id);
    const kSupplier = S.suppliers.find(x=>x.id===k.supplier_id);
    const tpl = kpiTemplateFor(kSupplier?kSupplier.category:null);
    let items=[]; try{ items = typeof k.items==='string'? JSON.parse(k.items) : (k.items||[]); }catch(e){}
    return modalWrap('تعديل تقييم '+esc(k.month), `
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <div class="form-row" style="flex:1;min-width:140px;"><label>الشهر</label><input type="month" id="m-kpi-month" value="${k.month||''}"></div>
      <div class="form-row" style="flex:1;min-width:140px;"><label>الفيز</label><select id="m-kpi-phase">${PHASE_OPTIONS.map(p=>`<option value="${p}" ${((k.phase||'عام')===p)?'selected':''}>${p}</option>`).join('')}</select></div>
    </div>
    <div class="tbl-wrap" style="box-shadow:none;margin-bottom:8px;"><table><thead><tr><th>القسم</th><th>البند</th><th>الوزن %</th><th>الفعلي %</th></tr></thead><tbody>
      ${tpl.map((kt,idx)=>{ const existing = items[idx]? items[idx].actual : kt.weight; return `<tr><td>${kt.category}</td><td>${kt.name}</td><td>${kt.weight}</td><td><input type="number" min="0" max="${kt.weight}" id="kpi-actual-${idx}" value="${existing}" style="width:60px;border:1px solid var(--line);border-radius:6px;padding:4px;"></td></tr>`; }).join('')}
    </tbody></table></div>
    <button class="primary-btn" style="width:100%;justify-content:center;" id="m-save">حفظ التعديل</button>`, true);
  }
  if(m.type==='editInvoice'){
    const i = S.supplierInvoices.find(x=>x.id===m.id);
    return modalWrap('تعديل الفاتورة', `
    <div class="form-row"><label>المبلغ</label><input type="number" id="m-inv-amount" value="${i.amount||0}"></div>
    <div class="form-row"><label>الخصم (اختياري)</label><input type="number" id="m-inv-discount" value="${i.discount||0}"></div>
    <div class="form-row"><label>التاريخ</label><input type="date" id="m-inv-date" value="${i.invoice_date||''}"></div>
    <div class="form-row"><label>الفيز</label><select id="m-inv-phase">${PHASE_OPTIONS.map(p=>`<option value="${p}" ${((i.phase||'عام')===p)?'selected':''}>${p}</option>`).join('')}</select></div>
    <div class="form-row"><label>الحالة</label><select id="m-inv-status">${Object.keys(INVOICE_STATUS_LABEL).map(k=>`<option value="${k}" ${i.status===k?'selected':''}>${INVOICE_STATUS_LABEL[k]}</option>`).join('')}</select></div>
    <button class="primary-btn" style="width:100%;justify-content:center;" id="m-save">حفظ التعديل</button>`);
  }
  if(m.type==='addUnitNote') return modalWrap('إضافة ملاحظة عن الوحدة', `
    <div class="form-row"><label>وصف العطل أو التلفية</label><textarea id="m-note-text" placeholder="مثال: الباب الزجاجي مكسور"></textarea></div>
    <div class="form-row"><label>صورة (اختياري لكن يُفضّل)</label>
      <label class="ghost-btn file-btn" style="display:block;text-align:center;">${ICON.camera()} إضافة صورة<input type="file" accept="image/*" capture="environment" id="cf-photo"></label>
      <img id="cf-photo-preview" class="photo-preview" style="display:none;">
    </div>
    <button class="primary-btn" style="width:100%;justify-content:center;" id="m-save">${ICON.check(14)} حفظ الملاحظة</button>`);
  if(m.type==='viewUnitNotes'){
    const notes=(S.unitNotes||[]).filter(n=>n.delivery_unit_id===m.id);
    return modalWrap('ملاحظات الوحدة', notes.length? notes.map(n=>`
      <div style="border-bottom:1px dashed var(--line);padding:10px 0;">
        <div style="font-size:13px;">${esc(n.note)}</div>
        ${n.photo?`<img src="${n.photo}" class="photo-preview" style="max-height:180px;">`:''}
        <div style="font-size:11px;color:var(--text-dim);margin-top:4px;">${fmtTime(n.created_at)} · ${n.created_at?n.created_at.slice(0,10):''}</div>
      </div>`).join('') : `<p style="color:var(--text-dim);font-size:13px;">لا توجد ملاحظات على هذه الوحدة</p>`);
  }
  if(m.type==='scan'||m.type==='scanAudit') return modalWrap('مسح رمز QR', `
    <div class="scan-stage" id="scan-stage"><div class="scan-msg" id="scan-msg"><span class="em">📷</span>جارِ محاولة تشغيل الكاميرا...</div></div>
    <div style="margin-top:12px;">
      <label class="ghost-btn file-btn" style="display:block;text-align:center;">${ICON.upload()} أو ارفع صورة لرمز QR<input type="file" accept="image/*" id="qr-file-input" capture="environment"></label>
    </div>`);
  if(m.type==='confirmChecklist') return modalWrap('تأكيد تنفيذ المهمة', `
    <div class="form-row"><label>ملاحظات (اختياري)</label><textarea id="cf-notes"></textarea></div>
    <div class="form-row"><label>صورة إثبات (اختياري)</label>
      <label class="ghost-btn file-btn" style="display:block;text-align:center;">${ICON.camera()} إضافة صورة<input type="file" accept="image/*" capture="environment" id="cf-photo"></label>
      <img id="cf-photo-preview" class="photo-preview" style="display:none;">
    </div>
    <button class="primary-btn" style="width:100%;justify-content:center;" id="m-save">${ICON.check(14)} تم التنفيذ</button>`);
  return '';
}
function modalWrap(title, body, wide){
  const sizeClass = wide==='full' ? ' full' : (wide? ' wide' : '');
  return `<div class="modal-bg" data-close-modal="1"><div class="modal${sizeClass}" onclick="event.stopPropagation()">
    <div class="modal-head"><h3>${esc(title)}</h3><button class="close" data-close-modal="1">${ICON.x()}</button></div>
    <div class="modal-body">${body}</div>
  </div></div>`;
}
function supervisorOptions(){
  return S.users.filter(u=>u.role==='supervisor' && u.active).map(u=>`<option value="${u.id}">${esc(u.full_name)}</option>`).join('');
}

function bindModalEvents(){
  document.querySelectorAll('[data-close-modal]').forEach(b=>b.onclick=(e)=>{ if(e.target!==b) return; stopScanner(); S.modal=null; S.scanCtx=null; render(); });
  const saveBtn=document.getElementById('m-save');
  if(saveBtn) saveBtn.onclick=handleModalSave;
  if(S.modal && S.modal.type==='qr') renderQrCanvas();
  if(S.modal && (S.modal.type==='scan'||S.modal.type==='scanAudit')) startScanner();
  const qf=document.getElementById('qr-file-input'); if(qf) qf.onchange=e=>decodeFromFile(e.target.files[0]);
  const cfPhoto=document.getElementById('cf-photo'); if(cfPhoto) cfPhoto.onchange=e=>handlePhotoSelect(e.target.files[0]);
  const ordDateInput=document.getElementById('m-ord-date');
  if(ordDateInput){ updateOrderAvailabilityMsg(ordDateInput.value); ordDateInput.onchange=()=>updateOrderAvailabilityMsg(ordDateInput.value); }
  const ordUnitInput=document.getElementById('m-ord-unit'), ordTypeSel=document.getElementById('m-ord-type');
  if(ordUnitInput && ordTypeSel){
    const updateOrdPrice=()=>{ const p=calcOrderPrice(ordTypeSel.value, ordUnitInput.value); document.getElementById('ord-price-msg').innerHTML = priceDisplayHtml(p, false); };
    ordUnitInput.oninput=updateOrdPrice; ordTypeSel.onchange=updateOrdPrice; updateOrdPrice();
  }
  const pestUnitInput=document.getElementById('m-pest-unit'), pestTypeSel=document.getElementById('m-pest-type');
  if(pestUnitInput && pestTypeSel){
    const updatePestPrice=()=>{ const isSpec = pestTypeSel.value==='specialized_spray'; const p=calcPestPrice(pestTypeSel.value, pestUnitInput.value); document.getElementById('pest-price-msg').innerHTML = priceDisplayHtml(p, isSpec); };
    pestUnitInput.oninput=updatePestPrice; pestTypeSel.onchange=updatePestPrice; updatePestPrice();
  }
  const addKpiBtn=document.getElementById('add-kpi-btn');
  if(addKpiBtn) addKpiBtn.onclick=async ()=>{
    const month=document.getElementById('m-kpi-month').value;
    if(!month){ toast('حدد الشهر',false); return; }
    const phase=document.getElementById('m-kpi-phase').value;
    const supplier = S.suppliers.find(x=>x.id===S.modal.id);
    const items = kpiTemplateFor(supplier?supplier.category:null).map((k,idx)=>{
      const actual = +document.getElementById(`kpi-actual-${idx}`).value || 0;
      return { category:k.category, name:k.name, weight:k.weight, actual, status: actual<k.weight? 'Needs Attention':'' };
    });
    const overall_score = items.reduce((s,i)=>s+i.actual, 0);
    await dbInsert('supplier_kpi',[{ id:uid('kpi'), supplier_id:S.modal.id, month, phase, items:JSON.stringify(items), overall_score, score:overall_score, company_name: supplier?supplier.name:'', created_by:S.session.user.id }]);
    await loadSuppliers(); render(); toast('تم حفظ تقييم الشهر',true);
  };
  document.querySelectorAll('[data-kpi-pdf]').forEach(b=>b.onclick=()=>printKpiReport(b.dataset.kpiPdf));
  document.querySelectorAll('[data-kpi-edit]').forEach(b=>b.onclick=()=>{ const supplierId=S.modal.id; S.modal={type:'editKpi', id:b.dataset.kpiEdit, supplierId}; render(); });
  document.querySelectorAll('[data-kpi-del]').forEach(b=>b.onclick=async ()=>{ await dbDelete('supplier_kpi', b.dataset.kpiDel); await loadSuppliers(); render(); toast('تم حذف التقييم',true); });
  const addInvBtn=document.getElementById('add-invoice-btn');
  if(addInvBtn) addInvBtn.onclick=async ()=>{
    const amount=document.getElementById('m-inv-amount').value;
    const discount=document.getElementById('m-inv-discount').value||0;
    const invoice_date=document.getElementById('m-inv-date').value;
    const status=document.getElementById('m-inv-status').value;
    const phase=document.getElementById('m-inv-phase').value;
    if(!amount||!invoice_date){ toast('استكمل مبلغ وتاريخ الفاتورة',false); return; }
    await dbInsert('supplier_invoices',[{ id:uid('inv'), supplier_id:S.modal.id, amount:+amount, discount:+discount, invoice_date, phase, status, photo:pendingPhoto, created_by:S.session.user.id, paid_at: status==='paid'? new Date().toISOString():null }]);
    pendingPhoto=null;
    await loadSuppliers(); render(); toast('تم إضافة الفاتورة',true);
  };
  document.querySelectorAll('[data-view-inv-photo]').forEach(img=>img.onclick=()=>{
    const inv = S.supplierInvoices.find(x=>x.id===img.dataset.viewInvPhoto);
    if(inv && inv.photo) window.open(inv.photo, '_blank');
  });
  document.querySelectorAll('[data-inv-status]').forEach(sel=>sel.onchange=async ()=>{
    await dbUpdate('supplier_invoices', sel.dataset.invStatus, { status:sel.value, paid_at: sel.value==='paid'? new Date().toISOString():null });
    await loadSuppliers(); render(); toast('تم تحديث حالة الفاتورة',true);
  });
  document.querySelectorAll('[data-inv-edit]').forEach(b=>b.onclick=()=>{ const supplierId=S.modal.id; S.modal={type:'editInvoice', id:b.dataset.invEdit, supplierId}; render(); });
  document.querySelectorAll('[data-inv-del]').forEach(b=>b.onclick=async ()=>{ await dbDelete('supplier_invoices', b.dataset.invDel); await loadSuppliers(); render(); toast('تم حذف الفاتورة',true); });
  document.querySelectorAll('[data-sup-tab]').forEach(b=>b.onclick=()=>{ S.supplierDetailTab=b.dataset.supTab; render(); });
  const delSupBtn=document.getElementById('del-supplier-btn');
  if(delSupBtn) delSupBtn.onclick=()=>{ S.modal={type:'confirmDeleteSupplier', id:S.modal.id}; render(); };
}

async function handleModalSave(){
  const m=S.modal;
  if(m.type==='addDelivery'){
    const unit_code=document.getElementById('m-unit-code').value.trim();
    if(!unit_code){ toast('اكتب كود الوحدة',false); return; }
    const row={ id:uid('dv'), unit_code, date:document.getElementById('m-unit-date').value, assigned_supervisor_id: document.getElementById('m-unit-sup').value||null, notes: document.getElementById('m-unit-notes').value.trim(), status:'scheduled', created_by:S.session.user.id };
    if(await dbInsert('delivery_units',[row])){ await loadDeliveries(); S.modal=null; render(); toast('تمت الإضافة',true); }
  }
  else if(m.type==='assignDelivery'){
    const sup=document.getElementById('m-assign-sup').value;
    if(await dbUpdate('delivery_units', m.id, {assigned_supervisor_id:sup})){ await loadDeliveries(); S.modal=null; render(); toast('تم التعيين',true); }
  }
  else if(m.type==='addOrder'){
    const scheduled_date = document.getElementById('m-ord-date').value;
    if(ordersCountForDate(scheduled_date) >= MAX_ORDERS_PER_DAY){
      const next = findNextAvailableOrderDate(scheduled_date);
      toast(`اليوم ده مكتمل${next?' — أقرب موعد متاح: '+next:''}`, false);
      return;
    }
    const ord_unit_code = document.getElementById('m-ord-unit').value.trim();
    const ord_type = document.getElementById('m-ord-type').value;
    const row={ id:uid('ord'), unit_code:ord_unit_code, order_type:ord_type, scheduled_date, scheduled_time:document.getElementById('m-ord-time').value, client_info:document.getElementById('m-ord-client').value.trim(), status:'scheduled', price:calcOrderPrice(ord_type, ord_unit_code), payment_status:document.getElementById('m-ord-payment').value, payment_photo:pendingPhoto, created_by:S.session.user.id };
    if(await dbInsert('paid_service_orders',[row])){ pendingPhoto=null; await loadOrders(); S.modal=null; render(); toast('تم إنشاء الأوردر',true); }
  }
  else if(m.type==='assignOrder'){
    const sup=document.getElementById('m-assign-sup').value;
    const notes=document.getElementById('m-ord-notes').value.trim();
    if(await dbUpdate('paid_service_orders', m.id, {assigned_supervisor_id:sup, opm_notes:notes, assigned_by:S.session.user.id})){ await loadOrders(); S.modal=null; render(); toast('تم التعيين',true); }
  }
  else if(m.type==='addInstall'){
    const description=document.getElementById('m-in-desc').value.trim();
    if(!description){ toast('اكتب وصف العمل',false); return; }
    const row={ id:uid('in'), date:document.getElementById('m-in-date').value, shift:document.getElementById('m-in-shift').value, description, status:'scheduled', created_by:S.session.user.id };
    if(await dbInsert('installation_works',[row])){ await loadInstalls(); S.modal=null; render(); toast('تمت الجدولة',true); }
  }
  else if(m.type==='postponeInstall'){
    const reason=document.getElementById('m-postpone-reason').value.trim();
    if(!reason){ toast('لازم تكتب سبب التأجيل',false); return; }
    if(await dbUpdate('installation_works', m.id, {status:'postponed', postpone_reason:reason, updated_by:S.session.user.id, updated_at:new Date().toISOString()})){ await loadInstalls(); S.modal=null; render(); toast('تم تسجيل التأجيل',true); }
  }
  else if(m.type==='addChecklistDef'){

/* ============================= QR SCAN (checklist) ============================= */
function renderQrCanvas(){
  const el=document.getElementById('qr-render-target'); if(!el||typeof QRCode==='undefined') return;
  el.innerHTML=''; new QRCode(el,{text:S.qrTarget.code,width:190,height:190,colorDark:'#0E2A2B',colorLight:'#ffffff'});
}
async function startScanner(){
  const stage=document.getElementById('scan-stage'); const msgBox=document.getElementById('scan-msg'); if(!stage) return;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    S.stream=stream;
    stage.innerHTML=`<video id="scan-video" autoplay playsinline muted></video><div class="scan-frame">${ICON.bracket()}</div>`;
    const video=document.getElementById('scan-video'); video.srcObject=stream; await video.play();
    const canvas=document.createElement('canvas'); const ctx=canvas.getContext('2d'); let stopped=false;
    S.stopLoop=()=>{stopped=true;};
    function tick(){
      if(stopped||!S.scanCtx) return;
      if(video.readyState===video.HAVE_ENOUGH_DATA){
        canvas.width=video.videoWidth; canvas.height=video.videoHeight; ctx.drawImage(video,0,0,canvas.width,canvas.height);
        const img=ctx.getImageData(0,0,canvas.width,canvas.height); const code=jsQR(img.data,img.width,img.height);
        if(code&&code.data){ stopped=true; handleScannedCode(code.data); return; }
      }
      requestAnimationFrame(tick);
    }
    tick();
  }catch(e){
    if(msgBox) msgBox.innerHTML=`<span class="em">🚫</span>تعذّر الوصول للكاميرا. استخدم رفع صورة بدلاً من ذلك.`;
  }
}
function stopScanner(){ if(S.stopLoop) S.stopLoop(); if(S.stream){ S.stream.getTracks().forEach(t=>t.stop()); S.stream=null; } }
function decodeFromFile(file){
  if(!file) return;
  const reader=new FileReader();
  reader.onload=(e)=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas'); canvas.width=img.width; canvas.height=img.height;
      const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0);
      const data=ctx.getImageData(0,0,canvas.width,canvas.height); const code=jsQR(data.data,data.width,data.height);
      if(code&&code.data) handleScannedCode(code.data); else toast('لم يتم التعرف على الرمز',false);
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function handleScannedCode(code){
  const clean=(code||'').trim();
  if(S.scanCtx && S.scanCtx.mode==='audit'){
    const locId = clean.startsWith('ZEDWEST|LOC|') ? clean.split('|')[2] : clean;
    if(locId !== S.scanCtx.auditLocationId){ toast('هذا الكود يخص موقع مختلف',false); return; }
    stopScanner();
    submitAuditVisit(locId);
    return;
  }
  const defId = clean.startsWith('ZEDWEST|CL|') ? clean.split('|')[2] : clean;
  const inst = S.checklistInstances.find(ci=>ci.id===S.scanCtx.instanceId);
  if(!inst){ toast('تعذر إيجاد المهمة',false); return; }
  if(inst.checklist_definition_id !== defId){ toast('هذا الرمز يخص مهمة مختلفة',false); return; }
  const def=S.checklistDefs.find(c=>c.id===defId);
  if(def && def.valid_from && def.valid_to){
    const now=nowTimeStr();
    if(now < def.valid_from || now > def.valid_to){ toast('خارج وقت السماح بتنفيذ هذه المهمة ('+def.valid_from+' - '+def.valid_to+')', false); stopScanner(); S.modal=null; S.scanCtx=null; render(); return; }
  }
  stopScanner();
  S.modal={type:'confirmChecklist'};
  render();
}
async function submitAuditVisit(locId){
  const loc = S.locations.find(l=>l.id===locId);
  const todayChecklist = (S.checklistInstances||[]).filter(ci=>ci.location_id===locId && ci.date===S.today);
  const doneCount = todayChecklist.filter(ci=>ci.status==='completed').length;
  const row = { id:uid('av'), location_id:locId, senior_supervisor_id:S.session.user.id, note:`عند التدقيق: ${doneCount}/${todayChecklist.length} من قوائم التحقق منجزة` };
  await dbInsert('location_audit_visits',[row]);
  await loadDistData();
  S.modal=null; S.scanCtx=null; render();
  toast(`تم تسجيل زيارة تدقيق ${loc?loc.name:''} — ${doneCount}/${todayChecklist.length} منجزة`, true);
}
let pendingPhoto=null;
function handlePhotoSelect(file){
  if(!file) return;
  const reader=new FileReader();
  reader.onload=(e)=>{
    const img=new Image();
    img.onload=()=>{
      const maxW=700; const scale=Math.min(1,maxW/img.width);
      const canvas=document.createElement('canvas'); canvas.width=img.width*scale; canvas.height=img.height*scale;
      const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,canvas.width,canvas.height);
      pendingPhoto=canvas.toDataURL('image/jpeg',0.6);
      const prev=document.getElementById('cf-photo-preview'); prev.src=pendingPhoto; prev.style.display='block';
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ============================= ENSURE DAILY INSTANCES ============================= */
async function ensureTodayChecklistInstances(){
  const date=S.today;
  const existing = S.checklistInstances.filter(ci=>ci.date===date);
  const missing=[];
  S.checklistDefs.filter(c=>c.active).forEach(def=>{
    if(!existing.find(ci=>ci.checklist_definition_id===def.id)){
      missing.push({ id:uid('cli'), date, checklist_definition_id:def.id, location_id:def.location_id, shift:def.shift, status:'incomplete', supervisor_id:null, completed_at:null, notes:'', photo:null, scanned:false });
    }
  });
  if(missing.length){
    // upsert مع تجاهل التكرار: لو صف تاني (من طلب متزامن) سبقنا بنفس (التعريف+التاريخ)، تجاهله بهدوء بدل ما يفشل الإدخال كله
    const { error } = await sb.from('checklist_instances').upsert(missing, { onConflict:'checklist_definition_id,date', ignoreDuplicates:true });
    if(error) console.error('checklist_instances upsert', error);
  }
  S.checklistInstances = await dbSelect('checklist_instances');
}

async function loadRoleData(){
  const role=S.profile.role;
  const isMgmt = role==='admin'||role==='opm';
  const distRoles = ['admin','opm','hk_manager','hk_admin','hk_senior_supervisor'];
  const wantsChecklist = isMgmt || role==='hk_senior_supervisor' || role==='supervisor';
  const wantsOpsData = isMgmt || role==='supervisor';

  const jobs = {
    locations: dbSelect('locations'),
    users: dbSelect('profiles'),
  };
  if(distRoles.includes(role)){
    jobs.zones = dbSelect('zones');
    jobs.sessions = dbSelect('distribution_sessions', { date: S.today });
    jobs.presence = dbSelect('daily_presence', { date: S.today });

    jobs.orders = dbSelect('paid_service_orders');

    jobs.units = dbSelect('units_master');

    jobs.waste = dbSelect('waste_removal_jobs');
    jobs.deliveries = dbSelect('delivery_units');
    jobs.unitNotes = dbSelect('unit_notes');
    jobs.units = dbSelect('units_master');
  }
  if(isMgmt || role==='contractor_manager') jobs.installs = dbSelect('installation_works');

    jobs.supplierInvoices = dbSelect('supplier_invoices');
  }
  if(isMgmt || role==='contractor_manager' || role==='contractor_admin' || role==='hk_admin' || role==='hk_manager') jobs.attendance = dbSelect('attendance_records');

  const keys = Object.keys(jobs);
  const results = await Promise.all(keys.map(k=>jobs[k]));
  const data = {}; keys.forEach((k,i)=>data[k]=results[i]);

  S.locations = data.locations || S.locations;
  S.users = data.users || S.users;
  if(data.zones) S.zones = data.zones;
  if(data.sessions) S.distSession = data.sessions[0] || null;
  if(data.presence) S.presence = data.presence;
  if(data.zoneAssignments) S.zoneAssignments = data.zoneAssignments;
  if(data.locationAssignments) S.locationAssignments = data.locationAssignments;
  if(data.auditVisits) S.auditVisits = data.auditVisits;
  if(data.orders) S.orders = data.orders;
  if(data.pest) S.pest = data.pest;
  if(data.units) S.units = data.units;
  if(data.facade) S.facade = data.facade;
  if(data.waste) S.waste = data.waste;
  if(data.deliveries) S.deliveries = data.deliveries;
  if(data.unitNotes) S.unitNotes = data.unitNotes;
  if(data.installs) S.installs = data.installs;
  if(data.checklistDefs) S.checklistDefs = data.checklistDefs;
  if(data.checklistInstances) S.checklistInstances = data.checklistInstances;
  if(data.complaints) S.complaints = data.complaints;
  if(data.suppliers) S.suppliers = data.suppliers;
  if(data.supplierKpi) S.supplierKpi = data.supplierKpi;
  if(data.supplierInvoices) S.supplierInvoices = data.supplierInvoices;
  if(data.attendance) S.attendance = data.attendance;

  if(wantsChecklist) await ensureTodayChecklistInstances();
}

const ALL_WATCHED_TABLES = {
  ...NOTIFY_TABLES,
  daily_presence:{module:'الحضور الفردي', tab:'distribution'}, zone_assignments:{module:'توزيع زون', tab:'distribution'},
  location_assignments:{module:'توزيع موقع', tab:'distribution'}, distribution_sessions:{module:'بدء توزيع', tab:'distribution'},
  checklist_instances:{module:'قوائم التحقق اليومية', tab:'checklist'}, checklist_definitions:{module:'عنصر قوائم تحقق', tab:'checklist'},
  attendance_records:{module:'الحضور', tab:'attendance'}, zones:{module:'زون', tab:'locations'}, locations:{module:'موقع', tab:'locations'},
  suppliers:{module:'مورد', tab:'suppliers'}, supplier_invoices:{module:'فاتورة مورد', tab:'suppliers'}, supplier_kpi:{module:'تقييم مورد', tab:'suppliers'},
  profiles:{module:'مستخدم', tab:'users'},
};
const EVENT_LABEL = { INSERT:'إضافة', UPDATE:'تعديل', DELETE:'حذف' };
let realtimeSetup = false;
let pollingStarted = false;
function setupRealtime(){
  if(!sb) return;
  if(!realtimeSetup){
    realtimeSetup = true;
    const channel = sb.channel('zw-live-updates');
    const allTables = Array.from(new Set([...Object.keys(NOTIFY_TABLES), ...SILENT_REFRESH_TABLES, ...Object.keys(ALL_WATCHED_TABLES)]));
    allTables.forEach(table=>{
      channel.on('postgres_changes', { event:'*', schema:'public', table }, (payload)=>{
        handleRealtimeEvent(table, payload);
      });
    });
    channel.subscribe((status)=>{
      if(status==='CHANNEL_ERROR' || status==='TIMED_OUT' || status==='CLOSED'){
        // الاتصال قفل لأي سبب (شبكة، مهلة، إلخ) — نحاول نعيد الاتصال بعد شوية
        try{ sb.removeChannel(channel); }catch(e){}
        realtimeSetup = false;
        setTimeout(setupRealtime, 4000);
      }
    });
  }
  // شبكة أمان: تحديث دوري كل 25 ثانية حتى لو الاتصال اللحظي فشل تمامًا (بدون ما يقاطع أي مودال مفتوح)
  if(!pollingStarted){
    pollingStarted = true;
    setInterval(()=>{
      if(!S.session || S.modal) return;
      loadRoleData().then(render).catch(()=>{});
    }, 25000);
  }
}
async function handleRealtimeEvent(table, payload){
  await loadRoleData();
  const myRole = S.profile.role;

  // 1) صوت + إشعار للمهام الجديدة المخصصة لدور/شخص معين (زي ما كان)
  if(payload.eventType==='INSERT' && NOTIFY_TABLES[table]){
    const info = NOTIFY_TABLES[table];
    const row = payload.new;
    const isManagement = MGMT_ROLES.includes(myRole);
    const isAssignedToMe = info.field && row[info.field] && S.session && row[info.field]===S.session.user.id;
    if(isManagement || isAssignedToMe){
      pushNotification(`مهمة جديدة: ${info.module}`, info.tab);
      playAlertSound();
    }
  }
  // 2) الإدارة و OPM بس: إشعار بأي تغيير (إضافة/تعديل/حذف) على أي جدول في السيستم، حتى لو مش مهمة جديدة
  else if((myRole==='admin'||myRole==='opm') && ALL_WATCHED_TABLES[table]){
    const info = ALL_WATCHED_TABLES[table];
    pushNotification(`${EVENT_LABEL[payload.eventType]||'تغيير'}: ${info.module}`, info.tab);
  }
  render();
}
function pushNotification(text, tab){
  S.notifications.unshift({ id: uid('ntf'), text, tab, time: new Date().toISOString(), read:false });
  S.notifications = S.notifications.slice(0, 30);
}
function playAlertSound(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0,0.18].forEach(delay=>{
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type='sine'; o.frequency.value=880;
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.35, ctx.currentTime+delay);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+delay+0.16);
      o.start(ctx.currentTime+delay); o.stop(ctx.currentTime+delay+0.17);
    });
  }catch(e){}
}

(async function init(){
  if(configMissing()){ render(); return; }
  await refreshSession();
  sb.auth.onAuthStateChange((event)=>{ if(event==='SIGNED_OUT'){ S.session=null; S.profile=null; realtimeSetup=false; render(); } });
  if(S.session) await bootApp(); else render();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
